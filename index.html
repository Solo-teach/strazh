o":"art_account"},{"label":"Журнал планировщика","goto":"art_runs"},{"label":"Операции кассы магазина №31","goto":"art_cashier"},{"label":"📷 Журнал смены дежурных (от Марата)","goto":"art_shiftlog","requires":["f_shiftlog_got"]},{"label":"← Назад","goto":"hub"}]},"menu_docs":{"type":"menu","text":["Документы программы «Полка Бонус»:"],"buttons":[{"label":"Правила сгорания баллов","goto":"art_rules"},{"label":"Описание задания bonus_expire","goto":"art_spec"},{"label":"Инструкция дежурного","goto":"art_duty"},{"label":"Реестр фоновых заданий","goto":"art_registry"},{"label":"← Назад","goto":"hub"}]},"menu_people":{"type":"menu","text":["Кого вызываем?"],"buttons":[{"label":"Марат, старший смены склада","goto":"int_marat"},{"label":"Алина, менеджер лояльности","goto":"int_alina"},{"label":"Георгий, дежурный эксплуатации","goto":"int_gosha"},{"label":"Валерия, аналитик","goto":"int_lera"},{"label":"← Назад","goto":"hub"}]},"art_complaints":{"type":"artifact","artifact":"d_complaints","text_after":["Сеня: «Жалобы пришли со всей сети, и все про одну ночь. Возьмите одного покупателя и разберите его счёт до балла. Общая картина появится из частного случая»."],"buttons":[{"label":"Открыть счёт Ирины К.","goto":"art_account"},{"label":"← В штаб","goto":"hub"}]},"art_account":{"type":"artifact","artifact":"d_account","text_after":["Сеня: «Две операции EXPIRE по 500, с разницей в пятьдесят одну минуту. Прежде чем обсуждать вторую, проверим первую: сколько у Ирины должно было сгореть по правилам?»"],"buttons":[{"label":"Открыть правила сгорания","goto":"art_rules"},{"label":"← В штаб","goto":"hub"}]},"art_rules":{"type":"artifact","artifact":"d_rules","requires_hint":{"if_missing":"f_account","text":["Сеня: «Правила без конкретного счёта проверять нечем. Откройте счёт Ирины К. из обращений, к нему и приложим таблицу»."]},"buttons":[{"label":"🔍 Отметить на счёте, что сгорает 3 октября","goto":"mini_rules","requires":["f_account"]},{"label":"Открыть счёт Ирины К.","goto":"art_account"},{"label":"← В штаб","goto":"hub"}]},"mini_rules":{"type":"interact","kind":"lines","artifact":"d_account","back":"art_rules","hint":"отметьте начисления, которые сгорают 3 октября","text":["<b>Мини-задача: таблица решений</b>","","Приложите правила П1–П6 к счёту Ирины К. Отметьте начисления, у которых день сгорания выпадает на 3 октября 2026 года."],"answer":["ACCRUE  покупка    +400","ACCRUE  акция      +200"],"mode":"all","on_correct":{"sets_flags":["k_rules"],"clarity":1,"text":["✅ Два начисления.","","Покупка 03.10.25 на 400 баллов прожила свои 365 дней. Из неё потрачено 100 (П5: сначала тратятся старые), сгорает остаток 300.","Акция «Осень» от 03.09: 30 дней истекают 3 октября, сгорает 200.","Подарок на день рождения сгорит только 9 октября, покупка от 20.09 через год.","300 + 200 = 500. Ровно столько и списала первая операция.","","Сеня: «Значит, правила посчитали верно. Сломано не правило, а то, сколько раз его применили. Вторая операция — точная копия первой»."],"button":"В штаб","goto":"hub"},"on_wrong":{"clarity":-1,"attempts":3,"text":["Не сходится. По П6 день сгорания = день начисления + срок жизни. Отметьте только начисления ACCRUE, у которых он выпадает на 3 октября 2026 года."],"goto":"art_rules"}},"art_runs":{"type":"artifact","artifact":"d_runs","text_after":["Сеня: «Задание bonus_expire запускалось дважды за ночь. Первый раз упало, второй раз его запустил человек. Сопоставьте время с операциями на счёте Ирины»."],"buttons":[{"label":"🔍 Восстановить хронологию ночи","goto":"mini_night"},{"label":"← В штаб","goto":"hub"}]},"mini_runs":{"type":"choice","text":["<b>Мини-задача: журнал прогонов</b>","","Почему жалуются около двух тысяч покупателей, а не все 3 790, у кого в эту ночь сгорали баллы?"],"buttons":[{"label":"Первый прогон успел обработать 2 318 карт, а повтор начал список с первой карты","correct":true,"sets_flags":["k_rerun"],"clarity":1,"feedback":["✅ Карты с 1 по 2 318 прошли через сгорание дважды: в первом прогоне и в повторе. Остальные 1 472 — один раз, как и положено.","","Ирина попала в первую часть списка: 02:31 — первый прогон, 03:22 — повтор.","","Сеня: «Повтор ничего не знает о том, что успел сделать первый прогон. Для него это обычная ночь и обычный список»."],"goto":"show_twice"},{"label":"Первый прогон упал и ничего не списал, а повтор списал дважды","clarity":-1,"feedback":["У Ирины есть операция в 02:31, когда шёл первый прогон. Значит, он успел списать."],"goto":"art_runs"},{"label":"Остальные просто не заметили и не пожаловались","clarity":-1,"feedback":["412 жалоб — это не 2 318 пострадавших, тут вы правы. Но граница в журнале есть, и она точная: посмотрите, сколько карт обработано до сбоя."],"goto":"art_runs"}]},"show_twice":{"type":"artifact","artifact":"d_twice","buttons":[{"label":"🗣 Спросить дежурного про перезапуск","goto":"int_gosha"},{"label":"← В штаб","goto":"hub"}]},"art_spec":{"type":"artifact","artifact":"d_spec","text_after":["Сеня: «Представьте, что задание запустили второй раз в ту же ночь. Пройдите по шагам: какой из них возьмёт уже сгоревшие начисления?»"],"buttons":[{"label":"🔍 Отметить шаг, который списывает повторно","goto":"mini_spec"},{"label":"← В штаб","goto":"hub"}]},"mini_key":{"type":"choice","text":["<b>Мини-задача: требование к повторному запуску</b>","","Какое требование к заданию bonus_expire закрыло бы эту дыру?"],"buttons":[{"label":"Повторный запуск за ту же дату не меняет результат: начисление, у которого уже есть EXPIRE за эту дату, пропускается","correct":true,"sets_flags":["k_key"],"clarity":1,"feedback":["✅ У каждой операции сгорания появляется ключ: карта + начисление + дата сгорания. Если операция с таким ключом уже есть, второй раз её не пишут.","","Сеня: «У программистов это называется идемпотентность. По-бытовому: сколько ни нажимай кнопку лифта, второй лифт не приедет. У склада есть то же самое — номер накладной: по одной накладной дважды не отгружают»."],"goto":"hub"},{"label":"Задание не должно падать по таймауту","clarity":-1,"feedback":["Сбои будут всегда: база, сеть, обновление сервера. Требование должно описывать, что происходит после сбоя."],"goto":"art_spec"},{"label":"Перезапускать задание только днём, под присмотром","clarity":-1,"feedback":["Днём оно спишет второй раз точно так же, только при свидетелях."],"goto":"art_spec"},{"label":"Запретить перезапуск совсем","clarity":-1,"feedback":["Тогда у 1 472 покупателей просроченные баллы не сгорят вовсе. Задание нужно перезапускать, но так, чтобы повтор был безопасным."],"goto":"art_spec"}]},"art_duty":{"type":"artifact","artifact":"d_duty","text_after":["Сеня: «Прочитайте её глазами дежурного в три часа ночи. Какой пункт опасен для задания, которое списывает баллы?»"],"buttons":[{"label":"🔍 Отметить опасный пункт","goto":"mini_duty"},{"label":"Посмотреть реестр фоновых заданий","goto":"art_registry"},{"label":"← В штаб","goto":"hub"}]},"art_registry":{"type":"artifact","artifact":"d_registry","sets_flags":["k_owner"],"text_after":["Сеня: «Инструкция говорит: если не помогло, звони владельцу. Реестр отвечает: владельца нет. Получается, решение о перезапуске задания, которое списывает баллы двум тысячам человек, в три часа ночи принимает дежурный в одиночку»."],"buttons":[{"label":"🗣 Поговорить с Валерией","goto":"int_lera"},{"label":"← В штаб","goto":"hub"}]},"art_cashier":{"type":"artifact","artifact":"d_cashier","text_after":["Сеня: «Касса чистая. Садовая жалуется больше всех, потому что там больше всего карт. Версия закрыта — это тоже результат»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"int_marat":{"type":"dialogue","speaker":"marat","sets_flags":["f_marat"],"lines":["<b>Марат, старший смены склада</b>","","— Я первым и написал, ещё до поддержки. Утром пуш: «У вас сгорело 640 баллов». А у меня столько и не сгорало, я считал, кружку хотел взять.","— Посмотрел счёт: два списания за ночь, одинаковых. Как будто дважды провели одну накладную."],"buttons":[{"label":"«Почему вы сравнили с накладной?»","goto":"int_marat_2"},{"label":"← Назад","goto":"menu_people"}]},"int_marat_2":{"type":"dialogue","speaker":"marat","lines":["— На складе так не бывает. У накладной номер. Пробьёшь второй раз — система скажет: эта уже проведена.","— А у баллов, видать, номера нет. Списали и забыли.","— И ещё. У нас на складе ночные задания тоже перезапускают, когда падают. Дежурный, по бумажке. Я после той истории с кружками на них нервно смотрю.","","Сеня: «Марат опять раньше всех. Он описал требование, которого нет в документах: у операции должен быть номер, по которому видно, что она уже проведена»."],"buttons":[{"label":"Открыть журнал планировщика","goto":"art_runs"},{"label":"← В штаб","goto":"hub"}]},"int_alina":{"type":"dialogue","speaker":"alina","sets_flags":["f_alina"],"lines":["<b>Алина, менеджер программы лояльности</b>","","— Правила сгорания утверждала я, в марте. Они прозрачные, у нас таблица. Ничего в них не менялось.","— Как именно задание их применяет, это вопрос к ИТ. Мы бизнес, мы правила пишем."],"buttons":[{"label":"«Кто владелец задания bonus_expire?»","goto":"int_alina_2"},{"label":"← Назад","goto":"menu_people"}]},"int_alina_2":{"type":"dialogue","speaker":"alina","lines":["— Не мы. Мы его не заказывали, оно было до меня.","— Я спрашивала ИТ, они говорят: мы только запускаем, логику пусть определяет бизнес. Вот так и живём.","","Сеня: «Обратите внимание: правила есть у бизнеса, запуск есть у ИТ, а вопрос „что будет, если задание запустить дважды“ не принадлежит никому. Такие вопросы и превращаются в инциденты»."],"buttons":[{"label":"Открыть правила сгорания","goto":"art_rules"},{"label":"← В штаб","goto":"hub"}]},"int_gosha":{"type":"dialogue","speaker":"gosha","sets_flags":["f_gosha"],"lines":["<b>Георгий, дежурный эксплуатации</b>","","— Всё по инструкции. В 02:47 задание упало, в 03:15 я его перезапустил, в 03:41 оно отработало. Зелёное.","— Я так каждую неделю делаю. Отчёты, выгрузки, синхронизации. Никогда ничего не случалось."],"buttons":[{"label":"Предъявить счёт Ирины К.","goto":"int_gosha_press","requires":["f_account"]},{"label":"Обвинить в самовольном перезапуске","goto":"dead_gosha"},{"label":"← Назад","goto":"menu_people"}]},"int_gosha_press":{"type":"dialogue","speaker":"gosha","sets_flags":["f_gosha_2"],"lines":["— Две по пятьсот?.. Подождите.","— То есть оно не продолжает, где упало? Оно начинает заново?","— Мне никто не говорил. В инструкции написано: упало — перезапусти. Там нет ни слова, что какие-то задания нельзя.","— Я бы позвонил владельцу, если бы он был. В реестре прочерк.","","Сеня: «Дежурный не может знать, безопасен ли повтор. Это должно быть написано в описании задания. А там про повтор нет ничего»."],"buttons":[{"label":"Открыть описание задания","goto":"art_spec"},{"label":"← В штаб","goto":"hub"}]},"int_lera":{"type":"dialogue","speaker":"lera","sets_flags":["f_lera"],"lines":["<b>Валерия, аналитик «Полки+»</b>","","— Да, я теперь здесь. После истории с шаблоном ушла от подрядчика.","— Мне поручили реестр фоновых заданий. Сорок строк в Excel на общем диске. Я добавила колонку «владелец». Заполнить нечем."],"buttons":[{"label":"«А что значит „согласовано: склад, ИТ“?»","goto":"int_lera_2"},{"label":"← Назад","goto":"menu_people"}]},"int_lera_2":{"type":"dialogue","speaker":"lera","clarity":1,"lines":["— Я думала, это подписи двух отделов. Пошла на склад: они бонусы не согласовывали никогда. Купоны и пуши тоже.","— Пока не понимаю, откуда эта строка. Но она стоит у всех сорока.","","Сеня: «Запомните эту строку. Если согласование стоит у задания, которое к складу отношения не имеет, значит, оно ничего не согласовывало. Мы к этому ещё вернёмся»."],"buttons":[{"label":"Открыть реестр","goto":"art_registry"},{"label":"← В штаб","goto":"hub"}]},"why_1":{"type":"choice","text":["<b>Метод «5 почему», шаг 1 из 5</b>","","Сеня: «Спрашиваем „почему“, пока ответ не перестанет быть техническим».","","❓ Почему у 2 318 покупателей сгорело вдвое больше положенного?"],"buttons":[{"label":"Потому что задание bonus_expire списало их баллы дважды за одну ночь","correct":true,"goto":"why_2"},{"label":"Потому что правила сгорания посчитали неверно","clarity":-1,"feedback":["Первое списание у Ирины ровно 500, как по таблице. Ошибка не в сумме, а в количестве списаний."],"goto":"why_1"},{"label":"Потому что кассиры списывали баллы вручную","clarity":-1,"feedback":["Ручных списаний ноль, а двойные сгорания были ночью, когда магазины закрыты."],"goto":"why_1"}]},"why_2":{"type":"choice","text":["<b>«5 почему», шаг 2 из 5</b>","","❓ Почему задание списало дважды?"],"buttons":[{"label":"Оно упало на середине, дежурный перезапустил его, и повтор начал список с начала","correct":true,"goto":"why_3"},{"label":"Его запустили по московскому и по новосибирскому времени","clarity":-1,"feedback":["Расписание одно, на 02:00. Второй запуск ручной, в журнале есть имя дежурного."],"goto":"why_2"}]},"why_3":{"type":"choice","text":["<b>«5 почему», шаг 3 из 5</b>","","❓ Почему повтор списал те же баллы ещё раз?"],"buttons":[{"label":"Задание не проверяет, сгорело ли уже начисление: у операции сгорания нет ключа","correct":true,"goto":"why_4"},{"label":"Дежурный должен был перезапускать не с начала","clarity":-1,"feedback":["У задания нет режима «продолжить». Дежурный нажал единственную кнопку, которая есть."],"goto":"why_3"}]},"why_4":{"type":"choice","text":["<b>«5 почему», шаг 4 из 5</b>","","❓ Почему задание не проверяет повтор?"],"buttons":[{"label":"В описании задания нет требования к повторному запуску","correct":true,"goto":"why_5"},{"label":"Разработчик 2018 года плохо написал код","clarity":-1,"feedback":["Код делает ровно то, что описано в четырёх шагах. Требования проверять повтор в описании нет."],"goto":"why_4"}]},"why_5":{"type":"choice","text":["<b>«5 почему», шаг 5 из 5 — последний</b>","","❓ Почему такого требования нет, и почему за восемь лет никто этого не заметил?"],"buttons":[{"label":"Фоновые задания принимают в эксплуатацию без владельца и без требований к сбою и повторному запуску","correct":true,"sets_flags":["k_chain"],"clarity":2,"feedback":["✅ Дошли до дна.","","Задание написали в 2018 году, проверили, что оно списывает, и забыли. Что будет при сбое, никто не спросил: у задания не было хозяина, которому этот вопрос задают. Инструкцию дежурного писали отдельно, одну на все сорок заданий.","","Сеня: «Сбой — это не исключение, а штатное событие. Вопрос „что будет, если запустить дважды“ — обычный вопрос аналитика. Его не задали, потому что задать было некому»."],"goto":"hub"},{"label":"Дежурный не подумал, прежде чем перезапускать","clarity":-1,"feedback":["Дежурный выполнил инструкцию. Если процесс держится на том, что человек в три часа ночи догадается сам, это ненадёжный процесс."],"goto":"why_5"},{"label":"База данных слишком медленная, отсюда таймаут","clarity":-1,"feedback":["Таймаут запустил цепочку, но сбой может случиться по сотне причин. Вопрос в том, почему сбой превратился в двойное списание."],"goto":"why_5"}]},"hypotheses":{"type":"choice","text":["🧪 <b>ВЕРСИИ</b>","","Сеня: «Версию проверяют, а не защищают. Выберите ту, которую готовы уронить»."],"buttons":[{"label":"А. Кассир магазина №31 списывает баллы","goto":"dead_cashier"},{"label":"Б. Задание сработало дважды из-за часовых поясов","goto":"dead_timezone"},{"label":"В. Маркетинг ошибся в правилах сгорания","goto":"dead_rules"},{"label":"Г. Повтор после сбоя: задание не защищено от второго запуска","goto":"hypo_right"},{"label":"← В штаб","goto":"hub"}]},"hypo_right":{"type":"message","clarity":1,"condition":{"if_flags_missing":["k_rerun","k_key"],"text":["Сеня: «Направление верное, но подтверждать пока нечем. Покажите по журналу, кого задело дважды, и найдите в описании задания, чего в нём не хватает. Иначе это догадка»."],"goto":"hub"},"text":["✅ Версия подтверждается тремя источниками: счёт Ирины с двумя одинаковыми списаниями, журнал с ручным перезапуском и описание задания без требования к повтору.","","Сеня: «Причина, механизм, следы. Осталось понять, почему за восемь лет этот вопрос никто не задал»."],"buttons":[{"label":"«Почему?» → метод «5 почему»","goto":"why_1"},{"label":"📝 К заключению","goto":"report_guard"},{"label":"← В штаб","goto":"hub"}]},"dead_cashier":{"type":"dead_end","clarity":-2,"artifact":"d_cashier","text":["🚫 <b>Тупик.</b>","","Служба безопасности проверяет кассу на Садовой. Два дня, все чеки, все смены. Результат: ни одного ручного списания, ночью магазин закрыт.","Кассир Денис спрашивает, может ли он теперь вернуться к работе.","","Сеня: «Больше всего жалоб там, где больше всего карт. Это пропорция, а не улика. Минус два к ясности — и минус два дня одному честному кассиру»."],"buttons":[{"label":"Применить «5 почему» и вернуться","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"dead_timezone":{"type":"dead_end","clarity":-2,"text":["🚫 <b>Тупик.</b>","","Версия красивая: у «Полки+» магазины от Калининграда до Новосибирска, вдруг задание сработало по двум часовым поясам.","Вы поднимаете настройки планировщика. Расписание одно: 02:00 по Москве. Второй запуск в 03:15 — ручной, в журнале имя: duty.g.lebedev.","","Сеня: «Часовые пояса тут ни при чём. Хотя запомните эту версию: в этой компании они ещё кому-нибудь испортят ночь»."],"buttons":[{"label":"Применить «5 почему» и вернуться","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"dead_rules":{"type":"dead_end","clarity":-2,"text":["🚫 <b>Тупик.</b>","","Вы требуете от маркетинга пересчитать правила. Алина с командой полдня прогоняют таблицу по сотне счетов. Каждое первое списание совпадает с таблицей до балла.","","Алина: «Я же говорила, правила верные». Теперь она говорит это всем, кто готов слушать, и на следующую встречу приходит с руководителем.","","Сеня: «Правила считают, сколько сгорает. А сколько раз — решает задание. Вы проверяли не тот механизм»."],"buttons":[{"label":"Применить «5 почему» и вернуться","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"dead_gosha":{"type":"dead_end","clarity":-2,"text":["🚫 <b>Тупик.</b>","","Вы пишете, что дежурный самовольно перезапустил задание. Георгия отстраняют от ночных смен.","Следующей ночью падает задание coupon_issue. Новый дежурный, глядя на историю Георгия, не перезапускает его. Утром 96 покупателей не получают купоны ко дню рождения, и поддержка снова в огне.","","Сеня: «Проверка простая: убрали человека — проблема исчезла? Нет, просто сменила форму. Дежурный выполнял инструкцию, а инструкция не различает задания»."],"buttons":[{"label":"Применить «5 почему» и вернуться","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"senya_hint":{"type":"hint","clarity":-1,"logic":"Выдать первую подходящую подсказку по цепочке флагов","rules":[{"if_missing":"f_account","text":"Сеня: «Не начинайте с общей картины. Откройте счёт одного покупателя, Ирины К., и посмотрите, какие операции прошли за ночь»."},{"if_missing":"k_rules","text":"Сеня: «Проверьте первую операцию: приложите правила к счёту Ирины и отметьте, что сгорает 3 октября. Если сумма сойдётся, правила можно вычеркнуть»."},{"if_missing":"k_rerun","text":"Сеня: «Две операции в 02:31 и 03:22. Загляните в журнал планировщика: что происходило с заданием между ними?»"},{"if_missing":"f_spec","text":"Сеня: «Задание запустили второй раз, и оно списало снова. Посмотрите в его описании, что там сказано про повторный запуск»."},{"if_missing":"k_key","text":"Сеня: «Как отличить уже сгоревшее начисление от несгоревшего? Подумайте про номер накладной, о котором говорил Марат»."},{"if_missing":"k_owner","text":"Сеня: «Инструкция дежурного велит звонить владельцу задания. Найдите его в реестре фоновых заданий»."},{"if_missing":"k_chain","text":"Сеня: «Механизм у вас есть. Причины нет. Прогоните „5 почему“ от двойного списания до процесса»."},{"default":"Сеня: «Всё существенное найдено. Идите в заключение: причина, компонент, рекомендация»."}]},"report_guard":{"type":"gate","condition":{"required_flags":["k_rerun","k_key","k_chain"],"on_fail":{"clarity":-3,"text":["⚠️ Вы выходите к директору с незаконченной картиной.","","Первый вопрос: «Если мы вернём баллы, это не повторится в следующий сбой?» Ответа нет.","","Сеня: «Ясность −3. Заключение без механизма — это извинение перед покупателями, а не расследование. Вернитесь и достройте цепочку»."],"goto":"hub"}},"goto":"report_cause"},"report_cause":{"type":"choice","text":["📝 <b>АНАЛИТИЧЕСКОЕ ЗАКЛЮЧЕНИЕ</b> · поле 1 из 3","","<b>Корневая причина:</b>"],"buttons":[{"label":"Задание приняли без владельца и без требований к повторному запуску, а инструкция велит перезапускать любое упавшее","correct":true,"score":3,"goto":"report_component"},{"label":"Дежурный перезапустил задание, не подумав о последствиях","score":0,"feedback_after":"Дежурный действовал по инструкции. Знать последствия повтора он не мог: их нет ни в одном документе.","goto":"report_component"},{"label":"Таймаут базы данных","score":1,"feedback_after":"Частично: сбой запустил цепочку. Но сбои будут и дальше, вопрос в том, почему сбой стал двойным списанием.","goto":"report_component"},{"label":"Ошибка в правилах сгорания","score":0,"feedback_after":"Правила верные: первое списание совпадает с таблицей до балла.","goto":"report_component"}]},"report_component":{"type":"choice","text":["📝 Поле 2 из 3","","<b>Затронутые компоненты:</b>"],"buttons":[{"label":"Задание bonus_expire + инструкция дежурного по ночным заданиям","correct":true,"score":3,"goto":"report_reco"},{"label":"Только задание bonus_expire","score":1,"goto":"report_reco"},{"label":"База данных программы лояльности","score":0,"goto":"report_reco"},{"label":"Касса магазина №31","score":0,"goto":"report_reco"}]},"report_reco":{"type":"input","kind":"choice_or_text","text":["📝 Поле 3 из 3","","<b>Рекомендация.</b> Выберите вариант или впишите свой в одну строку."],"buttons":[{"label":"Назначить каждому фоновому заданию владельца и описать, что происходит при повторном запуске","correct":true,"score":3,"goto":"ending_calc"},{"label":"Добавить в bonus_expire проверку уже сгоревших начислений","score":2,"feedback_after":"Это чинит одно задание из сорока. Следующее упадёт и задвоит что-нибудь другое.","goto":"ending_calc"},{"label":"Запретить дежурным перезапускать задания","score":0,"feedback_after":"Тогда упавшие задания будут молча не доделывать работу. Это другой инцидент, а не решение.","goto":"ending_calc"},{"label":"Перевести базу на сервер помощнее","score":0,"feedback_after":"Сбой станет реже, но не исчезнет. А с ним вернётся и двойное списание.","goto":"ending_calc"}],"text_accept":{"keywords_high":["повторн","перезапуск","владел","хозя","ключ","идемпотент","реестр"],"score_if_keyword":3,"score_default":1}},"ending_calc":{"type":"router","logic":"score = сумма трёх полей (макс 9); учитывать остаток ясности","routes":[{"if":"clarity <= 0","goto":"ending_fail"},{"if":"score >= 8 && clarity >= 9","goto":"ending_perfect"},{"if":"score >= 6","goto":"ending_good"},{"if":"score >= 3","goto":"ending_weak"},{"default":"ending_wrong"}]},"ending_perfect":{"type":"ending","title":"Дело раскрыто. Чисто","text":["🏆 <b>Дело №1 сезона 2 закрыто</b>","","Баллы не съел ни кассир, ни часовой пояс. Их списала одна и та же операция, запущенная дважды, потому что за восемь лет никто не спросил, что будет при повторе.","","Итог: 2 318 покупателям вернули баллы и начислили по 200 сверху с извинениями. У операции сгорания появился ключ «карта + начисление + дата». В инструкции дежурного теперь есть колонка «можно ли перезапускать».","","Валерия добавила в реестр ещё два поля: «что будет при повторном запуске» и «кого оповестить». Заполнено у одного задания из сорока.","","Георгий снова на ночных сменах. Марат купил кружку.","","Сеня: «Осталось тридцать девять. И у меня плохое предчувствие насчёт автозаказа»."],"rewards":["Значок «Дважды не сгорает»"]},"ending_good":{"type":"ending","title":"Дело раскрыто","text":["✅ <b>Дело №1 сезона 2 закрыто</b>","","Причина названа верно: повтор после сбоя. Баллы вернули, задание доработали.","Директор спросил, сколько ещё таких заданий. Вы ответили «посмотрим». Он попросил в следующий раз приходить с цифрой.","","Сеня: «Неплохо. Но вопрос „а у остальных тридцати девяти так же?“ должен задавать аналитик, а не директор»."],"rewards":["Дело №1 сезона 2 раскрыто"]},"ending_weak":{"type":"ending","title":"Симптом вылечен, болезнь осталась","text":["⚠️ <b>Дело закрыто формально</b>","","В bonus_expire добавили проверку: уже сгоревшее второй раз не сгорает. Баллы вернули, все довольны.","","Через месяц падает coupon_issue. Дежурный перезапускает его по той же инструкции. 96 именинников получают по два купона на скидку 30 %, и половина приходит с ними в один день.","","Сеня: «Починили одно задание из сорока. Остальные тридцать девять живут по старой инструкции»."]},"ending_wrong":{"type":"ending","title":"Не тот виновный","text":["❌ <b>Заключение отклонено</b>","","Ваша версия не объясняет, почему у всех пострадавших два одинаковых списания с разницей в час и почему остальные полторы тысячи покупателей не пострадали.","Дело передали другому аналитику. Он начал со счёта одного покупателя.","","Сеня: «Причина обязана объяснять все факты. Здесь главный факт — две одинаковые строки на одном счёте»."]},"ending_fail":{"type":"ending","title":"Вас сняли с дела","text":["🚫 <b>Ясность 0</b>","","Слишком много версий раньше фактов. Директор по клиентскому сервису забирает дело со словами «разберёмся сами».","","Сеня: «Прежде чем выдвигать версию, спросите себя: какой факт я собираюсь ею объяснить?»"]},"art_shiftlog":{"type":"artifact","artifact":"d_shiftlog","clarity":1,"text_after":["Сеня: «Март. Тот же перезапуск, три жалобы, закрыты как ошибка покупателя. В июне купоны выдали дважды и списали на маркетинг. Дефект показывался уже дважды, просто тогда задание падало в начале списка, и задело немногих»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"mini_night":{"type":"interact","kind":"order","back":"art_runs","text":["<b>Мини-задача: журнал прогонов</b>","","Сведите журнал планировщика и счёт Ирины в одну ленту. Нажимайте события в том порядке, в каком они случились ночью."],"items":["Задание стартует по расписанию, в списке 3 790 карт","У Ирины сгорают первые 500 баллов","Задание падает по таймауту базы","Дежурный запускает задание вручную","У Ирины сгорают ещё 500 баллов","Покупателям уходят утренние пуши о сгорании"],"on_correct":{"clarity":1,"text":["✅ 02:00 старт, 02:31 первое списание, 02:47 сбой, 03:15 ручной запуск, 03:22 второе списание, 07:00 пуши.","","Сеня: «Второе списание случилось после ручного запуска. Осталось понять, почему пострадали не все»."],"button":"Разобрать два прогона","goto":"mini_runs"},"on_wrong":{"clarity":-1,"attempts":3,"text":["Порядок не сходится. Верное начало я оставил, остальное вернул. Сверьте время в журнале с временем операций на счёте Ирины."],"goto":"art_runs"}},"mini_spec":{"type":"interact","kind":"lines","artifact":"d_spec","back":"art_spec","hint":"отметьте шаг алгоритма","mode":"subset","text":["<b>Мини-задача: чтение требований</b>","","Отметьте шаг алгоритма, из-за которого повторный запуск в ту же ночь списывает те же баллы ещё раз."],"answer":["1. Выбрать начисления","2. Для каждого начисления"],"on_correct":{"clarity":1,"text":["✅ Шаг 1 берёт начисления по дате, а дата в ту же ночь та же. Шаг 2 считает остаток как «начислено минус потрачено» и не учитывает, что часть уже сгорела.","","Сеня: «Повтор видит ровно ту же картину, что и первый прогон. Для задания это обычная ночь»."],"button":"Какого требования не хватает","goto":"mini_key"},"on_wrong":{"clarity":-1,"attempts":2,"text":["Этот пункт ни при чём. Ищите шаг, который решает, что именно списывать."],"goto":"art_spec"}},"mini_duty":{"type":"interact","kind":"lines","artifact":"d_duty","back":"art_duty","hint":"отметьте опасный пункт","mode":"subset","text":["<b>Мини-задача: ревью регламента</b>","","Отметьте, что в инструкции дежурного делает повторное списание возможным."],"answer":["2. Если задание в статусе FAIL","Перечень заданий, которые нельзя"],"on_correct":{"clarity":1,"text":["✅ Пункт 2 одинаковый для всех сорока заданий: упало — перезапусти. Список исключений пуст.","","Сеня: «Для отчёта повтор безопасен, он просто посчитается заново. Для задания, которое списывает деньги, нет. А пункт 3 отправляет к владельцу, которого надо ещё найти»."],"button":"Посмотреть реестр заданий","goto":"art_registry"},"on_wrong":{"clarity":-1,"attempts":2,"text":["Этот пункт безобиден. Ищите то, что дежурный делает с упавшим заданием."],"goto":"art_duty"}}},"clock":{"start":"07:40","deadline":"10:00","label":"совещание у директора","late_text":["Директор не стал ждать. Заключение всё равно нужно, но чистого раскрытия уже не будет."],"late_epilogue":["⏱ Вы опоздали к 10:00. Извинение покупателям ушло без объяснения причины, и под ним спрашивают, не повторится ли это. За утро жалоб стало 640."],"cost":{"artifact":4,"dialogue":6,"dead_end":40}},"events":[{"id":"dir_1","at":"07:50","from":"Директор по сервису","text":["В 10:00 жду у себя с причиной. Мне нужно решить: возвращаем баллы сегодня или ждём, пока разберёмся."],"speaker":"director"},{"id":"support","at":"08:35","from":"Линия поддержки","text":["Жалоб уже 518. Две покупательницы пишут, что закрывают карту. Что им отвечать?"],"speaker":"support"},{"id":"marat","after_flag":"k_rerun","from":"Марат","sets_flags":["f_shiftlog_got"],"text":["Слышал, вы копаете ночной перезапуск. Наш дежурный ведёт журнал смены от руки, там все ручные перезапуски за год. Сфоткал и положил в материалы дела, раздел «Данные и логи»."],"speaker":"marat"},{"id":"dir_2","at":"09:30","from":"Директор по сервису","text":["Полчаса. Что я скажу на встрече? Кто виноват?"],"speaker":"director"},{"id":"dir_late","when_late":true,"from":"Директор по сервису","text":["Начали без вас. Решили вернуть баллы всем пострадавшим и разослать извинение. Причину впишем, когда пришлёте."],"speaker":"director"}]}];

(() => {
  "use strict";

  let CASE = null, N = {}, A = {};
  const feed = document.getElementById("feed");
  const kb = document.getElementById("kb");
  const bars = document.getElementById("bars");
  const hsub = document.getElementById("hsub");

  const S = {
    clarity: 0,
    score: 0,
    flags: new Set(),
    seen: new Set(),
    rewarded: new Set(),
    attempts: {},
    node: null,
    over: true,
    min: 0,          // игровое время в минутах от полуночи (если у дела есть часы)
    late: false,     // дедлайн прошёл
    fired: new Set(),
    visited: new Set()
  };

  const lines = (v) => Array.isArray(v) ? v.join("\n") : (v || "");
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  // <b>, <i>, <code> из сценария оставляем, остальное экранируем не нужно —
  // источник данных наш собственный файл сценария.
  function say(text, cls) {
    const d = document.createElement("div");
    d.className = "msg" + (cls ? " " + cls : "");
    d.innerHTML = lines(text).replace(/\n/g, "<br>");
    feed.appendChild(d);
    scroll();
    return d;
  }

  function pic(svg, cap) {
    const d = document.createElement("div");
    d.className = "msg cover";
    d.innerHTML = svg + (cap ? `<div class="cap">${cap.map(c => `<span>${c}</span>`).join("")}</div>` : "");
    feed.appendChild(d);
    scroll();
  }

  function talk(who, text, name) {
    const d = document.createElement("div");
    d.className = "msg talk";
    d.innerHTML = `<div>${ART.portrait(who, name)}<div class="who">${name}</div></div>` +
      `<div>${lines(text).replace(/\n/g, "<br>")}</div>`;
    feed.appendChild(d);
    scroll();
  }

  function stamp(text, kind, small) {
    const d = document.createElement("div");
    d.className = "stamp " + kind + (small ? " small" : "");
    d.textContent = text;
    feed.appendChild(d);
    scroll();
  }

  function sys(text, dir) {
    const d = document.createElement("div");
    d.className = "sys" + (dir ? " " + dir : "");
    d.textContent = text;
    feed.appendChild(d);
    scroll();
  }

  function scroll() {
    requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }));
  }

  function paintClarity() {
    if (!CASE) { bars.innerHTML = ""; return; }
    const max = CASE.clarity.max;
    bars.className = "bars" + (S.clarity <= 3 ? " low" : "");
    bars.innerHTML = Array.from({ length: max },
      (_, i) => `<i class="bar${i < S.clarity ? "" : " off"}"></i>`).join("");
  }

  // ---------- часы и события ----------
  // Часы есть только у дел с блоком clock. Время тратят документы, допросы и тупики;
  // после дедлайна игра продолжается, но чистое раскрытие закрыто и мир реагирует.

  const clockEl = document.getElementById("clock");
  const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const fmt = (m) => String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
  const COST = { artifact: 5, dialogue: 8, dead_end: 45, hint: 10, choice_wrong: 3, check: 3, revisit: 1 };
  const cost = (k) => (CASE.clock.cost && CASE.clock.cost[k] != null) ? CASE.clock.cost[k] : COST[k];

  function paintClock(bump) {
    if (!CASE || !CASE.clock) { clockEl.innerHTML = ""; clockEl.className = "clock"; return; }
    clockEl.className = "clock" + (S.late ? " late" : "") + (bump ? " tick" : "");
    clockEl.innerHTML = `<div class="clock-t">${fmt(S.min)}</div><div class="clock-d">${S.late ? "опоздали" : "до " + CASE.clock.deadline}</div>`;
  }

  function spend(m) {
    if (!CASE.clock || !m || S.over) return;
    S.min += m;
    if (!S.late && S.min >= toMin(CASE.clock.deadline)) {
      S.late = true;
      SFX.late();
      sys(CASE.clock.deadline + " · " + CASE.clock.label + " началось без вас", "down");
      if (CASE.clock.late_text) say(CASE.clock.late_text, "bad");
    }
    paintClock(true);
  }

  function fireEvents() {
    if (!CASE || !CASE.events || S.over) return;
    const ev = CASE.events.find(e => !S.fired.has(e.id) &&
      (!e.at || S.min >= toMin(e.at)) &&
      (!e.after_flag || has(e.after_flag)) &&
      (!e.when_late || S.late));
    if (!ev) return;
    S.fired.add(ev.id);
    if (ev.sets_flags) setFlags(ev.sets_flags);
    const node = S.node;
    setTimeout(() => {
      if (S.over || !CASE) return;
      SFX.ping();
      const d = document.createElement("div");
      const ava = ev.speaker && ART.has(ev.speaker);
      d.className = "msg inbox" + (ava ? " with-ava" : "");
      const body = `<div class="from">📩 ${ev.from} · ${fmt(S.min)}</div>` + lines(ev.text).replace(/\n/g, "<br>");
      d.innerHTML = ava ? `<div class="ava">${ART.portrait(ev.speaker, ev.from)}</div><div>${body}</div>` : body;
      feed.appendChild(d);
      if (ev.clarity) clarity(ev.clarity);
      // сообщение могло открыть новую кнопку — перерисовать меню текущего узла
      const cur = N[node];
      if (ev.sets_flags && S.node === node && cur && cur.buttons && ["menu", "hub", "artifact", "dialogue", "message"].includes(cur.type))
        navKeys(cur.buttons, b => go(b.goto));
      scroll();
    }, 650);
  }

  function clarity(delta, quiet) {
    if (!delta) return;
    if (!quiet) (delta > 0 ? SFX.up : SFX.down)();
    S.clarity = Math.max(0, Math.min(CASE.clarity.max, S.clarity + delta));
    sys((delta > 0 ? "ясность +" : "ясность −") + Math.abs(delta), delta > 0 ? "up" : "down");
    paintClarity();
  }

  // бонус за узел или ответ — один раз за прохождение, штрафы — всегда
  function gain(key, delta) {
    if (delta > 0) {
      if (S.rewarded.has(key)) return;
      S.rewarded.add(key);
    }
    clarity(delta);
  }

  function conditionFails(n) {
    return !!(n.condition && n.condition.if_flags_missing &&
              n.condition.if_flags_missing.some(f => !has(f)));
  }

  function setFlags(list) { (list || []).forEach(f => S.flags.add(f)); }
  function has(f) { return S.flags.has(f); }

  function artifactsSeen() {
    return CASE.player.evidence.filter(k => S.seen.has(k)).length;
  }

  function fill(t) {
    return lines(t)
      .replace("{clarity}", S.clarity)
      .replace("{artifacts_count}", artifactsSeen());
  }

  // ---------- клавиатура ----------

  function keys(list) {
    kb.innerHTML = "";
    list.filter(b => !b.requires || b.requires.every(has)).forEach(b => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "key" + (/^←/.test(b.label) ? " back" : "") + (b.risk ? " risk" : "");
      btn.textContent = b.label;
      btn.onclick = () => { if (!S.over || b.always) { SFX.key(); b.act(); } };
      kb.appendChild(btn);
    });
    scroll();
  }

  function navKeys(buttons, onPick) {
    keys((buttons || []).map(b => ({
      label: b.label,
      requires: b.requires,
      risk: /обвинить|саботаж/i.test(b.label),
      act: () => onPick(b)
    })));
  }

  function checkDead() {
    if (S.clarity <= 0 && !S.over) { go("ending_fail"); return true; }
    return false;
  }

  // ---------- переход ----------

  function go(id) {
    const n = N[id];
    if (!n) { say("<i>Узел не найден: " + id + "</i>"); return; }
    S.node = id;

    // время: первый просмотр документа или разговор стоят дороже повторного
    if (CASE.clock) {
      if (n.type === "artifact") spend(S.seen.has(n.artifact) ? cost("revisit") : cost("artifact"));
      else if (n.type === "dialogue") spend(S.visited.has(id) ? cost("revisit") : cost("dialogue"));
      else if (n.type === "dead_end") spend(cost("dead_end"));
      else if (n.type === "hint") spend(cost("hint"));
    }
    S.visited.add(id);

    // общие эффекты входа; тупик и подсказка списывают ясность сами,
    // а версия без опор не должна давать бонус
    if (n.sets_flags) setFlags(n.sets_flags);
    const selfCharged = n.type === "dead_end" || n.type === "hint";
    if (typeof n.clarity === "number" && !selfCharged && !conditionFails(n)) gain(id, n.clarity);

    render(n);
    fireEvents();
  }

  function render(n) {
    switch (n.type) {
      case "interact":    return n.kind === "order" ? nodeOrder(n) : nodeLines(n);
      case "message":     return nodeMessage(n);
      case "hub":         return nodeHub(n);
      case "menu":        return nodeMenu(n);
      case "artifact":    return nodeArtifact(n);
      case "dialogue":    return nodeDialogue(n);
      case "choice":      return nodeChoice(n);
      case "input":       return nodeInput(n);
      case "dead_end":    return nodeDeadEnd(n);
      case "hint":        return nodeHint(n);
      case "gate":        return nodeGate(n);
      case "router":      return nodeRouter(n);
      case "ending":      return nodeEnding(n);
      default:            return nodeMessage(n);
    }
  }

  // ---------- типы узлов ----------

  function nodeMessage(n) {
    if (conditionFails(n)) {
      say(n.condition.text, "bad");
      return keys([{ label: "← В штаб", act: () => go(n.condition.goto) }]);
    }
    say(n.text, "good");
    navKeys(n.buttons, b => go(b.goto));
  }

  function nodeHub(n) {
    if (checkDead()) return;
    sys(fill(n.header));
    say(n.text);
    navKeys(n.buttons, b => go(b.goto));
  }

  function nodeMenu(n) {
    say(n.text);
    navKeys(n.buttons, b => go(b.goto));
  }

  function docBox(a) {
    const box = document.createElement("div");
    box.className = "msg doc";
    const body = a.ascii
      ? `<pre>${esc(a.ascii.join("\n"))}</pre>`
      : lines(a.text).replace(/\n/g, "<br>");
    box.innerHTML = ART.clip() +
      `<div class="doc-head"><span>${a.tag}</span><span>${a.title}</span></div>
       <div class="doc-body">${body}${a.note ? `<div class="note">${a.note}</div>` : ""}</div>`;
    feed.appendChild(box);
    SFX.page();
    scroll();
  }

  function nodeArtifact(n) {
    const a = A[n.artifact];
    const first = !S.seen.has(n.artifact);
    S.seen.add(n.artifact);
    docBox(a);

    if (first) setFlags(a.sets_flags);

    // подсказка, если рано пришли
    if (n.requires_hint && !has(n.requires_hint.if_missing)) {
      say(n.requires_hint.text);
    }
    // условный бонус за верный порядок изучения
    if (n.on_enter_if && has(n.on_enter_if.flag) && first) {
      setFlags(n.on_enter_if.sets_flags);
      if (n.on_enter_if.clarity) clarity(n.on_enter_if.clarity);
      say(n.on_enter_if.text, "good");
    } else if (n.on_enter_if && has(n.on_enter_if.flag)) {
      say(n.on_enter_if.text);
    }
    if (n.text_after) say(n.text_after);

    if (checkDead()) return;
    navKeys(n.buttons, b => go(b.goto));
  }

  function nodeDialogue(n) {
    const who = n.speaker && CASE.characters[n.speaker];
    if (who && ART.has(n.speaker)) {
      // первая строка узла — «<b>Имя, роль</b>»: под портретом имя уже есть, но роль нужна
      talk(n.speaker, n.lines, who.name);
    } else {
      say(n.lines);
    }
    if (checkDead()) return;
    navKeys(n.buttons, b => go(b.goto));
  }

  function nodeChoice(n) {
    if (n.artifact) docBox(A[n.artifact]);
    say(n.text, "verdict");

    navKeys(n.buttons, b => {
      say("→ " + b.label, b.correct ? "good" : "");
      if (typeof b.score === "number") S.score += b.score;
      if (b.sets_flags) setFlags(b.sets_flags);
      if (b.clarity) gain(S.node + " > " + b.label, b.clarity);
      if (CASE.clock && b.clarity < 0) spend(cost("choice_wrong"));
      if (b.feedback) say(b.feedback, b.correct ? "good" : "bad");
      if (b.feedback_after) say(b.feedback_after);
      if (checkDead()) return;
      go(b.goto);
    });
  }

  function nodeInput(n) {
    say(n.text, "verdict");

    const wrap = document.createElement("div");
    wrap.className = "entry";
    wrap.innerHTML = `<input type="text" placeholder="ваш ответ" aria-label="ответ"><button type="button">Ответить</button>`;
    kb.innerHTML = "";
    kb.appendChild(wrap);

    // у поля рекомендации есть и кнопки, и свободный ввод
    if (n.buttons) {
      n.buttons.forEach(b => {
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "key"; btn.textContent = b.label;
        btn.onclick = () => {
          say("→ " + b.label, b.correct ? "good" : "");
          if (typeof b.score === "number") S.score += b.score;
          if (b.feedback_after) say(b.feedback_after);
          go(b.goto);
        };
        kb.appendChild(btn);
      });
    }

    const input = wrap.querySelector("input");
    const send = () => {
      const raw = input.value.trim();
      if (!raw) return;
      say("→ " + esc(raw));

      if (n.accept) {
        const ok = n.accept.some(a => raw.toLowerCase().replace(/\s/g, "") === a.toLowerCase());
        const branch = ok ? n.on_correct : n.on_wrong;
        if (ok) {
          setFlags(branch.sets_flags);
          if (branch.clarity) gain(S.node + " > верно", branch.clarity);
          say(branch.text, "good");
          return go(branch.goto);
        }
        S.attempts[S.node] = (S.attempts[S.node] || 0) + 1;
        const limit = branch.attempts || 2;
        if (S.attempts[S.node] >= limit) {
          S.attempts[S.node] = 0;
          say("Хватит гадать. Вернитесь к документу и посмотрите внимательнее.", "bad");
          return go(branch.goto);
        }
        if (branch.clarity) clarity(branch.clarity);
        say(branch.text, "bad");
        if (checkDead()) return;
        input.value = "";
        input.focus();
        return;
      }

      if (n.text_accept) {
        const low = raw.toLowerCase();
        const hit = n.text_accept.keywords_high.some(k => low.includes(k));
        S.score += hit ? n.text_accept.score_if_keyword : n.text_accept.score_default;
        say(hit
          ? "Формулировка принята: вы говорите о процессе, а не о строчке кода."
          : "Записано. Формулировка узкая — она чинит случай, но не причину.",
          hit ? "good" : "");
        return go(n.buttons[0].goto);
      }
    };
    wrap.querySelector("button").onclick = send;
    input.onkeydown = (e) => { if (e.key === "Enter") send(); };
    scroll();
  }

  // ---------- улики руками ----------

  // общий исход интерактивного задания: верно — бонус и дальше, неверно — штраф и ещё попытка
  function verdict(n, ok, retry) {
    spend(cost("check"));
    if (ok) {
      const b = n.on_correct;
      setFlags(b.sets_flags);
      if (b.clarity) gain(S.node + " > верно", b.clarity);
      say(b.text, "good");
      if (checkDead()) return;
      keys([{ label: b.button || "Дальше", act: () => go(b.goto) }]);
      return fireEvents();
    }
    const b = n.on_wrong;
    S.attempts[S.node] = (S.attempts[S.node] || 0) + 1;
    if (b.clarity) clarity(b.clarity);
    if (checkDead()) return;
    if (S.attempts[S.node] >= (b.attempts || 2)) {
      S.attempts[S.node] = 0;
      say(b.text_final || "Хватит гадать. Вернитесь к документу и посмотрите внимательнее.", "bad");
      return keys([{ label: "← Вернуться к документу", act: () => go(b.goto) }]);
    }
    say(b.text, "bad");
    retry();
  }

  // «ткни в строку»: документ со строками-кнопками, отметить нужные и проверить
  function nodeLines(n) {
    const a = A[n.artifact];
    S.seen.add(n.artifact);
    say(n.text, "verdict");
    const src = a.ascii || (Array.isArray(a.text) ? a.text : [a.text]);
    const box = document.createElement("div");
    box.className = "msg doc";
    box.innerHTML = ART.clip() + `<div class="doc-head"><span>${a.tag}</span><span>${a.title}</span></div>
      <div class="pick-hint">${n.hint || "отметьте строки маркером"}</div>
      <div class="doc-body"><div class="lines ${a.ascii ? "mono" : "text"}"></div></div>`;
    const wrap = box.querySelector(".lines");
    const rows = src.map((t) => {
      const d = document.createElement("div");
      const empty = !t.trim() || /^-{6,}$/.test(t.trim());
      d.className = "ln" + (empty ? " empty" : "");
      if (a.ascii) d.textContent = t || " "; else d.innerHTML = t || "&nbsp;";
      if (!empty) d.onclick = () => {
        if (wrap.classList.contains("done")) return;
        d.classList.remove("bad");
        d.classList.toggle("on");
        SFX.mark();
      };
      wrap.appendChild(d);
      return { d, right: !empty && n.answer.some(x => t.includes(x)) };
    });
    feed.appendChild(box);
    SFX.page();

    const showKeys = () => keys([
      { label: "✔ Проверить", act: check },
      { label: "← Назад", act: () => go(n.back || "hub") }
    ]);
    const check = () => {
      const picked = rows.filter(r => r.d.classList.contains("on"));
      if (!picked.length) return say("Сначала отметьте строки в документе: нажмите на них.");
      // all — отметить ровно нужные строки; subset — любые из нужных, но без лишних
      const ok = n.mode === "subset"
        ? picked.every(r => r.right)
        : rows.every(r => r.right === r.d.classList.contains("on"));
      say("→ отмечено строк: " + picked.length);
      if (ok) {
        wrap.classList.add("done");
        rows.forEach(r => { if (r.right && (n.mode !== "subset" || picked.includes(r))) r.d.classList.add("ok"); r.d.classList.remove("on"); });
        SFX.up();
      } else {
        picked.filter(r => !r.right).forEach(r => { r.d.classList.remove("on"); r.d.classList.add("bad"); });
      }
      verdict(n, ok, showKeys);
    };
    showKeys();
  }

  // «разложи по порядку»: нажимать карточки в правильной последовательности
  function nodeOrder(n) {
    say(n.text, "verdict");
    const items = n.items.map((t, i) => ({ t, i }));
    // перемешиваем так, чтобы порядок точно не совпал с правильным
    do { items.sort(() => Math.random() - .5); } while (items.every((x, k) => x.i === k));
    const box = document.createElement("div");
    box.className = "msg";
    box.style.maxWidth = "100%";
    box.innerHTML = `<div class="seq">${n.items.map((_, k) => `<div class="seq-slot"><b>${k + 1}</b><span>…</span></div>`).join("")}</div>
      <div class="deck"></div>`;
    feed.appendChild(box);
    const slots = [...box.querySelectorAll(".seq-slot")];
    const deck = box.querySelector(".deck");
    let placed = [];

    const draw = () => {
      slots.forEach((sl, k) => {
        const it = placed[k];
        sl.className = "seq-slot" + (it ? " filled" : "");
        sl.querySelector("span").textContent = it ? it.t : "…";
        // нажатие на заполненную ячейку возвращает карточку обратно
        sl.onclick = it ? () => { placed = placed.filter(x => x !== it); SFX.mark(); draw(); } : null;
      });
      // карточки лежат прямо под ячейками, чтобы на телефоне было видно, куда они встают
      deck.innerHTML = "";
      items.filter(it => !placed.includes(it)).forEach(it => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "card"; c.textContent = it.t;
        c.onclick = () => { placed.push(it); SFX.key(); draw(); };
        deck.appendChild(c);
      });
      kb.innerHTML = "";
      const add = (label, cls, act) => {
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "key" + cls; btn.textContent = label; btn.onclick = act;
        kb.appendChild(btn);
      };
      if (placed.length === items.length) add("✔ Проверить порядок", "", check);
      else if (placed.length) add("Сбросить", " back", () => { placed = []; draw(); });
      add("← Назад", " back", () => go(n.back || "hub"));
      if (!placed.length) box.scrollIntoView({ block: "start", behavior: "smooth" });
    };
    const check = () => {
      const ok = placed.every((it, k) => it.i === k);
      slots.forEach((sl, k) => sl.classList.add(placed[k].i === k ? "ok" : "bad"));
      say("→ порядок предложен");
      if (ok) { SFX.up(); slots.forEach(sl => { sl.onclick = null; }); }
      // при ошибке оставляем верное начало цепочки, остальное возвращаем в колоду
      verdict(n, ok, () => {
        let k = 0;
        while (k < placed.length && placed[k].i === k) k++;
        placed = placed.slice(0, k);
        setTimeout(draw, 500);
      });
    };
    draw();
  }

  function nodeDeadEnd(n) {
    clarity(n.clarity || 0, true);
    SFX.stamp();
    stamp("тупик", "lose", true);
    say(n.text, "bad");
    if (n.artifact) { S.seen.add(n.artifact); docBox(A[n.artifact]); }
    if (checkDead()) return;
    navKeys(n.buttons, b => go(b.goto));
  }

  function nodeHint(n) {
    const rule = n.rules.find(r => r.if_missing && !has(r.if_missing)) ||
                 n.rules.find(r => r.default);
    clarity(n.clarity || -1);
    talk("senya", lines(rule.text || rule.default).replace(/^Сеня:\s*/, ""), "Сеня");
    if (checkDead()) return;
    keys([{ label: "← В штаб", act: () => go("hub") }]);
  }

  function nodeGate(n) {
    const need = n.condition.required_flags;
    if (need.every(has)) return go(n.goto);
    const f = n.condition.on_fail;
    clarity(f.clarity);
    say(f.text, "bad");
    if (checkDead()) return;
    keys([{ label: "← В штаб", act: () => go(f.goto) }]);
  }

  function nodeRouter(n) {
    const ctx = { clarity: S.clarity, score: S.score };
    for (const r of n.routes) {
      if (r.default) return go(r.default);
      let ok = false;
      try { ok = Function("clarity", "score", "return (" + r.if + ");")(ctx.clarity, ctx.score); }
      catch (e) { ok = false; }
      // опоздавшим чистое раскрытие не положено
      if (ok) return go(S.late && r.goto === "ending_perfect" ? "ending_good" : r.goto);
    }
    go("ending_good");
  }

  function nodeEnding(n) {
    S.over = true;
    const solved = SOLVED.includes(S.node);
    (solved ? SFX.solved : SFX.failed)();
    stamp(solved ? "раскрыто" : S.node === "ending_fail" ? "снят с дела" : "закрыто", solved ? "win" : "lose");
    sys("дело закрыто · счёт заключения " + S.score + "/9 · ясность " + S.clarity + "/" + CASE.clarity.max +
        (CASE.clock ? " · время " + fmt(S.min) : ""));
    say("<b>" + n.title + "</b>", solved ? "good" : "bad");
    say(n.text, solved ? "good" : "bad");
    if (S.late && CASE.clock && CASE.clock.late_epilogue && S.node !== "ending_fail") say(CASE.clock.late_epilogue, "bad");
    if (n.rewards) say("🏅 " + n.rewards.join(" · "));
    const paid = season(CASE) > 1;
    if (solved && CASE.player.finale && ART.hero()) pic(ART.hero(), ["сезон " + season(CASE), "пройден"]);
    if (CASE.player.finale && !paid) say("Понравилось? Второй сезон «Спящие задания» уже идёт на <a href=\"" + BOOSTY + "\" target=\"_blank\" rel=\"noopener\">Бусти @solo_teach</a>: одно дело в месяц и разбор от автора. Разборы настоящих задач аналитика — в канале <a href=\"https://t.me/solo_teach\">@solo_teach</a>.");
    if (paid) say("Разбор дела от автора, шаблоны из него и кодовое слово к следующему делу — на <a href=\"" + BOOSTY + "\" target=\"_blank\" rel=\"noopener\">Бусти @solo_teach</a>.");
    saveResult(S.node);
    const i = caseIndex(), next = CASES[i + 1];
    const list = [{ label: "Начать дело заново", always: true, act: restart }];
    // в сезон 2 из финала сезона 1 ведём всегда: там вход по слову
    if (next && (season(next) > 1 ? season(next) !== season(CASE) || solved : solved)) list.unshift({
      label: (unlocked(i + 1) ? "📁 " : "🔑 ") + caseName(next) + ". " + next.player.short,
      always: true, act: () => unlocked(i + 1) ? openCase(i + 1) : askCode(i + 1)
    });
    list.push({ label: "← К списку дел", always: true, act: showCases });
    keys(list);
  }

  // ---------- прогресс и список дел ----------

  // раскрытое дело открывает следующее — так обещают награды в концовках
  const SOLVED = ["ending_perfect", "ending_good"];
  const RANK = { ending_perfect: 5, ending_good: 4, ending_weak: 3, ending_wrong: 2, ending_fail: 1 };
  const RESULT = {
    ending_perfect: "раскрыто чисто", ending_good: "раскрыто",
    ending_weak: "закрыто наполовину", ending_wrong: "закрыто с ошибкой", ending_fail: "сняты с дела"
  };
  const STORE = "cs_quest_progress";
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; } catch (e) { progress = {}; }

  function saveResult(ending) {
    const id = CASE.case_id, prev = progress[id];
    if (!prev || RANK[ending] > RANK[prev]) progress[id] = ending;
    try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) { /* без памяти тоже играем */ }
  }

  // ---------- сезон 2: доступ по кодовому слову из поста на Бусти ----------
  // В странице лежит только хэш слова. Открытое дело запоминается в браузере.

  const BOOSTY = "https://boosty.to/solo_teach";
  const CODES = "cs_quest_codes";
  let codes = {};
  try { codes = JSON.parse(localStorage.getItem(CODES) || "{}") || {}; } catch (e) { codes = {}; }

  function sha256(str) {
    const K = [], H = [];
    let n = 2, c = 0;
    const frac = (x) => ((x - Math.floor(x)) * 4294967296) >>> 0;
    while (c < 64) {
      let prime = true;
      for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
      if (prime) { if (c < 8) H[c] = frac(Math.pow(n, 1 / 2)); K[c++] = frac(Math.pow(n, 1 / 3)); }
      n++;
    }
    const bytes = Array.from(new TextEncoder().encode(str));
    const bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (bitLen >>> (i * 8)) & 255);
    const rot = (x, k) => (x >>> k) | (x << (32 - k));
    for (let off = 0; off < bytes.length; off += 64) {
      const w = [];
      for (let i = 0; i < 16; i++) w[i] = (bytes[off + i * 4] << 24) | (bytes[off + i * 4 + 1] << 16) | (bytes[off + i * 4 + 2] << 8) | bytes[off + i * 4 + 3];
      for (let i = 16; i < 64; i++) {
        const s0 = rot(w[i - 15], 7) ^ rot(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rot(w[i - 2], 17) ^ rot(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      let [a, b, cc, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const t1 = (h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        const t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
      }
      [a, b, cc, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) | 0; });
    }
    return H.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
  }

  const normCode = (s) => s.toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9]/g, "");
  const season = (c) => c.player.season || 1;
  const caseName = (c) => (season(c) > 1 ? "Сезон " + season(c) + " · " : "") + "Дело №" + c.player.number;

  function askCode(i) {
    const c = CASES[i];
    say([
      "🔑 <b>" + caseName(c) + ". " + c.player.short + "</b>",
      "",
      "Второй сезон выходит для подписчиков <a href=\"" + BOOSTY + "\" target=\"_blank\" rel=\"noopener\">Бусти @solo_teach</a>: одно дело в месяц и разбор к нему.",
      "Кодовое слово к этому делу — в посте для подписчиков. Введите его:"
    ], "verdict");
    const wrap = document.createElement("div");
    wrap.className = "entry";
    wrap.innerHTML = `<input type="text" placeholder="кодовое слово" aria-label="кодовое слово" autocomplete="off"><button type="button">Открыть</button>`;
    kb.innerHTML = "";
    kb.appendChild(wrap);
    [["Подписаться на Бусти", () => window.open(BOOSTY, "_blank", "noopener")], ["← К списку дел", showCases]].forEach(([label, act]) => {
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "key" + (/^←/.test(label) ? " back" : ""); btn.textContent = label;
      btn.onclick = () => { SFX.key(); act(); };
      kb.appendChild(btn);
    });
    const input = wrap.querySelector("input");
    const send = () => {
      const raw = normCode(input.value);
      if (!raw) return;
      if (sha256(raw) === c.player.code_sha256) {
        codes[c.case_id] = true;
        try { localStorage.setItem(CODES, JSON.stringify(codes)); } catch (e) { /* без памяти спросим ещё раз */ }
        SFX.up();
        return openCase(i);
      }
      SFX.down();
      say("Слово не подходит. Проверьте пост к делу на Бусти: у каждого дела слово своё.", "bad");
      input.value = "";
      input.focus();
    };
    wrap.querySelector("button").onclick = send;
    input.onkeydown = (e) => { if (e.key === "Enter") send(); };
    scroll();
  }

  function caseIndex() { return CASES.indexOf(CASE); }
  // сезон 1 открывается по цепочке, дела сезона 2 — каждое своим словом
  function unlocked(i) {
    const c = CASES[i];
    if (season(c) > 1) return !!codes[c.case_id] || !c.player.code_sha256;
    return i === 0 || SOLVED.includes(progress[CASES[i - 1].case_id]);
  }

  function showCases() {
    CASE = null; N = {}; A = {};
    S.over = true;
    paintClock();
    feed.innerHTML = "";
    hsub.textContent = "служебные расследования";
    paintClarity();
    pic(ART.cover("office"), ["отдел расследований", "дел: " + CASES.length]);
    say([
      "🗂 <b>ЦИФРОВОЙ СТРАЖ</b> · отдел расследований",
      "",
      "В каждом деле ищут виноватого человека, а сломан процесс.",
      "Ваша задача - найти механизм и доказать его документами.",
      "",
      "Следующее дело открывается, когда раскрыто предыдущее.",
      "",
      "<i>Игра канала <a href=\"https://t.me/solo_teach\">@solo_teach</a> про системный анализ.</i>"
    ]);
    const item = (c, i) => {
      const p = c.player, open = unlocked(i), res = progress[c.case_id], paid = season(c) > 1;
      const tail = res ? " · " + RESULT[res] : (open ? " · " + c.estimated_minutes + " мин" : (paid ? " · по кодовому слову" : ""));
      return {
        label: (open ? (SOLVED.includes(res) ? "✓ " : "📁 ") : (paid ? "🔑 " : "🔒 ")) + caseName(c) + ". " + p.short + tail,
        always: true,
        act: () => open ? openCase(i)
          : paid ? askCode(i)
          : say("Дело №" + p.number + " пока под замком. Сначала раскройте дело №" + CASES[i - 1].player.number + ".", "bad")
      };
    };
    const s1 = CASES.filter(c => season(c) === 1), s2 = CASES.filter(c => season(c) === 2);
    const list = s1.map(c => item(c, CASES.indexOf(c)));
    const s1done = s1[s1.length - 1].player.finale;
    if (!s1done) list.push({
      label: "🔒 Дело №" + (s1.length + 1) + " · готовится", always: true,
      act: () => say("Это дело ещё пишется. Загляните позже.")
    });
    if (s2.length) {
      list.push(...s2.map(c => item(c, CASES.indexOf(c))));
      if (!s2[s2.length - 1].player.finale) list.push({
        label: "🔒 Сезон 2 · Дело №" + (s2.length + 1) + " · готовится", always: true,
        act: () => say("Следующее дело сезона выйдет на <a href=\"" + BOOSTY + "\" target=\"_blank\" rel=\"noopener\">Бусти</a> вместе с кодовым словом.")
      });
      list.push({
        label: "⭐ Сезон 2 «Спящие задания» на Бусти", always: true,
        act: () => window.open(BOOSTY, "_blank", "noopener")
      });
    } else if (s1done) list.push({
      label: "🔒 Сезон 2 · готовится", always: true,
      act: () => say("Второй сезон ещё пишется. Загляните позже.")
    });
    keys(list);
  }

  function openCase(i) {
    CASE = CASES[i]; N = CASE.nodes; A = CASE.artifacts;
    restart();
  }

  // ---------- команды ----------

  function status() {
    const done = CASE.player.status.map(([t, f]) => (has(f) ? "✓ " : "· ") + t).join("\n");
    say("<b>Статус дела</b>\n" + done + "\n\nЯсность: " + S.clarity + "/" + CASE.clarity.max +
        "\nИзучено артефактов: " + artifactsSeen() + "/" + CASE.player.evidence.length +
        (CASE.clock ? "\nВремя: " + fmt(S.min) + (S.late ? ", " + CASE.clock.label + " уже прошло" : ", " + CASE.clock.label + " в " + CASE.clock.deadline) : ""));
  }

  document.getElementById("cCase").onclick = () => { if (!S.over) status(); };
  document.getElementById("cHint").onclick = () => { if (!S.over) go("senya_hint"); };
  document.getElementById("cReport").onclick = () => { if (!S.over) go("report_guard"); };
  document.getElementById("cRestart").onclick = () => { if (CASE) restart(); };
  document.getElementById("cCases").onclick = showCases;

  function restart() {
    S.clarity = CASE.clarity.start; S.score = 0; S.over = false;
    S.flags.clear(); S.seen.clear(); S.rewarded.clear(); S.attempts = {};
    S.fired.clear(); S.visited.clear(); S.late = false;
    S.min = CASE.clock ? toMin(CASE.clock.start) : 0;
    paintClock();
    feed.innerHTML = "";
    paintClarity();
    hsub.textContent = CASE.title.toLowerCase();
    SFX.open();
    pic(ART.cover(CASE.player.cover), [caseName(CASE).toLowerCase(), CASE.player.short]);
    go("start");
  }

  const soundBtn = document.getElementById("cSound");
  function paintSound() {
    soundBtn.textContent = SFX.broken ? "звука нет" : (SFX.on ? "звук вкл" : "звук выкл");
    soundBtn.setAttribute("aria-pressed", String(SFX.on));
  }
  soundBtn.onclick = () => { SFX.toggle(); paintSound(); if (SFX.on) SFX.key(); };
  paintSound();

  showCases();
})();
</script>

<script>
(() => {
  const TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (!TG) return;
  TG.ready();
  TG.expand();
  const sync = () => {
    document.documentElement.dataset.theme = TG.colorScheme === "light" ? "light" : "dark";
  };
  sync();
  TG.onEvent("themeChanged", sync);
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href^="https://t.me/"]');
    if (!a) return;
    e.preventDefault();
    TG.openTelegramLink(a.href);
  });
  // внешние ссылки (Бусти) — во внешнем браузере, иначе Telegram откроет их внутри игры
  window.open = (url) => TG.openLink(url);
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href^="https://"]:not([href^="https://t.me/"])');
    if (!a) return;
    e.preventDefault();
    TG.openLink(a.href);
  });
})();
</script>
