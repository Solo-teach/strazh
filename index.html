ssage","text":["🗂 <b>ЦИФРОВОЙ СТРАЖ</b> · дело №3","«Пропавшие платежи» · расчётный центр «ЖилРасчёт»","","Жители Заречного района платят за квартиру. Банк принимает деньги. А в следующей квитанции у них долг и пени.","Почти четыре миллиона рублей за шесть недель. Банк клянётся, что перевёл всё.","","Вопрос: <i>где сейчас эти деньги и почему они не дошли до лицевых счетов</i>.","","Ясность 12/12."],"buttons":[{"label":"📄 Прочитать записку","goto":"read_note"},{"label":"🧭 Сразу в штаб","goto":"hub"}]},"read_note":{"type":"artifact","artifact":"c_note","buttons":[{"label":"В штаб расследования","goto":"hub"}]},"hub":{"type":"hub","header":"🧭 ШТАБ · ясность {clarity}/12","text":["С чего продолжим?"],"buttons":[{"label":"📊 Деньги и логи","goto":"menu_data"},{"label":"🗣 Опросить людей","goto":"menu_people"},{"label":"📐 Справочники и схемы","goto":"menu_docs"},{"label":"🧪 Версии","goto":"hypotheses"},{"label":"🧠 Сеня, подскажи (−1)","goto":"senya_hint"},{"label":"📝 Заключение","goto":"report_guard"}]},"menu_data":{"type":"menu","text":["Что смотрим?"],"buttons":[{"label":"Сверка реестра банка и зачислений","goto":"art_registry"},{"label":"Выписка по расчётному счёту","goto":"art_bank"},{"label":"Невыясненные поступления","goto":"art_buh"},{"label":"Журнал трансформатора","goto":"art_translog"},{"label":"Настройки уведомлений трансформатора","goto":"art_mail"},{"label":"← Назад","goto":"hub"}]},"menu_docs":{"type":"menu","text":["Документы:"],"buttons":[{"label":"Журнал изменений НСИ","goto":"art_nsi"},{"label":"Таблица соответствия кодов","goto":"art_mapping"},{"label":"Диаграмма последовательности","goto":"art_seq"},{"label":"Реестр потребителей справочника","goto":"art_lineage"},{"label":"ТЗ на трансформатор","goto":"art_ts"},{"label":"← Назад","goto":"hub"}]},"menu_people":{"type":"menu","text":["Кого вызываем?"],"buttons":[{"label":"Кира, служба НСИ","goto":"int_kira"},{"label":"Павел, инженер интеграции","goto":"int_pavel"},{"label":"Зоя Михайловна, главный бухгалтер","goto":"int_zoya"},{"label":"Руслан, абонентский отдел","goto":"int_ruslan"},{"label":"← Назад","goto":"menu_people_back"}]},"menu_people_back":{"type":"message","text":["Возвращаемся."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"art_registry":{"type":"artifact","artifact":"c_registry","text_after":["Сеня: «Не торопитесь с выводом про район. Сравните незачисленные строки с той, что прошла. Что есть у всех трёх „НЕТ“ и чего нет у „да“?»"],"buttons":[{"label":"🔍 Найти общий признак","goto":"mini_match"},{"label":"← В штаб","goto":"hub"}]},"mini_match":{"type":"input","kind":"text","text":["<b>Мини-задача: сверка двух таблиц</b>","","Какой код услуги есть во всех незачисленных платежах и отсутствует в зачисленном платеже из Заречного?","","Введите код."],"accept":["0701"],"on_correct":{"sets_flags":["k_code"],"clarity":1,"text":["✅ Код 0701. Его нет ни в одной зачисленной строке и есть в каждой незачисленной.","","Сеня: «Вот почему район сбивает с толку. Житель Заречного, который не платит за вывоз мусора, проходит спокойно. Дело не в адресе, дело в коде»."],"goto":"hub"},"on_wrong":{"clarity":-1,"attempts":2,"text":["Не то. Если вы про район — посмотрите на строку 31-0930: она из Заречного и зачислена. Ищите код услуги, а не адрес."],"goto":"art_registry"}},"art_bank":{"type":"artifact","artifact":"c_bank","text_after":["Сеня: «Банк чист. Двадцать четыре тысячи платежей, сумма до рубля. Значит, деньги лежат у нас на счёте — вопрос, почему они не добрались до лицевых счетов»."],"buttons":[{"label":"Посмотреть невыясненные поступления","goto":"art_buh"},{"label":"← В штаб","goto":"hub"}]},"art_buh":{"type":"artifact","artifact":"c_buh","text_after":["Сеня: «Обратите внимание на переписку. Бухгалтерия увидела аномалию через две недели и написала. ИТ ответило за день — и ответило неправильно, потому что никто не заглянул дальше банка»."],"buttons":[{"label":"🗣 Поговорить с главным бухгалтером","goto":"int_zoya"},{"label":"← В штаб","goto":"hub"}]},"art_translog":{"type":"artifact","artifact":"c_translog","on_enter_if":{"flag":"k_code","text":["Сеня: «Код 0701 и ошибка E-114 — неизвестный код услуги. Первая запись в 00:14 первого июля, в первые минуты новой версии справочника. Сходится».","","«Теперь вопрос: почему трансформатор не знает код, который знает весь остальной расчётный центр?»"]},"text_after":["Сеня: «Трансформатор отклонил платежи целиком — и правильно сделал. Разнести половину платежа хуже, чем не разнести ничего. Вопрос не в том, что он отказал, а в том, что было дальше»."],"buttons":[{"label":"Посмотреть таблицу кодов","goto":"art_mapping"},{"label":"Куда уходят отчёты об отбраковке","goto":"art_mail"},{"label":"← В штаб","goto":"hub"}]},"art_mail":{"type":"artifact","artifact":"c_mail","text_after":["Сеня: «Система сделала всё, что ей велели: нашла ошибку, записала, отправила отчёт. Сорок два раза. Просто адресат уехал ещё весной»."],"buttons":[{"label":"🔍 Разобрать обработку ошибок","goto":"mini_dlq"},{"label":"← В штаб","goto":"hub"}]},"mini_dlq":{"type":"choice","text":["<b>Мини-задача: очередь ошибок</b>","","Сеня: «Место, куда система складывает сообщения, которые не смогла обработать, называют очередью ошибок. Иногда говорят „отбраковка“ или „dead letter queue“».","","Что в этой очереди устроено неправильно?"],"buttons":[{"label":"У неё нет владельца: отчёт уходит на ящик, который никто не читает, и порога тревоги нет","correct":true,"clarity":1,"feedback":["✅ Да. Очередь ошибок работает, только если у неё есть три вещи: владелец, который её разбирает, срок разбора и сигнал, когда она растёт.","","Здесь нет ни одной. Отбраковка росла шесть недель, и первой её заметила бухгалтерия — по деньгам, а не по логам."],"goto":"hub"},{"label":"Отбраковывать вообще не нужно — неопознанные платежи надо зачислять на лицевой счёт как есть","clarity":-1,"feedback":["Зачислить деньги за вывоз мусора на неизвестную статью — значит испортить расчёты с поставщиком. Отказ правильный. Неправильно то, что с отказом ничего не происходит."],"goto":"mini_dlq"},{"label":"Отчёт отправляется раз в сутки, а надо сразу","clarity":-1,"feedback":["Хоть каждую минуту — адресат всё равно автоответчик. Частота не помогает, если читать некому."],"goto":"mini_dlq"}]},"art_nsi":{"type":"artifact","artifact":"c_nsi","text_after":["Сеня: «НСИ — нормативно-справочная информация: справочники, которыми пользуются сразу много систем. Коды услуг, районы, тарифы».","","«Смотрите: изменение объявили за десять дней и разослали четырём подписчикам. По меркам службы НСИ — образцово. Вопрос, всем ли, кому было нужно»."],"buttons":[{"label":"Открыть реестр потребителей","goto":"art_lineage"},{"label":"← В штаб","goto":"hub"}]},"art_mapping":{"type":"artifact","artifact":"c_mapping","text_after":["Сеня: «Вот и ответ. У трансформатора своя копия справочника, снятая в марте 2023-го. Когда в НСИ появился 0701, копия об этом не узнала — у неё нет ни подписки, ни автообновления»."],"buttons":[{"label":"Посмотреть журнал изменений НСИ","goto":"art_nsi"},{"label":"← В штаб","goto":"hub"}]},"art_seq":{"type":"artifact","artifact":"c_seq","buttons":[{"label":"🔍 Найти, где обрывается платёж","goto":"mini_seq"},{"label":"← В штаб","goto":"hub"}]},"mini_seq":{"type":"choice","text":["<b>Мини-задача: диаграмма последовательности</b>","","Платёж жителя Заречного с кодом 0701. На каком шаге он перестаёт двигаться к биллингу?"],"buttons":[{"label":"[2] Трансформатор ищет код услуги — и не находит","correct":true,"clarity":1,"feedback":["✅ Верно. Реестр дошёл, формат проверен, а на сопоставлении кода платёж сворачивает в ветку ошибки и уходит по стрелке [4] — в ящик.","","Сеня: «Обратите внимание: на диаграмме у стрелки [4] есть получатель, но нет продолжения. Ни одна линия не идёт из ящика обратно в процесс. Это и есть тупик — прямо на схеме»."],"goto":"hub"},{"label":"Банк → Трансформатор: реестр не доходит","clarity":-1,"feedback":["Реестры доходят: журнал трансформатора насчитал все 412. Смотрите дальше по стрелкам."],"goto":"mini_seq"},{"label":"[1] Трансформатор отклоняет формат реестра","clarity":-1,"feedback":["Формат в порядке: 22 464 платежа из тех же реестров прошли. Ошибка в конкретных строках, а не во всём файле."],"goto":"mini_seq"},{"label":"[3] Биллинг не принимает зачисление","clarity":-1,"feedback":["До биллинга эти платежи не доходят — в его журналах их нет вовсе."],"goto":"mini_seq"}]},"art_lineage":{"type":"artifact","artifact":"c_lineage","buttons":[{"label":"🔍 Проверить реестр","goto":"mini_lineage"},{"label":"← В штаб","goto":"hub"}]},"mini_lineage":{"type":"choice","text":["<b>Мини-задача: потребители справочника</b>","","Сеня: «Реестр потребителей — это список всех систем, которые пользуются справочником. По нему НСИ понимает, кого предупредить об изменении».","","Кого не хватает в этом реестре?"],"buttons":[{"label":"Трансформатора платёжных реестров","correct":true,"sets_flags":["k_lineage"],"clarity":2,"feedback":["✅ Вот она, дыра. Трансформатор сопоставляет коды услуг — значит, он потребитель справочника. Но в реестре его нет: при внедрении заявку никто не подал.","","Для службы НСИ трансформатора не существует. Поэтому изменение, разосланное образцово, до него не дошло.","","Сеня: «Справочник меняют аккуратно ровно настолько, насколько полон список тех, кто от него зависит»."],"goto":"hub"},{"label":"Бухгалтерии","clarity":-1,"feedback":["Бухгалтерия работает с деньгами на счёте, коды услуг она берёт из биллинга. Отдельно подписываться ей не нужно."],"goto":"mini_lineage"},{"label":"Никого, реестр полный","clarity":-1,"feedback":["Пройдите по диаграмме последовательности: кто ещё, кроме биллинга, смотрит на код услуги в платеже?"],"goto":"mini_lineage"}]},"art_ts":{"type":"artifact","artifact":"c_ts","text_after":["Сеня: «ТЗ писал подрядчик, по своему шаблону КР-7. Раздел „4.2 Ошибка“ заканчивается словами „направляются на адрес сопровождения“ — и всё. Кто этот адрес будет читать через три года, шаблон не спрашивает».","","«КР-7… где-то я этот шифр уже видел»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"int_kira":{"type":"dialogue","speaker":"kira","sets_flags":["f_kira"],"lines":["<b>Кира, руководитель службы НСИ</b>","","— Изменение прошло строго по регламенту. Объявили за десять дней, опубликовали на портале, разослали всем подписчикам.","— Трансформатор? У него своя таблица кодов? Впервые слышу. У нас он потребителем не числится."],"buttons":[{"label":"«Кто должен был сообщить вам о новом потребителе?»","goto":"int_kira_2"},{"label":"← Назад","goto":"menu_people"}]},"int_kira_2":{"type":"dialogue","speaker":"kira","clarity":1,"lines":["— Тот, кто его подключал. Реестр мы ведём по заявкам: система пришла, заявила, что берёт справочник, — мы её вносим.","— Трансформатор внедрял подрядчик в 2023-м. Заявки от них не было. Мы даже не знали, что он коды услуг читает.","— И закрывать 07 день в день… Ну да, мы думали, все и так перейдут. Все, кого мы знали, перешли.","","Сеня: «„Все, кого мы знали“ — ключевые слова. Процесс изменения справочника безупречен для известных потребителей и слеп для остальных»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"int_pavel":{"type":"dialogue","speaker":"pavel","sets_flags":["f_pavel"],"lines":["<b>Павел, инженер интеграции</b>","","— Трансформатор мне достался в апреле, когда ушёл подрядчик. Передача заняла один созвон. Документация — одно ТЗ.","— Таблица кодов? Сейчас… Да, есть такая, 38 кодов, залиты в марте 2023-го под их учёткой. Я не знал, что её надо обновлять. Мне никто не говорил, что она вообще существует."],"buttons":[{"label":"«Куда уходят отчёты об отбраковке?»","goto":"int_pavel_2"},{"label":"Обвинить инженера в халатности","goto":"dead_engineer"},{"label":"← Назад","goto":"menu_people"}]},"int_pavel_2":{"type":"dialogue","speaker":"pavel","lines":["— На support подрядчика. Я думал, после ухода его переадресовали на нас… Сейчас проверю.","— …Нет. Не переадресовали. Там автоответ.","— А в июле ИТ ответило бухгалтерии, что это банк задерживает реестры. Это был не я, но я бы, наверное, ответил так же: у нас не было ни одного сигнала.","","Сеня: «Сигнал был. Сорок два раза. Он просто уходил туда, где его никто не услышит»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"int_zoya":{"type":"dialogue","speaker":"zoya","sets_flags":["f_zoya"],"lines":["<b>Зоя Михайловна, главный бухгалтер</b>","","— Невыясненные с июля выросли в сто раз. Я написала в ИТ пятнадцатого, мне ответили — банк задерживает.","— Ждали. Банк не задерживал. Деньги на счёте, я их вижу. Я только не вижу, чьи они."],"buttons":[{"label":"«Почему не разнесли вручную?»","goto":"int_zoya_2"},{"label":"← Назад","goto":"menu_people"}]},"int_zoya_2":{"type":"dialogue","speaker":"zoya","lines":["— Вручную мы разносим, когда в платеже ошибка: не тот лицевой счёт, не та сумма. Нам приходит список.","— Здесь нам не пришло ничего. Отбраковку трансформатора мы никогда не видели — она уходит куда-то в ИТ. К нам доходят только деньги без адреса.","","Сеня: «У бухгалтерии есть и деньги, и полномочия их разнести. Нет только информации, которая лежит в соседнем ящике. Две половины решения живут в разных отделах и не знают друг о друге»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"int_ruslan":{"type":"dialogue","speaker":"ruslan","sets_flags":["f_ruslan"],"lines":["<b>Руслан, начальник абонентского отдела</b>","","— Двести жалоб за неделю. Люди приходят с чеками, кричат, одна бабушка плакала — ей пени начислили первый раз в жизни.","— Это банк. У них летом был сбой, я в новостях читал. Надо требовать с банка.","— И ещё: может, люди по старым квитанциям платят? В Заречном в июле поменяли вывоз мусора, квитанции новые."],"buttons":[{"label":"Потребовать проверку банка","goto":"dead_bank"},{"label":"Проверить квитанции жителей","goto":"dead_residents"},{"label":"← Назад","goto":"menu_people"}]},"hypotheses":{"type":"choice","text":["🧪 <b>ВЕРСИИ</b>","","Сеня: «Любая версия должна объяснить три вещи: почему только Заречный, почему с первого июля и почему именно эти 1 846 платежей»."],"buttons":[{"label":"А. Банк задерживает или теряет платежи","goto":"dead_bank"},{"label":"Б. Жители платят по старым реквизитам с ошибкой","goto":"dead_residents"},{"label":"В. Инженер интеграции не обновил справочник","goto":"dead_engineer"},{"label":"Г. Изменение справочника не дошло до трансформатора, а его отбраковку никто не читает","goto":"hypo_right"},{"label":"← В штаб","goto":"hub"}]},"hypo_right":{"type":"message","clarity":1,"condition":{"if_flags_missing":["k_code","k_copy"],"text":["Сеня: «Звучит правдоподобно, но доказать нечем. Найдите код, который объединяет пропажи, и посмотрите, откуда трансформатор берёт коды. Тогда версия встанет на ноги»."],"goto":"hub"},"text":["✅ Версия держится: сверка даёт код 0701, журнал — отбраковку E-114 с первого июля, таблица трансформатора — копию справочника 2023 года без 0701.","","Сеня: «Механизм собран. Осталось понять, почему он вообще стал возможен»."],"buttons":[{"label":"🧠 Пройти «5 почему»","goto":"why_1"},{"label":"📝 К заключению","goto":"report_guard"}]},"dead_bank":{"type":"dead_end","clarity":-2,"text":["🚫 <b>Тупик.</b>","","Вы направляете банку официальную претензию. Через три дня приходит ответ с выпиской: 24 310 платежей, все зачислены на счёт расчётного центра в срок, сумма совпадает до рубля.","","Банк вежливо добавляет, что летний сбой был у другого банка.","","Сеня: «Минус два и одна испорченная переписка с партнёром. Зато теперь ясно: деньги у нас. Потерялись не деньги — потерялся адрес, по которому их разносить»."],"buttons":[{"label":"Применить «5 почему»","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"dead_residents":{"type":"dead_end","clarity":-2,"text":["🚫 <b>Тупик.</b>","","Вы поднимаете сорок квитанций из жалоб. Все новые, июльские. Лицевые счета верные, суммы верные, код вывоза мусора напечатан правильно — 0701.","","Печать квитанций узнала о новом коде вовремя: она подписана на справочник.","","Сеня: «Жители сделали всё правильно. И квитанции тоже. Значит, новый код знает кто-то, кому положено, — и не знает кто-то, кому не положено по спискам, но нужно по делу»."],"buttons":[{"label":"Применить «5 почему»","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"dead_engineer":{"type":"dead_end","clarity":-2,"text":["🚫 <b>Тупик.</b>","","Вы пишете докладную на Павла. Проверка выясняет: он принял трансформатор в апреле по итогам одного созвона. В передаточных документах таблица кодов не упомянута, в ТЗ тоже.","","Таблицу залил подрядчик в марте 2023 года. За три года её не обновлял никто — ни подрядчик, ни предшественник Павла.","","Сеня: «Нельзя обвинить человека в том, что он не обновлял файл, о существовании которого ему никто не сообщил. Спросите лучше, почему этот файл вообще никому не принадлежит»."],"buttons":[{"label":"Применить «5 почему»","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"why_1":{"type":"choice","text":["<b>Метод «5 почему», шаг 1 из 5</b>","","❓ Почему жителям Заречного начислили долг?"],"buttons":[{"label":"Потому что их платежи не зачислены на лицевые счета","correct":true,"goto":"why_2"},{"label":"Потому что они не заплатили","clarity":-1,"feedback":["Банк подтвердил все 1 846 платежей, деньги на счёте."],"goto":"why_1"}]},"why_2":{"type":"choice","text":["<b>«5 почему», шаг 2 из 5</b>","","❓ Почему платежи не зачислены?"],"buttons":[{"label":"Трансформатор отбраковал их из-за неизвестного кода 0701","correct":true,"goto":"why_3"},{"label":"Банк не передал реестры","clarity":-1,"feedback":["Все 412 реестров обработаны трансформатором."],"goto":"why_2"}]},"why_3":{"type":"choice","text":["<b>«5 почему», шаг 3 из 5</b>","","❓ Почему трансформатор не знает код, который знают остальные системы?"],"buttons":[{"label":"Он работает со своей копией справочника от марта 2023 года, которая не обновляется","correct":true,"goto":"why_4"},{"label":"В коде трансформатора ошибка","clarity":-1,"feedback":["Код работает ровно как задумано: неизвестное — в отбраковку. Ошибка не в исполнении, а в данных, на которые он опирается."],"goto":"why_3"}]},"why_4":{"type":"choice","text":["<b>«5 почему», шаг 4 из 5</b>","","❓ Почему копию не обновили, когда в НСИ появился новый код?"],"buttons":[{"label":"НСИ не знает, что трансформатор — потребитель справочника: его нет в реестре, и уведомление ему не ушло","correct":true,"goto":"why_5"},{"label":"Инженер забыл обновить","clarity":-1,"feedback":["Он не знал о существовании таблицы. Забыть можно то, о чём знаешь."],"goto":"why_4"}]},"why_5":{"type":"choice","text":["<b>«5 почему», шаг 5 из 5</b>","","❓ Почему система, зависящая от справочника, три года жила вне поля зрения службы НСИ, а её ошибки уходили в пустоту?"],"buttons":[{"label":"Интеграцию ввели без описания зависимостей от справочников и без передачи сопровождения: нет ни заявки в НСИ, ни владельца ошибок","correct":true,"sets_flags":["k_chain"],"clarity":2,"feedback":["✅ Дно достигнуто.","","При внедрении никто не задал два вопроса: „от каких справочников зависит система“ и „кто будет разбирать её ошибки, когда мы уйдём“. Первый стоил одной заявки в НСИ. Второй — одной строки в настройках.","","В ТЗ таких разделов нет. И не потому, что забыли: в шаблоне КР-7 их просто не предусмотрено.","","Сеня: «Система не заканчивается в день приёмки. Она заканчивается в день, когда её выключают. Всё, что между, кто-то должен был описать»."],"goto":"hub"},{"label":"НСИ поменяла код без предупреждения","clarity":-1,"feedback":["Предупреждение было: за десять дней, на портале и в рассылке. Не хватало не предупреждения, а получателя."],"goto":"why_5"},{"label":"Подрядчик плохо сделал трансформатор","clarity":-1,"feedback":["Трансформатор сделан аккуратно: он честно отбраковывает и честно отчитывается. Дыра не в нём, а вокруг него."],"goto":"why_5"}]},"senya_hint":{"type":"hint","clarity":-1,"rules":[{"if_missing":"f_registry","text":"Сеня: «Начните со сверки реестра и зачислений. Хочу понять, чем пропавшие платежи отличаются от дошедших»."},{"if_missing":"k_code","text":"Сеня: «В сверке есть строка из Заречного, которая прошла. Сравните её с теми, что не прошли. Разница — в одном коде»."},{"if_missing":"k_reject","text":"Сеня: «Деньги пришли, а на лицевые счета не попали. Кто стоит между банком и биллингом? Загляните в журнал трансформатора»."},{"if_missing":"k_copy","text":"Сеня: «Трансформатор не знает новый код. Откуда он вообще берёт коды? Посмотрите таблицу соответствия»."},{"if_missing":"k_lineage","text":"Сеня: «НСИ разослала изменение подписчикам. Проверьте, есть ли среди них трансформатор»."},{"if_missing":"k_owner","text":"Сеня: «Трансформатор ведь сообщал об ошибках. Кому? Посмотрите настройки уведомлений»."},{"if_missing":"k_chain","text":"Сеня: «Механизм ясен, причина — нет. Прогоните „5 почему“»."},{"default":"Сеня: «Материала достаточно. Формулируйте заключение: причина, компонент, рекомендация»."}]},"report_guard":{"type":"gate","condition":{"required_flags":["k_copy","k_lineage","k_chain"],"on_fail":{"clarity":-3,"text":["⚠️ Вы выходите к директору рано.","","Первый вопрос: «Хорошо, код поменялся. А почему узнали о нём все, кроме одной системы, и почему мы шесть недель ничего не замечали?» Ответа нет.","","Сеня: «Ясность −3. Возвращайтесь: нужна копия справочника, нужен реестр потребителей, нужна цепочка»."],"goto":"hub"}},"goto":"report_cause"},"report_cause":{"type":"choice","text":["📝 <b>АНАЛИТИЧЕСКОЕ ЗАКЛЮЧЕНИЕ</b> · поле 1 из 3","","<b>Корневая причина:</b>"],"buttons":[{"label":"Изменения справочника не доходят до всех потребителей: трансформатора нет в реестре НСИ, а у его отбраковки нет владельца","correct":true,"score":3,"goto":"report_component"},{"label":"Ошибка в коде трансформатора","score":0,"feedback_after":"Трансформатор отработал ровно по правилам. Дефект не в исполнении.","goto":"report_component"},{"label":"НСИ сменила код без согласования","score":1,"feedback_after":"Частично: закрывать старый код день в день было рискованно. Но предупреждение ушло всем известным потребителям — проблема в том, что трансформатор к ним не относился.","goto":"report_component"},{"label":"Банк передал некорректные реестры","score":0,"feedback_after":"Реестры корректны, деньги пришли до рубля.","goto":"report_component"}]},"report_component":{"type":"choice","text":["📝 Поле 2 из 3","","<b>Затронутые компоненты:</b>"],"buttons":[{"label":"Процесс ведения НСИ и трансформатор: таблица кодов и обработка отбраковки","correct":true,"score":3,"goto":"report_reco"},{"label":"Только трансформатор","score":1,"feedback_after":"Не только: пока реестр потребителей НСИ неполный, любая следующая система с собственной копией справочника наступит на те же грабли.","goto":"report_reco"},{"label":"Биллинг","score":0,"goto":"report_reco"},{"label":"Интеграция с банками","score":0,"goto":"report_reco"}]},"report_reco":{"type":"input","kind":"choice_or_text","text":["📝 Поле 3 из 3","","<b>Рекомендация.</b> Выберите вариант или впишите свой."],"buttons":[{"label":"Внести трансформатор в реестр потребителей с подпиской на изменения, вводить новые коды с периодом параллельного действия, назначить владельца отбраковки и порог тревоги","correct":true,"score":3,"goto":"ending_calc"},{"label":"Добавить код 0701 в таблицу трансформатора и разнести платежи","score":2,"feedback_after":"Деньги дойдут, жители успокоятся. До следующего нового кода.","goto":"ending_calc"},{"label":"Обязать инженера интеграции раз в месяц сверять таблицу со справочником","score":1,"feedback_after":"Ручная сверка раз в месяц — это месяц задержки в худшем случае и вечная зависимость от памяти одного человека.","goto":"ending_calc"},{"label":"Отключить отбраковку и зачислять всё, что пришло","score":0,"feedback_after":"Деньги будут разнесены на неизвестные статьи. Ошибка станет тише и дороже.","goto":"ending_calc"}],"text_accept":{"keywords_high":["подписк","реестр","потребител","уведомл","владел","параллельн","версион","отбраков","тревог","оповещ","синхрон"],"score_if_keyword":3,"score_default":1}},"ending_calc":{"type":"router","routes":[{"if":"clarity <= 0","goto":"ending_fail"},{"if":"score >= 8 && clarity >= 9","goto":"ending_perfect"},{"if":"score >= 6","goto":"ending_good"},{"if":"score >= 3","goto":"ending_weak"},{"default":"ending_wrong"}]},"ending_perfect":{"type":"ending","title":"Дело раскрыто. Чисто","text":["🏆 <b>Дело №3 закрыто</b>","","Деньги никуда не пропадали. Они шесть недель лежали на счёте, а ошибка о них шесть недель уходила в ящик, который читал только автоответчик.","","Итог: 1 846 платежей разнесены из невыясненных, пени отменены до сентябрьских квитанций. Трансформатор внесён в реестр потребителей и получает изменения справочника по подписке. Отбраковку теперь разбирает бухгалтерия, а при росте больше пятидесяти платежей в сутки приходит тревога.","","Зоя Михайловна попросила копию заключения — «чтобы в следующий раз было что показать ИТ».","","Сеня: «И ещё одно. Я поднял архив: ТЗ на трансформатор, ТЗ на возвраты со склада и ТЗ на „Единого клиента“ из „Полис+“ написаны одним подрядчиком. Один шаблон — КР-7. Три компании, три разных инцидента… и одна и та же дыра. Не закрывайте папку»."],"rewards":["Значок «Хранитель справочников»","Открыто дело №4"]},"ending_good":{"type":"ending","title":"Дело раскрыто","text":["✅ <b>Дело №3 закрыто</b>","","Причина установлена верно, платежи разнесены. На защите директор долго выяснял, почему бухгалтерия шесть недель смотрела на растущие невыясненные поступления, а ИТ отвечало про банк.","","Сеня: «Хорошо. Обратите внимание, чей шаблон у ТЗ на трансформатор. Этот подрядчик нам ещё встретится»."],"rewards":["Открыто дело №4"]},"ending_weak":{"type":"ending","title":"Платежи нашли, дыру оставили","text":["⚠️ <b>Дело закрыто наполовину</b>","","Код 0701 добавили в таблицу трансформатора вручную, платежи разнесли, пени отменили. Директор доволен.","","В октябре Северный район переходит к другому поставщику отопления. В НСИ появляется код 0201. Трансформатор о нём по-прежнему не знает, отчёты об отбраковке по-прежнему читает автоответчик. Через месяц бухгалтерия снова пишет в ИТ про невыясненные.","","Сеня: «Вы вернули деньги. Процесс остался тем же: справочник меняется, а половина компании узнаёт об этом из жалоб»."]},"ending_wrong":{"type":"ending","title":"Не та причина","text":["❌ <b>Заключение отклонено</b>","","Ваша версия не объясняет, почему пропали только платежи с кодом 0701, почему ровно с первого июля и почему житель Заречного без оплаты вывоза мусора прошёл без проблем.","","Сеня: «Причина обязана объяснять числа и исключения. Особенно исключения»."]},"ending_fail":{"type":"ending","title":"Вас сняли с дела","text":["🚫 <b>Ясность 0</b>","","Претензия банку, проверка квитанций, докладная на инженера — всё мимо. Дело передали внешнему консультанту. Он начал с журнала трансформатора, нашёл ошибку E-114 и закрыл вопрос за полдня.","","Сеня: «В следующий раз идите по пути денег, а не по пути жалоб: банк → трансформатор → биллинг. Где деньги остановились — там и ищите»."]}}},{"$schema_note":"Дело №4, финал сезона. Формат тот же, что и в case_01: многострочные тексты — массивы строк, схемы — поле ascii для моноширинного блока.","case_id":"case_04_contractor","title":"Дело №4. Подрядчик","subtitle":"Цифровой страж · финал сезона","difficulty":"продвинутый","estimated_minutes":26,"player":{"number":4,"finale":true,"cover":"board","short":"Подрядчик","teaser":"Финал сезона. Три дела, один шаблон и запуск, до которого два дня.","evidence":["d_cases","d_template","d_history","d_archive","d_contract","d_ts4","d_fish","d_marat"],"status":[["общий знаменатель трёх дел","k_pattern"],["статистика архива подрядчика","k_stats"],["разделы убраны намеренно","k_removed"],["дыры в ТЗ «Аптечного двора»","k_echo"],["главная кость Исикавы","k_fish"],["цепочка «5 почему» пройдена","k_chain"]]},"meta":{"root_cause":"В 2019 году подрядчик «Квадрат Решений» заменил шаблон постановки КР-5 на КР-7, убрав разделы «Влияние на существующие процессы», «Зависимости от справочников и внешних систем» и «Передача в сопровождение», чтобы сократить подготовку ТЗ с 11 до 3 дней. Ревью ТЗ у подрядчика проверяет соответствие шаблону, а заказчики принимают систему строго по ТЗ. Поэтому всё, чего нет в шаблоне, не пишет, не проверяет и не принимает никто. Само изменение шаблона ввели без анализа влияния — той же ошибкой, которая потом повторилась у клиентов.","guilty":"Никто из людей единолично. Инструмент, через который проходят все проекты подрядчика, изменили без оценки последствий, а метрики и приёмка сделали эту дыру невидимой.","component":"Шаблон постановки КР-7 и ревью ТЗ у подрядчика + порядок приёмки у заказчиков","recommendation":"Вернуть в шаблон разделы влияния, зависимостей и передачи сопровождения; включить их в чек-лист ревью и приёмки; мерить качество ТЗ по инцидентам после запуска; ТЗ «Аптечного двора» доработать до запуска","key_insight":"Шаблон — это решение, принятое один раз за сотни будущих проектов. Его дыра масштабируется так же, как его польза.","red_herrings":["Подрядчик специально оставляет дыры, чтобы продавать сопровождение — сопровождение он ни разу не продлевал по своей инициативе, и оно убыточно","Виноват автор шаблона — шаблон утверждён техсоветом единогласно, а его увольнение шаблон не изменит","Три инцидента — совпадение — архив показывает 9 инцидентов на 14 ТЗ по КР-7 против 2 на 12 по КР-5"],"season_hook":"В эпилоге Сеня упоминает ещё сорок «спящих» фоновых заданий в «Полке+», согласованных «склад, ИТ» без подписей, — задел под второй сезон."},"clarity":{"start":12,"max":12,"fail_at":0,"label":"ясность"},"assistant":{"name":"Сеня, методолог","role":"собрал улики трёх дел и объясняет, как искать причину на уровне организации","hint_cost":1},"flags_reference":{"f_cases":"изучена сводка трёх дел","f_template":"изучен шаблон КР-7","f_history":"изучена история шаблона","f_archive":"изучена статистика архива","f_contract":"изучен типовой договор","f_ts4":"изучено ТЗ «Аптечного двора»","f_fish":"изучена диаграмма Исикавы","f_marat":"прочитано письмо Марата","f_lev":"опрошен директор по аналитике подрядчика","f_lera":"опрошена аналитик подрядчика","f_inna":"опрошена руководитель проекта «Аптечного двора»","k_pattern":"установлено: во всех трёх делах в ТЗ не описано влияние на то, что уже работает","k_stats":"установлено: по КР-7 инцидентов в разы больше, чем по КР-5","k_removed":"установлено: разделы убраны из шаблона в 2019 году ради скорости","k_contract":"установлено: приёмка идёт только по ТЗ","k_echo":"установлено: в ТЗ «Аптечного двора» повторяются все три дыры","k_fish":"установлено: главная причина — метод постановки, остальные на ней держатся","k_chain":"пройдена цепочка «5 почему»"},"characters":{"lev":{"name":"Лев Борисович","role":"директор по аналитике «Квадрат Решений», автор шаблона КР-7","tell":"гордится скоростью и не видит связи"},"lera":{"name":"Валерия","role":"аналитик «Квадрат Решений», автор ТЗ для «Полис+»","tell":"после дела №2 стала очень честной"},"inna":{"name":"Инна","role":"руководитель проекта в «Аптечном дворе»","tell":"до запуска два дня, и она очень не хочет слышать слово „перенос“"},"marat":{"name":"Марат","role":"старший кладовщик «Полки+» из дела №1","tell":"замечает симптомы раньше мониторинга"}},"artifacts":{"d_brief":{"title":"Письмо в отдел","tag":"вводная","text":["Кому: Сене, отдел расследований «Цифровой страж»","От: Инны, руководителя проекта сети «Аптечный двор»","","Добрый день. Коллеги из «ЖилРасчёта» посоветовали обратиться к вам.","1 октября мы запускаем электронные рецепты. Подрядчик — ООО «Квадрат Решений», ТЗ подписано.","Нас насторожило, что у троих ваших клиентов после внедрений этого подрядчика были инциденты. Можете посмотреть, есть ли риск у нас?","","Запуск через два дня. Перенос обойдётся дорого, так что, пожалуйста, только если действительно нужно.","","Приписка Сени: «Я собрал всё, что у нас есть по трём делам. Похоже, вы расследуете не инцидент, а его источник»."]},"d_cases":{"title":"Сводка трёх дел","tag":"архив отдела","sets_flags":["f_cases"],"ascii":["ДЕЛА №1–3 · общая таблица","-------------------------------------------------------","        №1 Склад       №2 Двойники    №3 Платежи","-------------------------------------------------------","что     новый статус   ключ дубля     новый код","слома-  съело ночное   не определён   не дошёл","лось    задание                       до шлюза","-------------------------------------------------------","чего    влияния на     что считать    от каких","не было фоновые        дублем и что   справочников","в ТЗ    процессы       будет при      зависит; кто","                       ошибке         разбирает сбои","-------------------------------------------------------","ТЗ      «Квадрат       «Квадрат       «Квадрат","писал   Решений»       Решений»       Решений»","шаблон  КР-7           КР-7           КР-7","-------------------------------------------------------","виноват человек?   нет         нет          нет"],"note":"Три отрасли, три системы, три разных механизма. И одна строка, которая совпадает целиком."},"d_template":{"title":"Шаблон постановки КР-7","tag":"подрядчик","sets_flags":["f_template"],"text":["«КВАДРАТ РЕШЕНИЙ» · ШАБЛОН ТЕХНИЧЕСКОГО ЗАДАНИЯ КР-7","Утверждён техсоветом 12.03.2019","","1. Цель","2. Участники","3. Функции и форматы","4. Сценарии","  4.1 Основной сценарий","  4.2 Ошибки","  4.5 Альтернативные сценарии <i>(необязательно)</i>","5. Приёмка","","Правило ревью: ТЗ соответствует шаблону. Разделы вне шаблона — замечание «не по стандарту».","Целевой срок подготовки ТЗ: 3 рабочих дня."],"note":"Пять разделов. Всё, что нужно, чтобы описать новую систему. Ничего, чтобы описать, как она уживётся со старыми."},"d_history":{"title":"История шаблона: КР-5 → КР-7","tag":"подрядчик","sets_flags":["f_history","k_removed"],"ascii":["ПРОТОКОЛ ТЕХСОВЕТА · 12.03.2019","-------------------------------------------------------","Вопрос: переход с шаблона КР-5 на КР-7","Докладчик: Л. Б. Горин, директор по аналитике","","Удаляются разделы КР-5:","  6  «Влияние на существующие процессы»","  8  «Зависимости от справочников и систем»","  10 «Передача в сопровождение»","Обоснование: клиенты не читают ТЗ длиннее","  20 страниц; разделы 6, 8, 10 на приёмке","  не проверяются.","-------------------------------------------------------","Ожидаемый эффект: срок ТЗ 11 дней → 3 дня","Оценка рисков изменения:   не проводилась","Решение: утвердить единогласно"],"note":"Разделы не забыли. Их убрали — аккуратно, по протоколу, с обоснованием. И без оценки того, что сломается."},"d_archive":{"title":"Архив проектов подрядчика","tag":"статистика","sets_flags":["f_archive","k_stats"],"ascii":["ПРОЕКТЫ «КВАДРАТ РЕШЕНИЙ» · 2016–2026","-------------------------------------------------------","шаблон  ТЗ   инцидентов в первый год   доля","-------------------------------------------------------","КР-5    12            2                17%","КР-7    14            9                64%","-------------------------------------------------------","Инциденты по КР-7, классы причин:","  неучтённое влияние на старые процессы ..... 4","  неопределённые термины и правила .......... 3","  неописанные зависимости от справочников ... 2","-------------------------------------------------------","Метрика подрядчика в годовом отчёте:","  средний срок ТЗ ............ 3,2 дня  ▲","  инциденты после запуска .... не считается"],"note":"Подрядчик блестяще измерял то, что улучшилось, и не измерял то, что ухудшилось."},"d_contract":{"title":"Типовой договор подрядчика","tag":"договор","sets_flags":["f_contract","k_contract"],"text":["ДОГОВОР НА РАЗРАБОТКУ И ВНЕДРЕНИЕ (типовая форма)","","5.2 Система считается принятой при выполнении всех требований ТЗ.","5.3 Требования, не включённые в ТЗ, предметом договора не являются.","7.1 Сопровождение — 12 месяцев с даты приёмки.","7.4 По окончании сопровождения доступы и почтовые ящики подрядчика отключаются, уведомления систем переадресуются на адрес заказчика <i>(при наличии заявки заказчика)</i>."],"note":"Всё, чего нет в ТЗ, юридически не существует. А ТЗ пишется по шаблону."},"d_ts4":{"title":"ТЗ «Электронные рецепты», «Аптечный двор»","tag":"требования","sets_flags":["f_ts4"],"text":["ТЗ «ЭЛЕКТРОННЫЕ РЕЦЕПТЫ», версия 1.0, подписано 15.09.2026","Подготовлено: ООО «Квадрат Решений», шаблон постановки КР-7","","3.2 Если препарата нет в наличии, заказ по рецепту получает статус ОТЛОЖЕН_ДО_ПОСТУПЛЕНИЯ.","3.4 Рецепт привязывается к покупателю при совпадении основных данных пациента.","3.6 Справочник лекарственных препаратов загружается в систему при внедрении.","4.2 Ошибки сопоставления рецептов направляются на адрес сопровождения.","5. Приёмка: все требования разделов 3–4 выполнены.","","Раздела о влиянии на существующие процессы нет.","Раздела о зависимостях нет.","Раздела о передаче в сопровождение нет."],"note":"Четыре пункта. Каждый из них вы уже где-то видели."},"d_fish":{"title":"Диаграмма Исикавы","tag":"схема","sets_flags":["f_fish"],"ascii":["  ЛЮДИ                    МЕТОДЫ","  аналитики пишут         в КР-7 нет разделов","  строго по шаблону       влияния, зависимостей,","          ╲               сопровождения","           ╲                 ╲","────────────╲─────────────────╲──────▶ ИНЦИДЕНТЫ","            ╱                 ╱        ПОСЛЕ ЗАПУСКА","           ╱                 ╱","  ИЗМЕРЕНИЯ               СРЕДА","  меряют срок ТЗ,         заказчик принимает","  а не инциденты          только по ТЗ"],"note":"Диаграмма Исикавы, она же «рыбья кость»: голова — проблема, кости — группы причин. Помогает не остановиться на первой причине, которая попалась на глаза."},"d_marat":{"title":"Письмо от Марата","tag":"свидетель","sets_flags":["f_marat"],"text":["Здравствуйте. Это Марат, кладовщик из «Полки+». Помните кружки?","","После вашего расследования у нас в компании добавили в шаблон ТЗ раздел «влияние на фоновые процессы». Я радовался.","","А на прошлой неделе подрядчик прислал ТЗ на релиз 3.5. По КР-7. Раздела нет. Я сам проверил, потому что теперь всегда проверяю.","","Получается, мы починили у себя, а к нам всё равно приходит по-старому. Может, вам пригодится."],"note":"Заказчик исправил свой шаблон. Но ТЗ пишет подрядчик — по своему."},"d_greed":{"title":"Выручка подрядчика по сопровождению","tag":"проверка","text":["Договоры сопровождения 2019–2026: 14.","Продлено по инициативе подрядчика: 0.","Маржинальность сопровождения: минус 8%.","","Подрядчик не зарабатывает на ошибках после запуска. Он от них бежит: сопровождение ему невыгодно, и через год он уходит — вместе с почтовым ящиком."]}},"nodes":{"start":{"type":"message","text":["🗂 <b>ЦИФРОВОЙ СТРАЖ</b> · дело №4 · финал сезона","«Подрядчик»","","Склад, страховая, расчётный центр. Три компании, три инцидента, три раскрытых дела. Ни одного виноватого человека.","Сеня принёс папку: во всех трёх делах ТЗ писал один подрядчик по одному шаблону. А через два дня этот подрядчик запускает четвёртую систему — электронные рецепты в сети аптек.","","Вопрос: <i>совпадение это или источник — и успеете ли вы до запуска</i>.","","Ясность 12/12."],"buttons":[{"label":"📄 Прочитать письмо","goto":"read_brief"},{"label":"🧭 Сразу в штаб","goto":"hub"}]},"read_brief":{"type":"artifact","artifact":"d_brief","buttons":[{"label":"В штаб расследования","goto":"hub"}]},"hub":{"type":"hub","header":"🧭 ШТАБ · ясность {clarity}/12","text":["С чего продолжим?"],"buttons":[{"label":"🗂 Архив трёх дел","goto":"menu_data"},{"label":"🗣 Опросить людей","goto":"menu_people"},{"label":"📐 Шаблон и договор","goto":"menu_docs"},{"label":"🧪 Версии","goto":"hypotheses"},{"label":"🧠 Сеня, подскажи (−1)","goto":"senya_hint"},{"label":"📝 Заключение","goto":"report_guard"}]},"menu_data":{"type":"menu","text":["Что смотрим?"],"buttons":[{"label":"Сводка трёх дел","goto":"art_cases"},{"label":"Архив проектов подрядчика","goto":"art_archive"},{"label":"Письмо от Марата","goto":"art_marat"},{"label":"Диаграмма Исикавы","goto":"art_fish"},{"label":"← Назад","goto":"hub"}]},"menu_docs":{"type":"menu","text":["Документы:"],"buttons":[{"label":"Шаблон КР-7","goto":"art_template"},{"label":"История шаблона","goto":"art_history"},{"label":"Типовой договор","goto":"art_contract"},{"label":"ТЗ «Аптечного двора»","goto":"art_ts4"},{"label":"← Назад","goto":"hub"}]},"menu_people":{"type":"menu","text":["Кого вызываем?"],"buttons":[{"label":"Лев Борисович, «Квадрат Решений»","goto":"int_lev"},{"label":"Валерия, аналитик подрядчика","goto":"int_lera"},{"label":"Инна, «Аптечный двор»","goto":"int_inna"},{"label":"← Назад","goto":"menu_people_back"}]},"menu_people_back":{"type":"message","text":["Возвращаемся."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"art_cases":{"type":"artifact","artifact":"d_cases","text_after":["Сеня: «Не спешите с выводом „виноват подрядчик“. Подрядчик — это компания, а не причина. Сначала найдите, что именно общего у трёх дыр»."],"buttons":[{"label":"🔍 Найти общий знаменатель","goto":"mini_pattern"},{"label":"← В штаб","goto":"hub"}]},"mini_pattern":{"type":"choice","text":["<b>Мини-задача: общий знаменатель</b>","","Механизмы у трёх инцидентов разные. Что у них общего по существу?"],"buttons":[{"label":"В ТЗ не описано, как новое изменение повлияет на то, что уже работает: фоновые задания, смысл терминов, зависимые системы","correct":true,"sets_flags":["k_pattern"],"clarity":1,"feedback":["✅ Да. Новое описано хорошо везде. Везде не описано старое — то, на что новое наступит.","","Сеня: «Постановщики думали о системе, которую строят. Никто не думал о системах, рядом с которыми она будет жить»."],"goto":"hub"},{"label":"Везде ошиблись разработчики","clarity":-1,"feedback":["Во всех трёх делах код работал ровно так, как описано. Разработчики исполнили требования — дыра была в требованиях."],"goto":"mini_pattern"},{"label":"Везде появлялся новый статус","clarity":-1,"feedback":["Только в деле №1. В деле №2 — неопределённый ключ, в деле №3 — новый код справочника. Ищите уровнем выше."],"goto":"mini_pattern"}]},"art_archive":{"type":"artifact","artifact":"d_archive","text_after":["Сеня: «Семнадцать процентов против шестидесяти четырёх. Это уже не три случайных дела — это закономерность, которую видно в цифрах»."],"buttons":[{"label":"Посмотреть историю шаблона","goto":"art_history"},{"label":"← В штаб","goto":"hub"}]},"art_template":{"type":"artifact","artifact":"d_template","text_after":["Сеня: «Помните дело №1? Пункт 4.5 был в оглавлении, а текста не было. Вот откуда: в шаблоне он помечен „необязательно“. Шаблон сам подсказал, что альтернативный сценарий можно пропустить»."],"buttons":[{"label":"Посмотреть историю шаблона","goto":"art_history"},{"label":"← В штаб","goto":"hub"}]},"art_history":{"type":"artifact","artifact":"d_history","text_after":["Сеня: «Раздел 6 — влияние на существующие процессы: дело №1. Раздел 8 — зависимости от справочников: дело №3. Раздел 10 — передача в сопровождение: почтовый ящик из дела №3».","","«И посмотрите на строку „Оценка рисков изменения: не проводилась“. Запомните её — она нам понадобится»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"art_contract":{"type":"artifact","artifact":"d_contract","text_after":["Сеня: «Вот почему дыру никто не ловил. Подрядчик пишет ТЗ по шаблону, ревью проверяет соответствие шаблону, заказчик принимает по ТЗ. Три проверки подряд — и все смотрят в одну и ту же бумагу»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"art_marat":{"type":"artifact","artifact":"d_marat","text_after":["Сеня: «Марат опять первым. Обратите внимание, что он доказал: исправить у заказчика мало. Пока шаблон живёт у подрядчика, дыра приезжает с каждым новым ТЗ»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"art_fish":{"type":"artifact","artifact":"d_fish","buttons":[{"label":"🔍 Найти главную кость","goto":"mini_fish"},{"label":"← В штаб","goto":"hub"}]},"mini_fish":{"type":"choice","text":["<b>Мини-задача: диаграмма Исикавы</b>","","На четырёх костях четыре причины. Какая из них делает опасными остальные три?"],"buttons":[{"label":"Методы: в шаблоне КР-7 нет разделов влияния, зависимостей и сопровождения","correct":true,"sets_flags":["k_fish"],"clarity":1,"feedback":["✅ Верно. Уберите эту кость — и остальные перестают быть опасными: аналитики по шаблону напишут нужные разделы, ревью их проверит, заказчик примет.","","Сеня: «Остальные три кости не создают дыру. Они её не замечают. Это разные роли, и в заключении их нужно развести»."],"goto":"hub"},{"label":"Люди: аналитики пишут строго по шаблону","clarity":-1,"feedback":["Писать по стандарту — это нормально. Валерия в 2018-м писала раздел влияния, потому что он был в КР-5. Дайте людям хороший шаблон — будет хорошее ТЗ."],"goto":"mini_fish"},{"label":"Измерения: считают срок ТЗ, а не инциденты","clarity":-1,"feedback":["Метрика объясняет, почему дыру шесть лет не замечали. Но саму дыру создала не она."],"goto":"mini_fish"},{"label":"Среда: заказчики принимают только по ТЗ","clarity":-1,"feedback":["Так устроена почти любая приёмка. Это усилитель, а не источник."],"goto":"mini_fish"}]},"art_ts4":{"type":"artifact","artifact":"d_ts4","text_after":["Сеня: «Запуск послезавтра. Давайте проверим, повторяются ли здесь наши три дела. Пройдём по пунктам»."],"buttons":[{"label":"🔍 Ревью ТЗ по трём делам","goto":"review_1"},{"label":"← В штаб","goto":"hub"}]},"review_1":{"type":"choice","text":["<b>Ревью ТЗ, пункт 1 из 3</b>","","<code>3.2</code> Если препарата нет в наличии, заказ по рецепту получает статус ОТЛОЖЕН_ДО_ПОСТУПЛЕНИЯ.","","Инна уточнила: в аптечной системе давно работает ночное задание «очистка отложенных корзин старше 7 дней».","","Какое дело здесь повторяется?"],"buttons":[{"label":"№1 Склад: новый статус и старое ночное задание, которое о нём не знает","correct":true,"feedback":["✅ Один в один. Через неделю отложенные рецептурные заказы начнут исчезать по ночам — и первым это заметит фармацевт, а не мониторинг."],"goto":"review_2"},{"label":"№3 Платежи","clarity":-1,"feedback":["Справочник здесь ни при чём. Смотрите на статус и на ночное задание."],"goto":"review_1"},{"label":"Здесь всё в порядке","clarity":-1,"feedback":["Спросите себя: что ночное задание сделает с заказом, который ждёт поставку девять дней?"],"goto":"review_1"}]},"review_2":{"type":"choice","text":["<b>Ревью ТЗ, пункт 2 из 3</b>","","<code>3.4</code> Рецепт привязывается к покупателю при совпадении основных данных пациента.","","Какое дело здесь повторяется?"],"buttons":[{"label":"№2 Двойники: «основные данные» не определены — тёзок-ровесников склеит","correct":true,"feedback":["✅ Слово в слово та же формулировка. Только теперь цена ошибки — чужой рецепт на рецептурный препарат."],"goto":"review_3"},{"label":"№1 Склад","clarity":-1,"feedback":["Здесь нет статусов и фоновых заданий. Здесь есть расплывчатое правило сопоставления."],"goto":"review_2"},{"label":"Здесь всё в порядке","clarity":-1,"feedback":["Что такое „основные данные пациента“? Попробуйте ответить по тексту ТЗ."],"goto":"review_2"}]},"review_3":{"type":"choice","text":["<b>Ревью ТЗ, пункт 3 из 3</b>","","<code>3.6</code> Справочник лекарственных препаратов загружается в систему при внедрении.","<code>4.2</code> Ошибки сопоставления рецептов направляются на адрес сопровождения.","","Какое дело здесь повторяется?"],"buttons":[{"label":"№3 Платежи: своя копия справочника без обновления и ошибки в ящик, который через год закроют","correct":true,"sets_flags":["k_echo"],"clarity":2,"feedback":["✅ Все три дела в одном документе. Ни одно из них ещё не случилось — и каждое случится.","","Сеня: «Это главное, что даёт поиск корневой причины: мы видим инцидент до того, как он произошёл. Три дела назад мы бы это ТЗ подписали»."],"goto":"hub"},{"label":"№2 Двойники","clarity":-1,"feedback":["Сопоставление здесь есть, но смотрите на слова „загружается при внедрении“ и „адрес сопровождения“."],"goto":"review_3"},{"label":"Здесь всё в порядке","clarity":-1,"feedback":["Что будет, когда в справочнике препаратов появится новый препарат? А когда закончится сопровождение?"],"goto":"review_3"}]},"int_lev":{"type":"dialogue","speaker":"lev","sets_flags":["f_lev"],"lines":["<b>Лев Борисович, директор по аналитике «Квадрат Решений»</b>","","— КР-7 — лучший шаблон на рынке. ТЗ за три дня, клиенты довольны, мы выигрываем тендеры на скорости.","— Инциденты? Это эксплуатация. Мы сдали систему, приёмка подписана. Что там у клиента дальше с ночными заданиями — не наша зона."],"buttons":[{"label":"Предъявить статистику архива","goto":"int_lev_press","requires":["f_archive"]},{"label":"Потребовать отстранить автора шаблона","goto":"dead_person"},{"label":"← Назад","goto":"menu_people"}]},"int_lev_press":{"type":"dialogue","speaker":"lev","clarity":1,"lines":["— Шестьдесят четыре процента… Мы это не считали. Мы считали срок.","— Разделы я убирал сам. Клиенты жаловались, что ТЗ по сорок страниц никто не читает. А разделы 6, 8 и 10 на приёмке всё равно не проверяли — казалось, их можно убрать без потерь.","— Оценку рисков? Нет. Это же шаблон, а не система. Что с ним может случиться.","","Сеня: «„Это же шаблон, а не система“. Шаблон — это система, через которую прошли четырнадцать проектов. Его изменили так же, как в деле №1 ввели новый статус: не спросив, на что он повлияет»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"int_lera":{"type":"dialogue","speaker":"lera","sets_flags":["f_lera"],"lines":["<b>Валерия, аналитик «Квадрат Решений»</b>","","— Да, ТЗ для «Полис+» — моё. После вашего расследования я его перечитала раз двадцать.","— Знаете, что обидно? В КР-5 был раздел «Влияние на существующие процессы». Я его любила: там всегда вылезало что-то неожиданное. Его убрали, когда я работала второй год."],"buttons":[{"label":"«Почему не добавляли его сами?»","goto":"int_lera_2"},{"label":"← Назад","goto":"menu_people"}]},"int_lera_2":{"type":"dialogue","speaker":"lera","clarity":1,"lines":["— Один раз добавила. В 2020-м, в ТЗ для логистов. Ревью вернуло с замечанием «не по стандарту, раздел вне шаблона». Больше не добавляла.","— И премию считают по сроку. Лишний раздел — лишний день.","","Сеня: «Когда система наказывает за правильное поведение, правильное поведение исчезает. Не потому, что люди плохие, — потому что они внимательные»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"int_inna":{"type":"dialogue","speaker":"inna","sets_flags":["f_inna"],"lines":["<b>Инна, руководитель проекта «Аптечного двора»</b>","","— ТЗ мы подписали, всё по шаблону подрядчика, юристы проверили. Запуск первого октября, реклама уже висит.","— Какие у нас фоновые задания? Честно — не знаю. Сейчас спрошу у ИТ."],"buttons":[{"label":"«Дождаться ответа ИТ»","goto":"int_inna_2"},{"label":"← Назад","goto":"menu_people"}]},"int_inna_2":{"type":"dialogue","speaker":"inna","lines":["— Прислали список. Двенадцать ночных заданий. Вот, например: «очистка отложенных корзин старше 7 дней».","— …Подождите. А отложенные рецепты — это же тоже отложенные корзины?","","Сеня: «Вот вы и провели анализ влияния. Занял он четыре минуты. В шаблоне КР-7 на него не нашлось места»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"hypotheses":{"type":"choice","text":["🧪 <b>ВЕРСИИ</b>","","Сеня: «Версия должна объяснить, почему дыры одного типа, почему у одного подрядчика и почему именно после 2019 года»."],"buttons":[{"label":"А. Подрядчик специально оставляет дыры, чтобы продавать сопровождение","goto":"dead_greed"},{"label":"Б. Три инцидента — совпадение, отрасли разные","goto":"dead_chance"},{"label":"В. Виноват автор шаблона, его надо отстранить","goto":"dead_person"},{"label":"Г. Шаблон КР-7 выбросил разделы влияния, а ревью и приёмка смотрят только в шаблон","goto":"hypo_right"},{"label":"← В штаб","goto":"hub"}]},"hypo_right":{"type":"message","clarity":1,"condition":{"if_flags_missing":["k_pattern","k_stats"],"text":["Сеня: «Красиво, но пока это мнение. Нужен общий знаменатель трёх дел и цифры по архиву. Без них подрядчик скажет „три случая — не статистика“ и будет прав»."],"goto":"hub"},"text":["✅ Версия держится: три дела дают один класс дыр, архив — 64% инцидентов по КР-7 против 17% по КР-5.","","Сеня: «Мы знаем что. Осталось понять почему — и успеть до первого октября»."],"buttons":[{"label":"🧠 Пройти «5 почему»","goto":"why_1"},{"label":"📝 К заключению","goto":"report_guard"}]},"dead_greed":{"type":"dead_end","clarity":-2,"artifact":"d_greed","text":["🚫 <b>Тупик.</b>","","Вы пишете, что подрядчик наживается на собственных ошибках. Финансовый отдел «Квадрата» за час присылает цифры по сопровождению.","","Сеня: «Минус два. Злой умысел — самая соблазнительная версия и самая редкая. Люди, которые убегают от последствий, выглядят подозрительно, но это не то же самое, что люди, которые их устраивают»."],"buttons":[{"label":"Применить «5 почему»","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"dead_chance":{"type":"dead_end","clarity":-2,"artifact":"d_archive","text":["🚫 <b>Тупик.</b>","","Вы отвечаете Инне, что три случая — не закономерность, и запуск можно проводить. Сеня молча кладёт на стол архив подрядчика.","","Сеня: «Три случая — действительно не статистика. Двадцать шесть проектов — уже статистика. Проверяйте совпадение числами, а не ощущением»."],"buttons":[{"label":"Применить «5 почему»","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"dead_person":{"type":"dead_end","clarity":-2,"text":["🚫 <b>Тупик.</b>","","Вы требуете отстранить Льва Борисовича. Гендиректор «Квадрата» отвечает вежливо и твёрдо: шаблон утверждал техсовет, единогласно, по протоколу. Если убрать автора, шаблон останется — и завтра по нему напишут ТЗ для кого-то ещё.","","Сеня: «Четыре дела подряд мы находим одно и то же: человека можно заменить, процесс — нет. Отстранение автора закрывает вопрос „кто“, но не трогает вопрос „что“. Первое удобно. Второе полезно»."],"buttons":[{"label":"Применить «5 почему»","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"why_1":{"type":"choice","text":["<b>Метод «5 почему», шаг 1 из 5</b>","","❓ Почему у трёх заказчиков случились инциденты после внедрения?"],"buttons":[{"label":"В ТЗ не было описано влияние изменений на то, что уже работало","correct":true,"goto":"why_2"},{"label":"Это три случайные ошибки в разных системах","clarity":-1,"feedback":["64% против 17% — это не случайность."],"goto":"why_1"}]},"why_2":{"type":"choice","text":["<b>«5 почему», шаг 2 из 5</b>","","❓ Почему в ТЗ этого не было?"],"buttons":[{"label":"В шаблоне КР-7 нет таких разделов, а разделы вне шаблона ревью считает ошибкой","correct":true,"goto":"why_3"},{"label":"Аналитики поленились","clarity":-1,"feedback":["Валерия пыталась добавить раздел и получила замечание. Это не лень, это правило."],"goto":"why_2"}]},"why_3":{"type":"choice","text":["<b>«5 почему», шаг 3 из 5</b>","","❓ Почему в шаблоне нет этих разделов?"],"buttons":[{"label":"Их убрали в 2019 году при переходе с КР-5, чтобы готовить ТЗ за три дня","correct":true,"goto":"why_4"},{"label":"Их никогда и не было","clarity":-1,"feedback":["В КР-5 они были: разделы 6, 8 и 10. Протокол техсовета это подтверждает."],"goto":"why_3"}]},"why_4":{"type":"choice","text":["<b>«5 почему», шаг 4 из 5</b>","","❓ Почему за шесть лет потерю никто не заметил?"],"buttons":[{"label":"Подрядчик мерил скорость ТЗ, а не инциденты, а заказчики принимали систему строго по ТЗ","correct":true,"goto":"why_5"},{"label":"Заказчики должны были сами всё проверить","clarity":-1,"feedback":["Договор прямо говорит: чего нет в ТЗ, того нет в договоре. Заказчики проверяли ровно то, что им дали проверить."],"goto":"why_4"}]},"why_5":{"type":"choice","text":["<b>«5 почему», шаг 5 из 5</b>","","❓ Почему шаблон, через который проходят все проекты подрядчика, вообще изменили так, что сломалось сразу всё?"],"buttons":[{"label":"Шаблон поменяли без анализа влияния — той же ошибкой, которую он потом тиражировал у заказчиков","correct":true,"sets_flags":["k_chain"],"clarity":2,"feedback":["✅ Дно сезона.","","В деле №1 новый статус ввели, не спросив, на что он повлияет. В деле №2 правило дубля ввели, не спросив, что будет при ошибке. В деле №3 интеграцию ввели, не спросив, от чего она зависит.","","А в 2019 году подрядчик ввёл новый шаблон — и не спросил ни того, ни другого, ни третьего. Протокол: «Оценка рисков изменения: не проводилась».","","Сеня: «Ошибка, которую не замечают в собственном процессе, становится стандартом. А стандарт тиражирует её лучше любого злоумышленника»."],"goto":"hub"},{"label":"Директор по аналитике хотел сэкономить","clarity":-1,"feedback":["Сэкономить хотели все, и цель была разумной: клиенты правда не читали сорок страниц. Вопрос не в цели, а в том, как изменение проверили."],"goto":"why_5"},{"label":"Рынок требовал скорости","clarity":-1,"feedback":["Рынок объясняет мотив. Не объясняет, почему изменение шаблона не прошло ту же проверку, что любое другое изменение."],"goto":"why_5"}]},"senya_hint":{"type":"hint","clarity":-1,"rules":[{"if_missing":"f_cases","text":"Сеня: «Начните со сводки трёх дел. Разложите их рядом и найдите строку, которая совпадает»."},{"if_missing":"k_pattern","text":"Сеня: «Механизмы разные. Что общего у дыр — не в коде, а в ТЗ? Разберите сводку»."},{"if_missing":"k_stats","text":"Сеня: «Три случая подрядчик назовёт совпадением. Посмотрите архив его проектов целиком»."},{"if_missing":"k_removed","text":"Сеня: «Разделов нет в шаблоне. А были ли они раньше? Загляните в историю шаблона»."},{"if_missing":"k_echo","text":"Сеня: «До запуска два дня. Проверьте ТЗ „Аптечного двора“ по трём нашим делам»."},{"if_missing":"k_fish","text":"Сеня: «Причин у нас несколько: люди, метрики, приёмка, шаблон. Разложите их на рыбьей кости и найдите главную»."},{"if_missing":"k_chain","text":"Сеня: «Мы знаем, что убрали и когда. Не знаем, почему это вообще стало возможно. Прогоните „5 почему“ до самого дна»."},{"default":"Сеня: «Материала достаточно. Формулируйте заключение — это последнее заключение сезона»."}]},"report_guard":{"type":"gate","condition":{"required_flags":["k_removed","k_echo","k_chain"],"on_fail":{"clarity":-3,"text":["⚠️ Вы выходите к двум директорам сразу — «Квадрата» и «Аптечного двора» — слишком рано.","","Лев Борисович: «Докажите, что дело в шаблоне, а не в клиентах». Инна: «Докажите, что у нас риск, а не у них». Ответов нет.","","Сеня: «Ясность −3. Нужна история шаблона, нужно ревью нового ТЗ, нужна цепочка до самого дна»."],"goto":"hub"}},"goto":"report_cause"},"report_cause":{"type":"choice","text":["📝 <b>ЗАКЛЮЧЕНИЕ СЕЗОНА</b> · поле 1 из 3","","<b>Корневая причина:</b>"],"buttons":[{"label":"Из шаблона КР-7 без анализа влияния убрали разделы влияния, зависимостей и сопровождения, а ревью и приёмка проверяют только то, что есть в шаблоне","correct":true,"score":3,"goto":"report_component"},{"label":"Низкая квалификация аналитиков подрядчика","score":0,"feedback_after":"Аналитики писали ровно то, что требовал стандарт, а когда пытались больше — получали замечание.","goto":"report_component"},{"label":"Заказчики невнимательно читают ТЗ","score":1,"feedback_after":"Отчасти: приёмка только по ТЗ — усилитель. Но нельзя прочитать раздел, которого нет.","goto":"report_component"},{"label":"Совпадение трёх независимых ошибок","score":0,"feedback_after":"Архив говорит обратное: 64% против 17%.","goto":"report_component"}]},"report_component":{"type":"choice","text":["📝 Поле 2 из 3","","<b>Что исправлять:</b>"],"buttons":[{"label":"Шаблон КР-7 и ревью ТЗ у подрядчика, порядок приёмки у заказчиков","correct":true,"score":3,"goto":"report_reco"},{"label":"Только шаблон","score":1,"feedback_after":"Не только: пока ревью проверяет „соответствие шаблону“, а приёмка — „соответствие ТЗ“, следующий урезанный шаблон пройдёт так же незаметно.","goto":"report_reco"},{"label":"Штат аналитиков подрядчика","score":0,"goto":"report_reco"},{"label":"Системы трёх пострадавших заказчиков","score":0,"feedback_after":"Их уже починили в делах №1–3. Источник по-прежнему работает.","goto":"report_reco"}]},"report_reco":{"type":"input","kind":"choice_or_text","text":["📝 Поле 3 из 3","","<b>Рекомендация.</b> Выберите вариант или впишите свой."],"buttons":[{"label":"Вернуть в шаблон разделы влияния, зависимостей и сопровождения, включить их в ревью и приёмку, мерить инциденты после запуска, ТЗ аптек доработать до старта","correct":true,"score":3,"goto":"ending_calc"},{"label":"Доработать ТЗ «Аптечного двора» и провести запуск","score":2,"feedback_after":"Аптеки спасены. Следующий клиент «Квадрата» получит ТЗ по тому же КР-7.","goto":"ending_calc"},{"label":"Порекомендовать заказчикам сменить подрядчика","score":1,"feedback_after":"Дыра уйдёт к тем, кто продолжит работать с этим шаблоном. А новый подрядчик может принести свою.","goto":"ending_calc"},{"label":"Отстранить автора шаблона","score":0,"feedback_after":"Шаблон останется прежним.","goto":"ending_calc"}],"text_accept":{"keywords_high":["влияни","зависим","сопровожд","шаблон","приёмк","приемк","ревью","чек-лист","чеклист","раздел","инцидент"],"score_if_keyword":3,"score_default":1}},"ending_calc":{"type":"router","routes":[{"if":"clarity <= 0","goto":"ending_fail"},{"if":"score >= 8 && clarity >= 9","goto":"ending_perfect"},{"if":"score >= 6","goto":"ending_good"},{"if":"score >= 3","goto":"ending_weak"},{"default":"ending_wrong"}]},"ending_perfect":{"type":"ending","title":"Дело раскрыто. Чисто","text":["🏆 <b>Сезон закрыт</b>","","«Аптечный двор» перенёс запуск на десять дней. Инна была недовольна ровно до того момента, как ИТ нашло в своих ночных заданиях ещё два, которые съели бы отложенные рецепты.","","«Квадрат Решений» выпустил шаблон КР-8: разделы влияния, зависимостей и передачи сопровождения вернулись, а ревью теперь проверяет их первыми. Представлял изменения Лев Борисович. Срок ТЗ вырос до пяти дней. Инциденты теперь считают.","","Валерия прислала первое ТЗ по КР-8. Раздел «Влияние на существующие процессы» занял три страницы. «Там опять вылезло неожиданное», — написала она.","","Марат прислал открытку с термокружкой.","","Сеня: «Четыре дела. Ни одного злодея. Вы искали, кто виноват, а находили, как устроено. Это и есть работа аналитика»."],"rewards":["Значок «Страж сезона»","Сезон 1 пройден"]},"ending_good":{"type":"ending","title":"Дело раскрыто","text":["✅ <b>Сезон закрыт</b>","","Причина названа верно: шаблон. Запуск аптек перенесён, ТЗ доработано, подрядчик обещал вернуть разделы.","","На защите директора долго спорили, кто должен менять приёмку — подрядчик или заказчики. Договорились вернуться к вопросу через квартал.","","Сеня: «Хорошо. Следите за этим „через квартал“: там обычно и живут следующие инциденты»."],"rewards":["Сезон 1 пройден"]},"ending_weak":{"type":"ending","title":"Аптеки спасли, шаблон остался","text":["⚠️ <b>Дело закрыто наполовину</b>","","ТЗ «Аптечного двора» доработали за ночь, запуск прошёл первого октября без происшествий. Все довольны.","","В ноябре «Квадрат Решений» подписывает договор с сетью автосервисов. ТЗ готово за три дня. Шаблон — КР-7.","","Сеня: «Вы починили четвёртый случай. Фабрика случаев работает дальше»."]},"ending_wrong":{"type":"ending","title":"Не та причина","text":["❌ <b>Заключение отклонено</b>","","Ваша версия не объясняет, почему инцидентов стало в четыре раза больше именно после 2019 года и почему все они одного класса.","","Сеня: «После трёх дел мы оба знаем правило: причина обязана объяснять числа. Это последнее дело сезона — не нарушайте его»."]},"ending_fail":{"type":"ending","title":"Вас сняли с дела","text":["🚫 <b>Ясность 0</b>","","Версии о злом умысле, совпадении и виноватом авторе рассыпались одна за другой. «Аптечный двор» запустился первого октября.","","Через девять дней ночное задание очистило 212 отложенных рецептурных заказов.","","Сеня: «Пройдите сезон ещё раз. Каждое прошлое дело уже подсказало вам ответ»."]}}},{"$schema_note":"Сезон 2 «Спящие задания», дело №1. Формат тот же, что в сезоне 1: многострочные тексты — массивы строк, схемы в поле ascii для моноширинного блока. Дело открывается кодовым словом из поста на Бусти (player.code_sha256).","case_id":"s2_case_01_bonus","title":"Сезон 2 · Дело №1. Сгорели дважды","subtitle":"Цифровой страж · служебное расследование","difficulty":"средний","estimated_minutes":20,"player":{"season":2,"number":1,"cover":"bonus","
