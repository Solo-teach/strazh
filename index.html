<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Детективный квест для системных аналитиков: расследуйте инцидент методами системного анализа.">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<title>Цифровой страж</title>

<style>
  :root {
    --bg: #0F1317;
    --bg-2: #151A20;
    --bubble: #1C232B;
    --bubble-line: #2A333D;
    --text: #C3CCD6;
    --text-strong: #EEF3F8;
    --dim: #7C8792;
    --lamp: #E0A33A;
    --red: #C4483C;
    --green: #4F9668;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
    --sans: "Segoe UI", system-ui, Roboto, sans-serif;
    --col: min(96vw, 560px);
    --ink: #AEB9C4;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #E7E4DE; --bg-2: #DFDBD3; --bubble: #FBFAF7; --bubble-line: #DAD5CB;
      --text: #333A41; --text-strong: #14181C; --dim: #6E7780; --ink: #2B3137;
    }
  }
  :root[data-theme="light"] {
    --bg: #E7E4DE; --bg-2: #DFDBD3; --bubble: #FBFAF7; --bubble-line: #DAD5CB;
    --text: #333A41; --text-strong: #14181C; --dim: #6E7780; --ink: #2B3137;
  }
  :root[data-theme="dark"] {
    --bg: #0F1317; --bg-2: #151A20; --bubble: #1C232B; --bubble-line: #2A333D;
    --text: #C3CCD6; --text-strong: #EEF3F8; --dim: #7C8792; --ink: #AEB9C4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    width: var(--col);
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--bubble-line);
    border-right: 1px solid var(--bubble-line);
    background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 240px);
  }

  /* ---------- шапка ---------- */

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: color-mix(in srgb, var(--bg-2) 94%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--bubble-line);
    padding: 11px 15px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .badge {
    width: 34px; height: 34px; flex: none;
    border-radius: 3px;
    background: var(--lamp);
    color: #14181C;
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
  }
  .htitle { font-family: var(--mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-strong); }
  .hsub { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
  .hright { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .clarity { text-align: right; }
  .clock { text-align: right; font-family: var(--mono); }
  .clock:empty { display: none; }
  .clock-t { font-size: 15px; font-weight: 700; color: var(--text-strong); letter-spacing: .04em; }
  .clock-d { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-top: 2px; }
  .clock.late .clock-t { color: var(--red); }
  .clock.tick .clock-t { animation: tick .5s ease-out; }
  @keyframes tick { 30% { color: var(--lamp); transform: translateY(-2px); } }
  .clarity-lab { font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .bars { display: flex; gap: 2px; margin-top: 5px; }
  .bar { width: 5px; height: 12px; background: var(--lamp); border-radius: 1px; }
  .bar.off { background: var(--bubble-line); }
  .bars.low .bar:not(.off) { background: var(--red); }

  /* ---------- лента ---------- */

  main { flex: 1; padding: 16px 15px 8px; display: flex; flex-direction: column; gap: 10px; }

  .msg {
    background: var(--bubble);
    border: 1px solid var(--bubble-line);
    border-radius: 3px 12px 12px 12px;
    padding: 12px 14px;
    font-size: 15.5px;
    line-height: 1.55;
    max-width: 94%;
    animation: pop .22s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .msg b { color: var(--text-strong); }
  .msg i { color: var(--dim); }
  .msg a { color: var(--lamp); }
  .msg code { font-family: var(--mono); font-size: 13px; background: rgba(224,163,58,.14); padding: 1px 5px; border-radius: 2px; }

  .msg.doc { padding: 0; overflow: hidden; }
  .msg.doc .doc-head {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim); padding: 10px 14px; border-bottom: 1px solid var(--bubble-line);
    display: flex; justify-content: space-between; gap: 10px;
  }
  .msg.doc .doc-body { padding: 12px 14px; }
  pre {
    margin: 0;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.55;
    white-space: pre;
    overflow-x: auto;
    color: var(--text-strong);
    padding-bottom: 4px;
  }
  /* строки документа, по которым можно тыкать */
  .lines { overflow-x: auto; padding-bottom: 4px; }
  .ln {
    cursor: pointer; border-radius: 2px; padding: 1px 4px; margin: 0 -4px;
    transition: background .15s, box-shadow .15s;
  }
  .lines.mono .ln { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; white-space: pre; color: var(--text-strong); width: max-content; min-width: 100%; }
  .lines.text .ln { font-size: 15px; line-height: 1.55; padding: 3px 6px; margin: 0 -6px; }
  .ln.empty { cursor: default; }
  .ln:not(.empty):hover { box-shadow: inset 0 -1px 0 var(--lamp); }
  .ln.on { background: rgba(224,163,58,.32); box-shadow: inset 3px 0 0 var(--lamp); }
  .ln.ok { background: rgba(79,150,104,.32); box-shadow: inset 3px 0 0 var(--green); }
  .ln.bad { background: rgba(196,72,60,.30); box-shadow: inset 3px 0 0 var(--red); animation: shake .32s; }
  .lines.done .ln { cursor: default; }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .pick-hint { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--lamp); padding: 8px 14px 0; }

  /* разложить по порядку */
  .seq { display: flex; flex-direction: column; gap: 6px; }
  .seq-slot {
    border: 1px dashed var(--bubble-line); border-radius: 3px; padding: 9px 11px; min-height: 40px;
    font-size: 14.5px; display: flex; gap: 10px; align-items: baseline; color: var(--dim);
  }
  .seq-slot b { font-family: var(--mono); font-size: 12px; color: var(--lamp); min-width: 16px; }
  .seq-slot.filled { border-style: solid; color: var(--text-strong); background: var(--bg-2); cursor: pointer; animation: pop .18s ease-out; }
  .seq-slot.ok { border-color: var(--green); }
  .seq-slot.bad { border-color: var(--red); animation: shake .32s; }
  .deck { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--bubble-line); }
  .deck:empty { display: none; }
  .card {
    appearance: none; text-align: left; cursor: pointer;
    background: var(--bubble); border: 1px solid var(--lamp); border-radius: 3px;
    padding: 9px 11px; font-family: var(--sans); font-size: 14.5px; line-height: 1.35; color: var(--text-strong);
  }
  .card:hover { background: var(--bg-2); }

  /* входящее сообщение */
  .msg.inbox { border-color: var(--lamp); border-radius: 12px 12px 12px 3px; align-self: flex-end; background: color-mix(in srgb, var(--bubble) 88%, var(--lamp)); animation: inbox .35s ease-out; }
  .msg.inbox.with-ava { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; }
  .msg.inbox .ava .art-face { width: 44px; height: 52px; }
  .msg.inbox .ava .art-face.art-img { width: 44px; height: 44px; object-fit: cover; object-position: 50% 20%; border-radius: 50%; border: 2px solid var(--lamp); }
  .msg.inbox .from { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--lamp); margin-bottom: 4px; }
  @keyframes inbox { from { opacity: 0; transform: translateX(14px); } }

  .note { font-size: 13.5px; color: var(--dim); font-style: italic; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--bubble-line); }

  .sys {
    align-self: center;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--dim);
    padding: 3px 0;
  }
  .sys.up { color: var(--green); }
  .sys.down { color: var(--red); }

  /* ---------- гравюры ---------- */

  .art { display: block; color: var(--ink); }
  .msg.cover { padding: 0; overflow: hidden; max-width: 100%; }
  .msg.cover .art-wide { width: 100%; height: auto; }
  .msg.cover .art-img { aspect-ratio: 3 / 2; object-fit: cover; background: var(--bubble-line); }
  .msg.talk .art-face.art-img { width: 64px; height: 64px; object-fit: cover; object-position: 50% 20%; border-radius: 50%; border: 2px solid var(--bubble-line); background: var(--bubble-line); }
  .msg.talk { grid-template-columns: 64px 1fr; }
  .msg.cover .cap {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim); padding: 9px 14px; border-top: 1px solid var(--bubble-line);
    display: flex; justify-content: space-between; gap: 10px;
  }

  .msg.talk { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: start; }
  .msg.talk .art-face { width: 58px; height: 70px; }
  .msg.talk .who { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-top: 6px; text-align: center; }

  .msg.doc { position: relative; }
  .msg.doc .doc-head { padding-right: 38px; }
  .msg.doc .art-clip { position: absolute; top: -6px; right: 16px; width: 11px; height: 26px; color: var(--dim); }

  .stamp {
    align-self: center;
    margin: 6px 0 2px;
    padding: 7px 16px 6px;
    font-family: var(--mono); font-weight: 700; font-size: 17px; letter-spacing: .22em; text-transform: uppercase;
    border: 3px double currentColor; border-radius: 4px;
    transform: rotate(-7deg);
    opacity: .9;
    animation: stampin .38s cubic-bezier(.3, 1.6, .5, 1) both;
    -webkit-mask-image: repeating-linear-gradient(115deg, #000 0 7px, rgba(0,0,0,.72) 7px 9px);
            mask-image: repeating-linear-gradient(115deg, #000 0 7px, rgba(0,0,0,.72) 7px 9px);
  }
  .stamp.win { color: var(--green); }
  .stamp.lose { color: var(--red); }
  .stamp.small { font-size: 12px; padding: 4px 11px 3px; transform: rotate(5deg); }
  @keyframes stampin { from { opacity: 0; transform: scale(2.2) rotate(-16deg); } }

  .msg.verdict { border-color: var(--lamp); }
  .msg.bad { border-color: var(--red); }
  .msg.good { border-color: var(--green); }

  /* ---------- клавиатура ---------- */

  footer {
    position: sticky;
    bottom: 0;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--bubble-line);
    padding: 10px 15px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .kb { display: flex; flex-direction: column; gap: 7px; }
  .key {
    appearance: none;
    text-align: left;
    background: var(--bubble);
    border: 1px solid var(--bubble-line);
    border-radius: 3px;
    padding: 11px 13px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14.5px;
    line-height: 1.35;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .key:hover { border-color: var(--lamp); color: var(--text-strong); }
  .key:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  .key.back { color: var(--dim); font-size: 13px; }
  .key.risk:hover { border-color: var(--red); }

  .entry { display: flex; gap: 7px; }
  .entry input {
    flex: 1;
    background: var(--bubble);
    border: 1px solid var(--bubble-line);
    border-radius: 3px;
    padding: 11px 13px;
    color: var(--text-strong);
    font-family: var(--mono);
    font-size: 14px;
  }
  .entry input:focus { outline: 2px solid var(--lamp); outline-offset: 0; }
  .entry button {
    appearance: none;
    background: var(--lamp);
    border: 0;
    border-radius: 3px;
    padding: 0 18px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #14181C;
    cursor: pointer;
  }

  .cmdbar { display: flex; gap: 12px; padding-top: 2px; }
  .cmd {
    appearance: none; background: none; border: 0; padding: 0;
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    color: var(--dim); cursor: pointer; border-bottom: 1px dotted currentColor;
  }
  .cmd:hover { color: var(--text-strong); }

  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; } }
</style>

<div class="shell">
  <header>
    <div class="badge">ЦС</div>
    <div>
      <div class="htitle">Цифровой страж</div>
      <div class="hsub" id="hsub">служебные расследования</div>
    </div>
    <div class="hright">
      <div class="clock" id="clock"></div>
      <div class="clarity">
        <div class="clarity-lab">ясность</div>
        <div class="bars" id="bars"></div>
      </div>
    </div>
  </header>

  <main id="feed"></main>

  <footer>
    <div class="kb" id="kb"></div>
    <div class="cmdbar">
      <button class="cmd" id="cCase" type="button">/case</button>
      <button class="cmd" id="cHint" type="button">/hint</button>
      <button class="cmd" id="cReport" type="button">/report</button>
      <button class="cmd" id="cRestart" type="button">/start заново</button>
      <button class="cmd" id="cCases" type="button">/дела</button>
      <button class="cmd" id="cSound" type="button" aria-pressed="true">звук вкл</button>
    </div>
  </footer>
</div>

<script>
// «Цифровой страж» — гравюры.
// Всё рисуется векторно: штриховка через SVG-паттерны, как на офортах.
// Цвет берётся из currentColor, поэтому рисунки живут и в тёмной, и в светлой теме.
// Акцент (лампа, луна, свет) — var(--lamp).

const ART = (() => {
  "use strict";

  // готовые картинки из img/ (список подставляет сборка); чего нет — рисуем гравюрой
  const IMAGES = new Set(["alina", "artem", "cover_board", "cover_office", "cover_payments", "cover_twins", "cover_warehouse", "director", "gosha", "hero", "ignat", "inna", "kira", "lera", "lev", "marat", "nastya", "olya", "pavel", "ruslan", "senya", "support", "timur", "zhenya", "zoya"]);
  const photo = (key, cls, alt) =>
    `<img class="${cls}" src="img/${key}.webp" alt="${alt || ""}" loading="lazy" decoding="async">`;

  let uid = 0;

  // штриховка: шаг, толщина, угол, прозрачность
  function hatch(step, w, rot, op) {
    const id = "h" + (++uid);
    return {
      id, url: `url(#${id})`,
      def: `<pattern id="${id}" width="${step}" height="${step}" patternUnits="userSpaceOnUse" patternTransform="rotate(${rot})">
        <line x1="0" y1="0" x2="0" y2="${step}" stroke="currentColor" stroke-width="${w}" opacity="${op == null ? 1 : op}"/></pattern>`
    };
  }

  // перекрёстная штриховка — для самых тёмных мест
  function cross(step, w, rot, op) {
    const id = "x" + (++uid);
    return {
      id, url: `url(#${id})`,
      def: `<pattern id="${id}" width="${step}" height="${step}" patternUnits="userSpaceOnUse" patternTransform="rotate(${rot})">
        <path d="M0 0V${step}M0 0H${step}" stroke="currentColor" stroke-width="${w}" opacity="${op == null ? 1 : op}"/></pattern>`
    };
  }

  const svg = (vb, body, label, cls) =>
    `<svg class="${cls || "art"}" viewBox="${vb}" fill="none" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'}>${body}</svg>`;

  // ---------- обложка списка дел: лампа, папка, лупа ----------

  function office() {
    const bg = cross(7, .7, 30, .28), dark = hatch(3.2, 1, 45), mid = hatch(4.4, .9, -35, .8),
      light = hatch(6, .7, 20, .55);
    return svg("0 0 560 210", `
      <defs>${bg.def}${dark.def}${mid.def}${light.def}
        <radialGradient id="glow${uid}" cx="50%" cy="10%" r="75%">
          <stop offset="0" stop-color="var(--lamp)" stop-opacity=".30"/>
          <stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/>
        </radialGradient></defs>
      <rect width="560" height="210" fill="${bg.url}"/>
      <path d="M318 44 L140 196 H520 Z" fill="var(--bubble)"/>
      <path d="M318 44 L140 196 H520 Z" fill="url(#glow${uid})"/>
      <g stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
        <!-- лампа -->
        <path d="M470 196 v-8 h60 v8" stroke-width="2.4" fill="${dark.url}"/>
        <path d="M500 188 L440 96 L360 40" stroke-width="3.4"/>
        <circle cx="440" cy="96" r="5" stroke-width="2.2" fill="var(--bubble)"/>
        <path d="M372 16 L296 52 L312 70 L386 34 Z" stroke-width="2.4" fill="${dark.url}"/>
        <path d="M298 55 q10 12 16 14" stroke="var(--lamp)" stroke-width="3"/>
        <!-- папка -->
        <path d="M178 150 l16 -46 h52 l8 10 h104 l-14 36 z" stroke-width="2.2" fill="${light.url}"/>
        <path d="M168 196 l14 -48 h190 l-14 48 z" stroke-width="2.4" fill="var(--bubble)"/>
        <path d="M168 196 l14 -48 h190 l-14 48 z" stroke-width="2.4" fill="${light.url}"/>
        <path d="M214 160 h96 l-5 16 h-96 z" stroke-width="1.8" fill="var(--bubble)"/>
        <text x="258" y="172" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10"
          letter-spacing="2" fill="currentColor" stroke="none">ДЕЛО</text>
        <!-- листок с чертой -->
        <path d="M244 108 l6 -16 h70 l-6 16" stroke-width="1.6" fill="var(--bubble)"/>
        <path d="M258 99 h40 M256 104 h30" stroke-width="1.2" opacity=".8"/>
        <!-- лупа -->
        <path d="M112 166 l-26 22" stroke-width="7"/>
        <path d="M112 166 l-26 22" stroke="var(--bubble)" stroke-width="2.6"/>
        <circle cx="136" cy="146" r="30" stroke-width="3" fill="${mid.url}" fill-opacity=".35"/>
        <circle cx="136" cy="146" r="25" stroke-width="1.6"/>
        <path d="M118 134 a22 22 0 0 1 14 -10" stroke-width="2.4" opacity=".9"/>
        <!-- след от кофе -->
        <ellipse cx="420" cy="178" rx="26" ry="8" stroke-width="1.4" stroke-dasharray="40 8 22 6" opacity=".7"/>
      </g>`, "Настольная лампа над папкой с делом", "art art-wide");
  }

  // ---------- дело №1: ночной склад ----------

  function warehouse() {
    const bg = cross(8, .7, 20, .22), wall = hatch(5, .8, 90, .45), dark = hatch(3, 1, 45),
      box = hatch(4.2, .9, -40, .85), box2 = hatch(6, .8, 35, .6), sky = cross(3.4, .8, 45, .9);
    const clockH = (a, r) => `${492 + r * Math.sin(a)} ${58 - r * Math.cos(a)}`;
    const H = 95 * Math.PI / 180, M = 60 * Math.PI / 180; // 03:10
    let boxes = "";
    // стеллаж: 3 полки × 4 места, на средней полке — пустота
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 4; col++) {
        const x = 172 + col * 66, y = 70 + row * 44;
        if (row === 1 && (col === 1 || col === 2)) {
          boxes += `<rect x="${x + 4}" y="${y + 8}" width="52" height="30" stroke-width="1.4" stroke-dasharray="4 4" opacity=".9"/>`;
          continue;
        }
        const f = (row + col) % 2 ? box.url : box2.url;
        boxes += `<rect x="${x + 4}" y="${y + 8}" width="52" height="30" stroke-width="1.8" fill="var(--bubble)"/>
          <rect x="${x + 4}" y="${y + 8}" width="52" height="30" stroke-width="1.8" fill="${f}"/>
          <path d="M${x + 30} ${y + 8} v10" stroke-width="3" stroke="var(--bubble)"/>
          <path d="M${x + 30} ${y + 8} v10" stroke-width="1.2"/>`;
      }
    }
    return svg("0 0 560 230", `
      <defs>${bg.def}${wall.def}${dark.def}${box.def}${box2.def}${sky.def}</defs>
      <rect width="560" height="230" fill="${bg.url}"/>
      <rect x="0" y="0" width="560" height="196" fill="${wall.url}"/>
      <g stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
        <!-- окно с луной -->
        <rect x="34" y="26" width="92" height="74" stroke-width="2.6" fill="${sky.url}"/>

  // ---------- дело №3: пропавшие платежи ----------
  // Банк → труба → трансформатор → дом. Часть конвертов падает в ящик с паутиной.

  function envelope(x, y, rot, s) {

    let windows = "";
    for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) {

        fill="${lit ? "var(--lamp)" : dark.url}" ${lit ? 'fill-opacity=".85"' : ""}/>`;

    const teeth = Array.from({ length: 10 }, (_, i) => {
      return `<rect x="-5" y="-40" width="10" height="10" transform="rotate(${i * 36})" stroke-width="1.6" fill="var(--bubble)"/>`;

        <rect x="450" y="60" width="80" height="136" stroke-width="2.6" fill="${light.url}"/>
        ${windows}
        <path d="M444 60 H536" stroke-width="3"/>
        <!-- жёлоб отбраковки и падающие конверты -->
        <path d="M300 156 v14 l-26 20" stroke-width="2.4"/>

          fill="currentColor" stroke="none" opacity=".55">?</text>

  }

  // ---------- сезон 2, дело №1: бонусная карта горит дважды ----------
  // Карта лояльности на столе, над ней два одинаковых язычка пламени, рядом часы и журнал с двумя строками.

  function bonus() {
    const bg = cross(7, .7, 25, .24), dark = hatch(3, 1, 45), card = hatch(5, .8, -30, .55), paper = hatch(6, .6, 0, .4);
    const flame = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">
      <path d="M0 0 c-16 -10 -18 -30 -6 -46 c2 10 8 14 12 12 c-4 -14 4 -30 16 -38 c-2 16 12 26 12 44 c0 18 -14 30 -34 28 z"
        stroke-width="2.2" fill="var(--lamp)" fill-opacity=".85"/>
      <path d="M6 -4 c-8 -6 -8 -16 -2 -24 c2 6 6 8 8 6 c0 10 4 14 2 18 z" stroke-width="1.4" fill="var(--bubble)"/></g>`;
    const H = 97 * Math.PI / 180, M = 90 * Math.PI / 180; // 03:15
    const hand = (a, r) => `${470 + r * Math.sin(a)} ${62 - r * Math.cos(a)}`;
    return svg("0 0 560 230", `

        <circle cx="470" cy="62" r="28" stroke-width="2.6" fill="var(--bubble)"/>

  // ---------- портреты ----------
  // Камея в овале: плечи, голова, причёска и одна примета.

    const cid = "c" + (++uid);
    const hair = {
      short: `<path d="M-19 -6 c0 -18 8 -25 19 -25 c12 0 19 7 19 24 c-4 -8 -12 -11 -20 -11 c-8 0 -14 4 -18 12 z" fill="currentColor"/>`,
      side: `<path d="M-19 -4 c-1 -18 8 -27 20 -27 c12 0 19 8 18 24 c-10 -2 -22 -8 -28 -16 c-2 8 -6 14 -10 19 z" fill="currentColor"/>`,
      long: `<path d="M-20 26 c-6 -18 -4 -38 2 -48 c6 -10 30 -10 36 0 c6 10 8 30 2 48 l-6 -2 c3 -12 2 -26 -3 -34 c-10 4 -20 4 -28 0 c-5 8 -6 22 -3 34 z" fill="currentColor"/>`,
      bun: `<circle cx="0" cy="-36" r="9" fill="currentColor"/><path d="M-19 -4 c0 -18 8 -26 19 -26 c11 0 19 8 19 26 c-6 -10 -12 -14 -19 -14 c-7 0 -13 4 -19 14 z" fill="currentColor"/>`,
      curly: `<path d="M-21 -2 c-6 -6 -2 -14 2 -16 c-2 -8 6 -14 12 -12 c4 -6 14 -6 18 0 c6 -2 12 4 10 12 c5 4 5 12 -1 16 c-4 -8 -10 -12 -20 -12 c-10 0 -16 4 -21 12 z" fill="currentColor"/>`,
      bob: `<path d="M-21 14 c-4 -22 0 -44 21 -44 c21 0 25 22 21 44 l-5 0 c1 -10 0 -20 -3 -26 c-8 -4 -18 -8 -24 -14 c-3 8 -6 20 -5 40 z" fill="currentColor"/>`,
      none: ""
    }[L.hair];
    const acc = {
      hood: `<path d="M-30 58 c-4 -30 0 -58 10 -76 c10 -16 30 -16 40 0 c10 18 14 46 10 76" stroke-width="2.4" fill="none"/>`,
      tie: `<path d="M0 42 l-5 6 l5 26 l5 -26 z" fill="currentColor"/>`,

// «Цифровой страж» — звук.

const SFX = (() => {
  "use strict";

  let AC = null, on = true, broken = false;
  try { on = localStorage.getItem("cs_quest_sound") !== "0"; } catch (e) {}

  function ac() {
    if (!on || broken) return null;
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) { broken = true; return null; }
    if (!AC) { try { AC = new Ctor(); } catch (e) { broken = true; return null; } }
    if (AC.state === "suspended") AC.resume();
    return AC;
  }

  function noise(a, dur, from, to, peak, q, delay) {
    const t = a.currentTime + (delay || 0);
    const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = a.createBufferSource(); src.buffer = buf;
    const bp = a.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = q || .7;
    bp.frequency.setValueAtTime(from, t);
    bp.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(bp).connect(g).connect(a.destination);
    src.start(t); src.stop(t + dur);
  }

  function tone(a, type, f0, f1, dur, peak, delay) {
    const t = a.currentTime + (delay || 0);
    const o = a.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + .015);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + .02);
  }

  const play = (fn) => () => { const a = ac(); if (a) try { fn(a); } catch (e) { /* звук — не повод ломать игру */ } };

  return {
    // клавиша печатной машинки
    key: play(a => { noise(a, .045, 4200, 2500, .16, 2.2); tone(a, "square", 1400, 900, .03, .025); }),
    // лист бумаги
    page: play(a => noise(a, .22, 3200, 900, .22)),
    // раскрыть папку с делом
    open: play(a => { noise(a, .32, 1800, 500, .22, .5); noise(a, .18, 3000, 1200, .12, .8, .14); }),
    // ясность выросла: две ноты вверх
    up: play(a => { tone(a, "sine", 660, 660, .16, .09); tone(a, "sine", 990, 990, .22, .08, .09); }),
    // ясность упала: глухой спуск
    down: play(a => { tone(a, "sine", 150, 96, .28, .28); tone(a, "triangle", 110, 70, .36, .12, .06); }),
    // входящее сообщение: короткий двойной сигнал
    ping: play(a => { tone(a, "sine", 1320, 1320, .09, .06); tone(a, "sine", 1760, 1760, .12, .05, .1); }),
    // маркер по бумаге
    mark: play(a => noise(a, .12, 5200, 2600, .1, 1.6)),
    // часы: стрелка перескочила дедлайн
    late: play(a => { [0, .32].forEach(d => tone(a, "triangle", 880, 860, .26, .07, d)); }),
    // печать
    stamp: play(a => {
      noise(a, .09, 2600, 1200, .4, 1.2);
      tone(a, "square", 190, 70, .16, .32);
      tone(a, "sine", 130, 52, .34, .3, .02);
    }),
    // дело раскрыто: печать и светлый аккорд
    solved: play(a => {
      noise(a, .09, 2600, 1200, .4, 1.2);
      tone(a, "sine", 130, 52, .34, .3, .02);
      [523, 659, 784].forEach((f, i) => tone(a, "sine", f, f, 1.1, .07, .22 + i * .07));
    }),
    // провал: печать и низкий гул
    failed: play(a => {

    toggle() {
      on = !on;

    }

ений."]},"a_regulation":{"title":"Регламент задания stock_cleanup (2019)","tag":"документация","sets_flags":["f_regulation"],"text":["РЕГЛАМЕНТ ФОНОВОГО ЗАДАНИЯ stock_cleanup, ред. от 14.11.2019","","Назначение: освобождать складские ячейки от «повисших» резервов.","","Правило: если резерв находится в незавершённом состоянии более 14 календарных дней, товар считается утраченным (бой, порча, пересорт) и списывается операцией WRITE_OFF.","","Перечень незавершённых состояний: любое состояние резерва, кроме COMPLETED и CANCELLED.","","Согласовано: склад, ИТ. Изменений с 2019 года не вносилось."],"note":"Ключевая формулировка — «любое состояние, кроме COMPLETED и CANCELLED». Правило написано на будущее, которого никто не проверил."},"a_ts":{"title":"ТЗ на интеграцию с маркетплейсом, версия 3.4","tag":"требования","sets_flags":["f_ts"],"text":["ТЗ «Возвраты с маркетплейса», версия 3.4, утверждено 20.06","Подготовлено: ООО «Квадрат Решений», шаблон постановки КР-7","","4.1 Покупатель оформляет возврат на площадке.","4.2 Система создаёт резерв места под возврат в состоянии PENDING_RETURN.","4.3 Возврат принят на складе → резерв переходит в COMPLETED, остаток увеличивается.","4.4 Возврат отклонён складом (брак не подтверждён) → резерв переходит в CANCELLED, остаток не меняется.","","Раздел про отмену возврата покупателем в документе отсутствует.","В содержании между 4.4 и 5.1 разрыв нумерации: пункт 4.5 упомянут в оглавлении, но его текста нет."]},"a_bpmn":{"title":"Схема процесса «Возврат от покупателя»","tag":"схема","sets_flags":["f_bpmn"],"ascii":["  ○ покупатель оформил возврат","  │","  ▼","┌──────────────────────┐","│ создать резерв места │  → состояние PENDING_RETURN","└──────────┬───────────┘","           ▼","        ◇ решение склада ◇","     ┌─────────┼──────────┬───────────────┐","     │         │          │               │","  принят   отклонён   покупатель      (истёк срок)","     │         │       отменил           │","     ▼         ▼          │               ▼","  COMPLETED  CANCELLED    ?          обработчика нет","     │         │          │","     ▼         ▼          ▼","     ●         ●      обработчика нет","","Две ветки из четырёх никуда не ведут: у них нет ни задачи, ни конечного события."]},"a_states":{"title":"Диаграмма состояний резерва","tag":"схема","sets_flags":["f_states"],"ascii":["         ┌───────────────────┐","  ──────▶│  PENDING_RETURN   │","         └───┬───────────┬───┘","             │           │","     принят  │           │  отклонён","             ▼           ▼","      ┌────────────┐  ┌────────────┐","      │ COMPLETED  │  │ CANCELLED  │","      └────────────┘  └────────────┘","","  AVAILABLE (доступный остаток) ◀── ??? ","","Переходов ИЗ PENDING_RETURN всего два. Ни один не возвращает единицы","в доступный остаток при отмене возврата покупателем."]},"a_corrections":{"title":"Журнал ручных корректировок","tag":"данные","sets_flags":["f_corrections"],"ascii":["РУЧНЫЕ КОРРЕКТИРОВКИ ОСТАТКОВ · SKU-4417","-----------------------------------------------------------","26.07 09:41   +12   m.rashidov   комментарий: «пересчёт»","28.07 10:03   +20   m.rashidov   комментарий: «пересчёт»","29.07 09:15   +34   m.rashidov   комментарий: «пересчёт»","-----------------------------------------------------------","Права на корректировку: старший кладовщик (штатная роль).","После 29.07 корректировок нет: Марат ушёл в отпуск 30.07."],"note":"Выглядит как заметание следов. На самом деле — попытка свести остаток руками."},"a_gateway":{"title":"Логи интеграционного шлюза","tag":"логи","sets_flags":["f_gateway"],"ascii":["ШЛЮЗ МАРКЕТПЛЕЙСА · сводка за период","-----------------------------------------------------------","сообщений принято:      4 812","доставлено в «Складень»: 4 812","ошибок доставки:            0","повторных отправок:         0","-----------------------------------------------------------","Расхождений нет. Все события отмены возврата (127 штук)","приняты системой и подтверждены кодом 200."],"note":"Тупик: шлюз работает идеально. Отмены доходят — их просто некому обрабатывать."},"a_usecase":{"title":"Use Case «Отмена возврата покупателем»","tag":"требования","text":["UC-19 «Отмена возврата покупателем» (черновик, не утверждён)","","Предусловие: возврат создан, резерв в состоянии PENDING_RETURN.","Основной сценарий:","  1. Покупатель отменяет возврат на площадке.","  2. Площадка передаёт событие отмены.","  3. Система принимает событие.","Постусловие: единицы товара возвращены в доступный остаток, резерв закрыт.","","Шага, который выполняет постусловие, в сценарии нет: между приёмом события и постусловием пусто."]}},"nodes":{"start":{"type":"message","text":["🗂 <b>ЦИФРОВОЙ СТРАЖ</b> · служебное расследование","Дело №1. Двести единиц в никуда","","Склад сети «Полка+». Инвентаризация показала недостачу: 200 термокружек, 284 000 ₽.","Отгрузок не было. Камеры чисты. Товар не выносили — он <i>испарился внутри системы</i>.","","Ваша ясность: 12/12. Каждая поспешная версия её тратит.","Если упадёт до нуля — дело заберут."],"buttons":[{"label":"📄 Прочитать записку","goto":"read_note"},{"label":"🧭 Сразу в штаб","goto":"hub"}]},"read_note":{"type":"artifact","artifact":"a_note","buttons":[{"label":"В штаб расследования","goto":"hub"}]},"hub":{"type":"hub","header":"🧭 ШТАБ · ясность {clarity}/12 · изучено артефактов: {artifacts_count}/8","text":["С чего продолжим?"],"buttons":[{"label":"📊 Данные и логи","goto":"menu_data"},{"label":"🗣 Опросить людей","goto":"menu_people"},{"label":"📐 Документы и схемы","goto":"menu_docs"},{"label":"🧪 Версии","goto":"hypotheses"},{"label":"🧠 Сеня, подскажи (−1)","goto":"senya_hint"},{"label":"📝 Заключение","goto":"report_guard"}]},"menu_data":{"type":"menu","text":["Что смотрим?"],"buttons":[{"label":"Выгрузка движений по SKU","goto":"art_movements"},{"label":"Журнал планировщика","goto":"art_scheduler"},{"label":"Журнал ручных корректировок","goto":"art_corrections"},{"label":"Логи интеграционного шлюза","goto":"art_gateway"},{"label":"← Назад","goto":"hub"}]},"menu_docs":{"type":"menu","text":["Документы по системе «Складень»:"],"buttons":[{"label":"ТЗ на интеграцию 3.4","goto":"art_ts"},{"label":"Схема процесса «Возврат от покупателя»","goto":"art_bpmn"},{"label":"Диаграмма состояний резерва","goto":"art_states"},{"label":"Регламент stock_cleanup (2019)","goto":"art_regulation"},{"label":"← Назад","goto":"hub"}]},"menu_people":{"type":"menu","text":["Кого вызываем?"],"buttons":[{"label":"Тимур, разработчик","goto":"int_dev"},{"label":"Евгений, владелец продукта","goto":"int_pm"},{"label":"Ольга, тестировщик","goto":"int_qa"},{"label":"Марат, кладовщик","goto":"int_marat"},{"label":"← Назад","goto":"hub"}]},"art_movements":{"type":"artifact","artifact":"a_movements","text_after":["Сеня: «Обратите внимание на две вещи: инициатор списаний — <i>system</i>, а не человек. И время. Оно подозрительно одинаковое»."],"buttons":[{"label":"🔍 Разобрать время списаний","goto":"mini_time"},{"label":"← В штаб","goto":"hub"}]},"mini_time":{"type":"input","kind":"text","text":["<b>Мини-задача: сопоставление таблиц</b>","","Все операции WRITE_OFF выполнены в одно и то же время суток.","Введите это время в формате ЧЧ:ММ."],"accept":["03:10","3:10","0310"],"on_correct":{"sets_flags":["k_night"],"clarity":1,"text":["✅ 03:10. Ровно, до минуты, десять дней подряд.","","Сеня: «Человек не умеет опаздывать на ноль секунд десять раз подряд. Так работает расписание. Ищите того, кто просыпается в 03:10»."],"goto":"hub"},"on_wrong":{"clarity":-1,"attempts":2,"text":["Не сходится. Посмотрите на колонку «время» у строк WRITE_OFF ещё раз."],"goto":"art_movements"}},"art_scheduler":{"type":"artifact","artifact":"a_scheduler","requires_hint":{"if_missing":"k_night","text":["Сеня: «Полезно, но пока непонятно, что тут искать. Сначала выясните, во сколько происходят списания»."]},"on_enter_if":{"flag":"k_night","sets_flags":["k_job"],"clarity":1,"text":["✅ 03:10 — это <code>stock_cleanup</code>. Задание работает без изменений с ноября 2019 года.","","Сеня: «Задание старше интеграции на шесть лет. Оно не знает, что мир изменился. Это очень частая история: новый функционал приезжает в систему, где уже живут старые правила, и они не здороваются»."]},"buttons":[{"label":"← В штаб","goto":"hub"}]},"art_regulation":{"type":"artifact","artifact":"a_regulation","text_after":["Сеня: «Читайте формулировку буквально, как её прочитает машина: <b>любое состояние, кроме COMPLETED и CANCELLED</b>. Не список конкретных статусов, а „всё остальное“. В 2019 году „всего остального“ не существовало»."],"buttons":[{"label":"Посмотреть диаграмму состояний","goto":"art_states"},{"label":"← В штаб","goto":"hub"}]},"art_states":{"type":"artifact","artifact":"a_states","buttons":[{"label":"🔍 Найти недостающий переход","goto":"mini_state"},{"label":"← В штаб","goto":"hub"}]},"mini_state":{"type":"choice","text":["<b>Мини-задача: дыра в диаграмме состояний</b>","","Какого перехода не хватает, чтобы отменённый покупателем возврат не превращался в тыкву?"],"buttons":[{"label":"PENDING_RETURN → AVAILABLE","correct":true,"sets_flags":["k_hole"],"clarity":1,"feedback":["✅ Именно. Покупатель отменил возврат — единицы обязаны вернуться в доступный остаток. Такого перехода в системе нет.","","Сеня: «Диаграмма состояний — это не украшение в документе. Каждое состояние обязано иметь выход. Состояние без выхода — это ловушка, в которой рано или поздно кто-нибудь окажется. У нас там оказались двести кружек»."],"goto":"hub"},{"label":"COMPLETED → AVAILABLE","clarity":-1,"feedback":["Нет. COMPLETED и так увеличивает остаток — это описано в пункте 4.3 ТЗ."],"goto":"art_states"},{"label":"PENDING_RETURN → WRITE_OFF","clarity":-1,"feedback":["Такой переход как раз есть — его делает stock_cleanup. Проблема ровно в том, что он единственный оставшийся."],"goto":"art_states"},{"label":"CANCELLED → PENDING_RETURN","clarity":-1,"feedback":["Возврат к отменённому состоянию тут ничего не решает."],"goto":"art_states"}]},"art_ts":{"type":"artifact","artifact":"a_ts","sets_flags":["k_gap"],"text_after":["Сеня: «Пункт 4.5 есть в оглавлении и отсутствует в тексте. Кто-то планировал его написать. Отвлёкся»."],"buttons":[{"label":"🔍 Разобрать Use Case отмены","goto":"mini_usecase"},{"label":"← В штаб","goto":"hub"}]},"mini_usecase":{"type":"choice","artifact":"a_usecase","text":["<b>Мини-задача: противоречие в Use Case</b>","","Что не так с этим сценарием?"],"buttons":[{"label":"Постусловие не достигается ни одним шагом сценария","correct":true,"clarity":1,"feedback":["✅ Сценарий обрывается на «система приняла событие». Дальше — обещанное постусловие, которого никто не выполняет.","","Сеня: «Проверять сценарий надо с конца: возьмите постусловие и спросите — какой конкретно шаг его выполняет? Если ответа нет, перед вами не требование, а пожелание»."],"goto":"hub"},{"label":"Не указан актор","clarity":-1,"feedback":["Актор понятен из названия и первого шага. Смотрите на связь шагов с постусловием."],"goto":"mini_usecase"},{"label":"Отсутствует альтернативный сценарий","clarity":-1,"feedback":["Альтернативы тут вторичны: сломан сам основной путь."],"goto":"mini_usecase"}]},"art_bpmn":{"type":"artifact","artifact":"a_bpmn","buttons":[{"label":"🔍 Указать, где теряются данные","goto":"mini_bpmn"},{"label":"← В штаб","goto":"hub"}]},"mini_bpmn":{"type":"choice","text":["<b>Мини-задача: чтение схемы процесса</b>","","Из шлюза приходит 127 событий «покупатель отменил возврат». Куда они попадают на этой схеме?"],"buttons":[{"label":"Ветка есть, но за ней нет ни задачи, ни конечного события","correct":true,"sets_flags":["f_bpmn_gap"],"clarity":1,"feedback":["✅ Событие принимается и растворяется. Резерв остаётся в PENDING_RETURN и ждёт четырнадцать дней до встречи с ночным заданием.","","Сеня: «На схеме процесса каждый путь из развилки обязан заканчиваться конечным событием. Оборванная ветка на схеме означает в жизни ровно одно: данные уходят в тишину»."],"goto":"hub"},{"label":"Они попадают в ветку «отклонён»","clarity":-1,"feedback":["Нет. «Отклонён» — решение склада, а не покупателя. Это разные развилки."],"goto":"art_bpmn"},{"label":"Схема отрабатывает их корректно","clarity":-1,"feedback":["Посчитайте выходы из развилки: их четыре, а конечных событий — два."],"goto":"art_bpmn"}]},"art_corrections":{"type":"artifact","artifact":"a_corrections","text_after":["Три ручные корректировки. Все — от старшего кладовщика Марата Рашидова. Все с комментарием «пересчёт».","","Сеня: «Выглядит скверно. Но обратите внимание: корректировки идут <i>после</i> списаний, а не до. Он не создавал недостачу — он её закрывал»."],"buttons":[{"label":"🗣 Вызвать Марата","goto":"int_marat"},{"label":"← В штаб","goto":"hub"}]},"art_gateway":{"type":"artifact","artifact":"a_gateway","text_after":["Сеня: «Шлюз чист. 127 отмен доставлены и подтверждены. Версия про потерю сообщений закрыта — и это тоже результат: минус одна гипотеза»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"int_dev":{"type":"dialogue","speaker":"timur","sets_flags":["f_dev"],"lines":["<b>Тимур, разработчик модуля резервов</b>","","— Я сделал ровно то, что написано в ТЗ. Два перехода: принят и отклонён. Оба работают, тесты зелёные.","— Отмена возврата? В требованиях её не было. Я не придумываю поведение за аналитика, я один раз попробовал — потом полгода объяснялся."],"buttons":[{"label":"«Куда девается резерв, если возврат отменили?»","goto":"int_dev_2"},{"label":"← Назад","goto":"menu_people"}]},"int_dev_2":{"type":"dialogue","speaker":"timur","lines":["— Никуда. Висит в PENDING_RETURN.","— Слушайте, а он же там не вечно висит… У нас ночью что-то чистит старые резервы. Я в тот код не лазил, он древний, там комментарии на транслите.","","Сеня: «Вот это уже интересно. Он сам не знает, что происходит с его данными через две недели»."],"buttons":[{"label":"Посмотреть журнал планировщика","goto":"art_scheduler"},{"label":"← В штаб","goto":"hub"}]},"int_pm":{"type":"dialogue","speaker":"zhenya","sets_flags":["f_pm"],"lines":["<b>Евгений, владелец продукта</b>","","— Ребята, у нас была акция. Возвраты нужно было запустить за три недели.","— Отмену возврата? Ну это же редкий случай. Один на сотню.","","Сеня: «Сто двадцать семь случаев за месяц. Редкий — это не значит невозможный. Это значит, что о нём забудут при проектировании»."],"buttons":[{"label":"«Кто решил не описывать этот сценарий?»","goto":"int_pm_2"},{"label":"← Назад","goto":"menu_people"}]},"int_pm_2":{"type":"dialogue","speaker":"zhenya","lines":["— Никто не решал. Мы его просто… не обсуждали. В ТЗ пункт был запланирован, я помню номер — 4.5. Видимо, не дописали.","— И да, мы не смотрели, как новый статус ляжет на существующие ночные задания. А что, надо было?"],"buttons":[{"label":"Открыть ТЗ 3.4","goto":"art_ts"},{"label":"← В штаб","goto":"hub"}]},"int_qa":{"type":"dialogue","speaker":"olya","sets_flags":["f_qa"],"lines":["<b>Ольга, тестировщик</b>","","— Я проверила оба сценария из ТЗ: приняли — остаток вырос, отклонили — остаток не изменился. Обе проверки прошли.","— Отмену я не проверяла. Её нет в требованиях, а я не выдумываю сценарии из головы.","— И ещё: тесты идут на стенде, где ночные задания отключены. Чтобы не мешали."],"buttons":[{"label":"«Что было бы, если бы задания включили?»","goto":"int_qa_2"},{"label":"← Назад","goto":"menu_people"}]},"int_qa_2":{"type":"dialogue","speaker":"olya","clarity":1,"lines":["— Тогда через две недели после теста половина моих резервов превратилась бы в списания. Наверное, я бы это заметила. Но кто держит стенд две недели?","","Сеня: «Дефект был невидим для тестирования по трём причинам сразу: сценария нет в требованиях, ночные задания на стенде выключены, а проявляется всё через четырнадцать дней. Идеальное преступление»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"int_marat":{"type":"dialogue","speaker":"marat","sets_flags":["f_marat_lie"],"lines":["<b>Марат, старший кладовщик</b>","","— Я ничего не списывал. У меня и прав таких нет — списания делает система.","— Корректировки? Ну да, пересчитывал. Так это моя работа, я старший кладовщик."],"buttons":[{"label":"Предъявить журнал корректировок","goto":"int_marat_press","requires":["f_corrections"]},{"label":"Обвинить в саботаже","goto":"dead_sabotage"},{"label":"← Назад","goto":"menu_people"}]},"int_marat_press":{"type":"dialogue","speaker":"marat","sets_flags":["f_marat_confess"],"lines":["— …Ладно.","— Я приходил утром, а остаток не сходился. Каждый раз минус. Я думал, это я ошибся при приёмке — ну и подгонял, чтобы сошлось.","— Потом ушёл в отпуск, подгонять стало некому, и всё вылезло на инвентаризации.","— Я не воровал. Я боялся, что скажут — это я потерял.","","Сеня: «Классика: человек видит симптом каждый день и лечит его вручную, потому что уверен, что виноват сам. Так дефекты живут годами»."],"buttons":[{"label":"«Почему остаток не сходился?» → метод «5 почему»","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"why_1":{"type":"choice","text":["<b>Метод «5 почему», шаг 1 из 5</b>","","Сеня: «Спрашиваем „почему“ до тех пор, пока ответ не перестанет быть техническим».","","❓ Почему на складе недостача 200 единиц?"],"buttons":[{"label":"Потому что система списала их операцией WRITE_OFF","correct":true,"goto":"why_2"},{"label":"Потому что кладовщик неверно считал","clarity":-1,"feedback":["Корректировки шли после списаний. Он подгонял результат, а не создавал его."],"goto":"why_1"},{"label":"Потому что товар украли","clarity":-1,"feedback":["Физически товар со склада не выносили — это установлено сразу."],"goto":"why_1"}]},"why_2":{"type":"choice","text":["<b>«5 почему», шаг 2 из 5</b>","","❓ Почему система их списала?"],"buttons":[{"label":"Задание stock_cleanup списывает резервы старше 14 дней","correct":true,"goto":"why_3"},{"label":"Разработчик ошибся в коде модуля резервов","clarity":-1,"feedback":["Код делает ровно то, что описано в регламенте 2019 года. Ошибки в реализации нет."],"goto":"why_2"}]},"why_3":{"type":"choice","text":["<b>«5 почему», шаг 3 из 5</b>","","❓ Почему резервы висели дольше 14 дней?"],"buttons":[{"label":"Отменённые возвраты оставались в PENDING_RETURN — выхода из состояния нет","correct":true,"goto":"why_4"},{"label":"Маркетплейс не присылал события отмены","clarity":-1,"feedback":["Присылал: 127 событий, все доставлены и подтверждены."],"goto":"why_3"}]},"why_4":{"type":"choice","text":["<b>«5 почему», шаг 4 из 5</b>","","❓ Почему у состояния нет выхода?"],"buttons":[{"label":"Сценарий отмены возврата не описан в требованиях","correct":true,"goto":"why_5"},{"label":"Тестировщик не нашёл дефект","clarity":-1,"feedback":["Тестировать нечего: сценария нет в требованиях. Это следствие, а не причина."],"goto":"why_4"}]},"why_5":{"type":"choice","text":["<b>«5 почему», шаг 5 из 5 — последний</b>","","❓ Почему сценарий не описали, и почему никто этого не заметил?"],"buttons":[{"label":"Изменение вводили без анализа влияния на существующие фоновые процессы","correct":true,"sets_flags":["k_chain"],"clarity":2,"feedback":["✅ Дошли до дна.","","Новый статус ввели в систему, где с 2019 года живёт правило «всё, что не COMPLETED и не CANCELLED, — списываем». Никто не свёл новое со старым.","","Сеня: «Вот теперь ответ перестал быть техническим. Дефект не в коде и не в человеке — в процессе управления изменениями. Такой ответ можно нести руководству»."],"goto":"hub"},{"label":"Продакт торопился к акции","clarity":-1,"feedback":["Спешка — обстоятельство. Она объясняет, почему не написали, но не почему никто не проверил влияние. Копайте глубже."],"goto":"why_5"},{"label":"Аналитик забыл дописать пункт 4.5","clarity":-1,"feedback":["Это то же самое, только другими словами. Спросите: а что в процессе должно было поймать такую забывчивость?"],"goto":"why_5"}]},"hypotheses":{"type":"choice","text":["🧪 <b>ВЕРСИИ</b>","","Сеня: «Версию проверяют, а не защищают. Выберите ту, которую готовы уронить»."],"buttons":[{"label":"А. Сбой интеграционного шлюза","goto":"dead_gateway"},{"label":"Б. Пересорт и ошибка округления","goto":"dead_rounding"},{"label":"В. Саботаж кладовщика","goto":"dead_sabotage"},{"label":"Г. Дефект процесса: новый статус + старое ночное задание","goto":"hypo_right"},{"label":"← В штаб","goto":"hub"}]},"hypo_right":{"type":"message","clarity":1,"condition":{"if_flags_missing":["k_job","k_hole"],"text":["Сеня: «Направление верное, но подтверждать пока нечем. Найдите, кто именно списывает, и покажите дыру в состояниях. Иначе это не версия, а интуиция»."],"goto":"hub"},"text":["✅ Версия подтверждается сразу тремя источниками: время списаний, регламент задания и диаграмма состояний.","","Сеня: «Теперь у вас не догадка, а конструкция: причина, механизм, следы. Можно идти к заключению»."],"buttons":[{"label":"📝 К заключению","goto":"report_guard"},{"label":"← В штаб","goto":"hub"}]},"dead_gateway":{"type":"dead_end","clarity":-2,"text":["🚫 <b>Тупик.</b>","","Вы поднимаете команду интеграции ночью. Три часа разбора логов. Результат: 4 812 сообщений принято, 4 812 доставлено, ноль ошибок.","События отмены доходят до системы исправно — их просто некому обработать.","","Сеня: «Шлюз не виноват. Но вы закрыли версию — это тоже работа. Только дорогая: минус два к ясности»."],"buttons":[{"label":"Применить «5 почему» и вернуться","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"dead_rounding":{"type":"dead_end","clarity":-2,"text":["🚫 <b>Тупик.</b>","","Вы пересчитываете все частичные возвраты за период. Арифметика сходится до единицы: 12 + 20 + 34 + 41 + 28 = 135, остальные 65 — из более раннего периода. Ни одной дробной кружки.","","Сеня: «Округление тут ни при чём. Числа ровные, они не „потерялись“ — их <i>списали</i>. Ищите не арифметику, а операцию»."],"buttons":[{"label":"Применить «5 почему» и вернуться","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"dead_sabotage":{"type":"dead_end","clarity":-2,"text":["🚫 <b>Тупик.</b>","","Вы обвиняете Марата. Служба безопасности изымает пропуск, склад встаёт на полдня, кладовщик пишет объяснительную и заявление об уходе.","","А ночью 8 августа система списывает ещё 19 единиц. Марат в это время сидит дома.","","Сеня: «Проверка простая: если убрать подозреваемого, дефект должен исчезнуть. Он не исчез. Значит, вы обвинили свидетеля»."],"buttons":[{"label":"Применить «5 почему» и вернуться","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"senya_hint":{"type":"hint","clarity":-1,"logic":"Выдать первую подходящую подсказку по цепочке флагов","rules":[{"if_missing":"f_movements","text":"Сеня: «Вы ещё не смотрели, что именно произошло с товаром. Начните с выгрузки движений: там видно операцию и того, кто её выполнил»."},{"if_missing":"k_night","text":"Сеня: «Посмотрите на время списаний. Если оно одинаковое до минуты — это расписание, а не человек»."},{"if_missing":"k_job","text":"Сеня: «Кто у нас просыпается в 03:10? Загляните в журнал планировщика»."},{"if_missing":"f_regulation","text":"Сеня: «Задание старше интеграции на шесть лет. Прочитайте его регламент буквально — особенно фразу про „любое состояние, кроме…“»."},{"if_missing":"k_hole","text":"Сеня: «А что, если проблема не в коде, а в том, что состояние не имеет выхода? Откройте диаграмму состояний резерва»."},{"if_missing":"k_gap","text":"Сеня: «Проверьте требования на интеграцию. Меня смущает разрыв нумерации в оглавлении»."},{"if_missing":"k_chain","text":"Сеня: «У вас есть механизм, но нет причины. Прогоните цепочку „5 почему“ — от недостачи до процесса»."},{"default":"Сеня: «Всё существенное вы уже нашли. Идите в заключение и формулируйте: причина, компонент, рекомендация»."}]},"report_guard":{"type":"gate","condition":{"required_flags":["k_job","k_hole","k_chain"],"on_fail":{"clarity":-3,"text":["⚠️ Вы выходите к руководству с незаконченной картиной.","","Первый же вопрос: «А кто конкретно списал товар и почему он не вернулся в остаток?» Ответа нет.","","Сеня: «Ясность −3. Заключение без механизма — это пересказ жалобы. Вернитесь и достройте цепочку»."],"goto":"hub"}},"goto":"report_cause"},"report_cause":{"type":"choice","text":["📝 <b>АНАЛИТИЧЕСКОЕ ЗАКЛЮ "hub"}]},"art_rules":{"type":"artifact","artifact":"b_rules","text_after":["Сеня: «Вот и ответ. „Всё“ — это фамилия, имя, отчество и дата рождения. Паспорт с ИНН в сравнении не участвуют вообще, вес ноль».","","«И отдельно посмотрите на <code>empty_field_policy = skip</code>. Пустое поле просто выбрасывается из сравнения, будто его и не спрашивали»."],"buttons":[{"label":"🔍 Разобрать политику пустых полей","goto":"mini_empty"},{"label":"🔍 Собрать правильный ключ","goto":"mini_key"},{"label":"← В штаб","goto":"hub"}]},"mini_empty":{"type":"choice","text":["<b>Мини-задача: пустое поле при сравнении</b>","","У одной записи паспорт есть, у второй пусто (импорт из старой системы). Как система должна поступить?"],"buttons":[{"label":"Не считать это совпадением: снизить оценку и отправить пару человеку","correct":true,"clarity":1,"feedback":["✅ Именно. Отсутствие данных — это отсутствие данных, а не подтверждение сходства.","","Сеня: «Текущая настройка делает обратное: чем хуже заполнена запись, тем легче ей с кем-нибудь слиться. Записи-призраки склеиваются охотнее всех»."],"goto":"hub"},{"label":"Исключить поле из сравнения — как сейчас","clarity":-1,"feedback":["Так и настроено, и именно это привело к 38 ошибочным слияниям. Пустота начинает работать как согласие."],"goto":"mini_empty"},{"label":"Считать пустое поле совпадением","clarity":-1,"feedback":["Ещё хуже: тогда склеится вообще всё, что тёзки."],"goto":"mini_empty"},{"label":"Отклонять пару целиком","clarity":-1,"feedback":["Слишком грубо: тогда две трети базы никогда не сойдутся, и настоящие дубли останутся. Нужна середина."],"goto":"mini_empty"}]},"mini_key":{"type":"choice","text":["<b>Мини-задача: ключ сопоставления</b>","","Сеня: «Ключ сопоставления — это набор полей, по которым мы решаем, что перед нами один и тот же человек. Выберите тот, что не склеит однофамильцев».","","Что должно определять человека?"],"buttons":[{"label":"Документ (паспорт или ИНН) — как основание; ФИО и дата рождения — только как подтверждение","correct":true,"clarity":1,"feedback":["✅ Да. Документ выдаётся государством и уникален, имя — нет.","","Сеня: «В таких системах различают детерминированное сопоставление — по точному ключу вроде паспорта, и вероятностное — по совокупности признаков с оценкой. Здесь вероятностное поставили работать без человека, да ещё и без документа в наборе признаков»."],"goto":"hub"},{"label":"ФИО + дата рождения — как сейчас","clarity":-1,"feedback":["В базе 806 таких пар. Это не ключ, это категория людей."],"goto":"mini_key"},{"label":"ФИО + дата рождения + город","clarity":-1,"feedback":["Лучше, но город меняется при переезде, а тёзки в одном городе не редкость. Нужен признак, который не меняется и не повторяется."],"goto":"mini_key"},{"label":"Телефон","clarity":-1,"feedback":["Номера переходят к другим владельцам, а один человек может иметь три. Как основание не годится."],"goto":"mini_key"}]},"art_merge_log":{"type":"artifact","artifact":"b_merge_log","text_after":["812 слияний. Человеку не ушло ни одного случая.","","Сеня: «Порог 0.80 существует, но он бессмысленный: почти все пары получают ровно 1.00, потому что сравнивается только то, что и так совпало. Порог, который никогда не срабатывает, — это украшение конфигурации»."],"buttons":[{"label":"🔍 Оценить цену ошибки","goto":"mini_cost"},{"label":"← В штаб","goto":"hub"}]},"mini_cost":{"type":"choice","text":["<b>Мини-задача: цена ошибки</b>","","У дедупликации две возможные ошибки. Какая дороже и почему?"],"buttons":[{"label":"Ошибочное слияние: его почти невозможно откатить — данные двух людей уже перемешаны","correct":true,"sets_flags":["k_cost"],"clarity":2,"feedback":["✅ Ключевая мысль всего дела.","","Из 38 подтверждённых ошибок разделить удалось девять. В остальных случаях невозможно установить, чей убыток чей: система не хранила, откуда что пришло.","","Сеня: «Ошибки здесь несимметричны. Не склеили дубли — база чуть грязнее, чинится за минуту. Склеили разных людей — человеку испортили страховую историю, и обратной дороги нет. Когда цены ошибок разные, система обязана ошибаться в сторону дешёвой»."],"goto":"hub"},{"label":"Пропущенный дубль: в базе остаётся мусор","clarity":-1,"feedback":["Неприятно, но безобидно: дубль можно объединить в любой момент. Подумайте, какую из ошибок нельзя отменить."],"goto":"mini_cost"},{"label":"Обе одинаково","clarity":-1,"feedback":["Посмотрите статистику обращений: девять успешных разделений из тридцати восьми. Одинаковыми они точно не выглядят."],"goto":"mini_cost"}]},"art_ts":{"type":"artifact","artifact":"b_ts","text_after":["Сеня: «„Совпадение основных полей“. Скажите вслух и прислушайтесь: какие поля основные? Кто это решает? Разработчик решил. Он вообще-то не обязан был»."],"buttons":[{"label":"🔍 Разобрать формулировку","goto":"mini_wording"},{"label":"← В штаб","goto":"hub"}]},"mini_wording":{"type":"choice","text":["<b>Мини-задача: ревью требования</b>","","«3.2 Записи считаются дублями при совпадении основных полей клиента».","Главный дефект этой формулировки — какой?"],"buttons":[{"label":"Она не проверяема: нельзя однозначно сказать, выполнено требование или нет","correct":true,"clarity":1,"feedback":["✅ Требование, которое нельзя проверить, нельзя и реализовать — его можно только угадать.","","Сеня: «Простой тест: может ли тестировщик написать по этой фразе проверку с однозначным результатом? Если для этого сначала надо кого-то спросить — перед вами не требование, а тема для обсуждения»."],"goto":"hub"},{"label":"Она слишком короткая","clarity":-1,"feedback":["Длина ни при чём. Короткое требование может быть прекрасным, если оно однозначно."],"goto":"mini_wording"},{"label":"В ней нет ссылки на нормативные документы","clarity":-1,"feedback":["Не в этом дело. Проблема в том, что два человека прочитают её по-разному — и оба будут правы."],"goto":"mini_wording"}]},"art_er":{"type":"artifact","artifact":"b_er","text_after":["Сеня: «Обратите внимание на две дыры. Первая: естественного ключа нет — модель не знает, чем один человек отличается от другого. Вторая: истории слияний нет, исходные записи затираются».","","«Вторая дыра и есть причина, по которой 29 обращений из 38 не удалось разобрать»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"art_stats":{"type":"artifact","artifact":"b_stats","buttons":[{"label":"🗣 Поговорить с поддержкой","goto":"int_support"},{"label":"← В штаб","goto":"hub"}]},"art_ops":{"type":"artifact","artifact":"b_ops","text_after":["Шесть ручных объединений, все по паспорту, ни одной жалобы.","","Сеня: «Оператор без всякого ТЗ додумалась сравнивать документы. Модуль, написанный по утверждённым требованиям, — нет»."],"buttons":[{"label":"🗣 Вызвать оператора","goto":"int_operator"},{"label":"← В штаб","goto":"hub"}]},"art_import":{"type":"artifact","artifact":"b_import","text_after":["Сеня: «Импорт чистый. Но посмотрите на заполненность: паспорт есть лишь у двух третей записей. Модуль сравнения в таких случаях просто выкидывает поле — и остаётся с одними именами»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"int_dev":{"type":"dialogue","speaker":"artem","sets_flags":["f_dev"],"lines":["<b>Артём, разработчик модуля «Единый клиент»</b>","","— В требовании написано «основные поля». Основные — это ФИО и дата рождения, так везде.","— Паспорт я сначала добавил. Потом увидел, что он заполнен у двух третей базы, и на тесте почти ничего не склеивалось. Заказчик хотел видеть, что модуль работает."],"buttons":[{"label":"«Кто утверждал список полей?»","goto":"int_dev_2"},{"label":"← Назад","goto":"menu_people"}]},"int_dev_2":{"type":"dialogue","speaker":"artem","lines":["— Никто. Я спросил в чате, мне ответили «ну да, логично» — и всё.","— Порог 0.80 я взял из статьи. Он ни на что не влияет, у нас почти всегда единица выходит.","","Сеня: «Ключевое решение всей системы принято в переписке фразой „ну да, логично“. Оно нигде не зафиксировано, и спросить теперь не с кого»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"int_analyst":{"type":"dialogue","speaker":"lera","sets_flags":["f_analyst"],"lines":["<b>Валерия, автор требований</b>","","— Я, конечно, имела в виду паспорт. Это же очевидно: человек — это документ.","— Почему не написала? Ну… это базовая вещь, все взрослые люди.","","Сеня: «Слово „очевидно“ в нашей работе означает ровно одно: сейчас двое понимают фразу по-разному и оба уверены, что правы»."],"buttons":[{"label":"«А что должно происходить со спорными парами?»","goto":"int_analyst_2"},{"label":"← Назад","goto":"menu_people"}]},"int_analyst_2":{"type":"dialogue","speaker":"lera","clarity":1,"lines":["— Спорными? Я думала, спорных не будет. Совпало — значит дубль.","— Про откат тоже не думала. А что, слияние нельзя отменить?..","","Сеня: «Вот теперь видно всю дыру целиком: не задан ключ, не задан порог, нет разбора спорных случаев, нет отката. Четыре пропуска в трёх предложениях — своего рода рекорд»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"int_operator":{"type":"dialogue","speaker":"nastya","sets_flags":["f_operator"],"lines":["<b>Анастасия, оператор поддержки</b>","","— Да, я объединяла карточки руками. Шесть штук. Только если паспорт совпадает — иначе как я пойму, что это один человек?","— Карточку Волкова я не трогала, там уже всё было слито до меня.","— Я, кстати, писала в поддержку разработки в мае: «система клеит однофамильцев». Мне ответили, что так и задумано."],"buttons":[{"label":"Обвинить оператора","goto":"dead_operator"},{"label":"← Назад","goto":"menu_people"}]},"int_support":{"type":"dialogue","speaker":"ignat","sets_flags":["f_support"],"lines":["<b>Игнат, руководитель поддержки</b>","","— Сорок три обращения «это не мои данные». Тридцать восемь подтвердились.","— Разделить смогли девять. В остальных случаях мы просто не знаем, чей договор чей: после слияния всё лежит в одной куче.","— Люди приходят в офис с паспортом и доказывают, что они — это они. Знаете, как это выглядит со стороны?"],"buttons":[{"label":"«Почему нельзя откатить слияние?»","goto":"int_support_2"},{"label":"← Назад","goto":"menu_people"}]},"int_support_2":{"type":"dialogue","speaker":"ignat","lines":["— Потому что откатывать нечего. Исходные записи не сохраняются, остаётся результат.","— Разработка говорит: восстановить можно только из резервной копии, а там уже три месяца новых договоров сверху.","","Сеня: «Необратимая операция без истории — это то, что в требованиях описывают в последнюю очередь и жалеют в первую»."],"buttons":[{"label":"← В штаб","goto":"hub"}]},"hypotheses":{"type":"choice","text":["🧪 <b>ВЕРСИИ</b>","","Сеня: «Выдвигайте ту, которую готовы проверить. Не ту, которая нравится»."],"buttons":[{"label":"А. Клиент скрывает свои убытки","goto":"dead_fraud"},{"label":"Б. Виноват импорт из старой системы","goto":"dead_import"},{"label":"В. Оператор объединила карточки по ошибке","goto":"dead_operator"},{"label":"Г. Правило дедупликации не задано формально — модуль склеил разных людей","goto":"hypo_right"},{"label":"← В штаб","goto":"hub"}]},"hypo_right":{"type":"message","clarity":1,"condition":{"if_flags_missing":["k_key","k_cost"],"text":["Сеня: «Направление верное, но нечем подкрепить. Посмотрите, по каким полям идёт сравнение, и оцените, во что обходится ошибочное слияние. Без этого версия не защищается»."],"goto":"hub"},"text":["✅ Версия держится: конфигурация показывает ключ, журнал — автоматику без человека, статистика — необратимость.","","Сеня: «Три опоры. Можно писать заключение»."],"buttons":[{"label":"🧠 Пройти «5 почему»","goto":"why_1"},{"label":"📝 К заключению","goto":"report_guard"}]},"dead_fraud":{"type":"dead_end","clarity":-2,"artifact":"b_alibi","text":["🚫 <b>Тупик.</b>","","Вы запускаете проверку клиента на мошенничество. Служба безопасности поднимает документы — и находит алиби по трём эпизодам из четырёх.","","Заодно выясняется, что второй Волков Сергей Андреевич, 14.03.1985, существует и живёт в Твери. Он тоже клиент «Полис+».","","Сеня: «Версия закрыта дорого: минус два. Но она дала факт — двойник настоящий. Дальше вопрос не „кто врёт“, а „почему система решила, что это один человек“»."],"buttons":[{"label":"Применить «5 почему»","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"dead_import":{"type":"dead_end","clarity":-2,"text":["🚫 <b>Тупик.</b>","","Вы поднимаете команду миграции. Протокол импорта чист: 418 902 записи, ноль ошибок, контрольные суммы сходятся.","","Сеня: «Импорт перенёс то, что было, включая пустые паспорта — их не было и в старой системе. Он не создал дефект. Он создал условия, при которых дефект стало видно. Это разные вещи, и путать их — классика разбора инцидентов»."],"buttons":[{"label":"Применить «5 почему»","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"dead_operator":{"type":"dead_end","clarity":-2,"text":["🚫 <b>Тупик.</b>","","Вы пишете докладную на оператора. Проверка её шести объединений: все сделаны по совпадающему паспорту, жалоб ноль.","","А слияние карточки Волкова выполнено 12 мая процессом <code>dedup_job</code>. Анастасия в этот день была в отпуске.","","Более того: в мае она сама писала разработке, что система клеит однофамильцев. Ответ был «так задумано».","","Сеня: «Вы чуть не наказали единственного человека, который заметил дефект и попытался о нём сообщить»."],"buttons":[{"label":"Применить «5 почему»","goto":"why_1"},{"label":"← В штаб","goto":"hub"}]},"why_1":{"type":"choice","text":["<b>Метод «5 почему», шаг 1 из 5</b>","","❓ Почему клиенту урезали выплату?"],"buttons":[{"label":"Потому что в его карточке четыре чужих убытка","correct":true,"goto":"why_2"},{"label":"Потому что он скрыл свои аварии","clarity":-1,"feedback":["Алиби по трём эпизодам подтверждено билетами."],"goto":"why_1"}]},"why_2":{"type":"choice","text":["<b>«5 почему», шаг 2 из 5</b>","","❓ Почему в карточке чужие убытки?"],"buttons":[{"label":"Его запись автоматически слили с записью однофамильца","correct":true,"goto":"why_3"},{"label":"Оператор ошиблась при объединении","clarity":-1,"feedback":["Слияние выполнил dedup_job, оператор была в отпуске."],"goto":"why_2"}]},"why_3":{"type":"choice","text":["<b>«5 почему», шаг 3 из 5</b>","","❓ Почему модуль счёл их одним человеком?"],"buttons":[{"label":"Сравнение идёт только по ФИО и дате рождения, документы исключены","correct":true,"goto":"why_4"},{"label":"Сбой в алгоритме сравнения","clarity":-1,"feedback":["Алгоритм отработал ровно по конфигурации. Ошибки исполнения нет."],"goto":"why_3"}]},"why_4":{"type":"choice","text":["<b>«5 почему», шаг 4 из 5</b>","","❓ Почему набор полей именно такой?"],"buttons":[{"label":"Требование говорит «основные поля», не определяя их — состав выбрал разработчик","correct":true,"goto":"why_5"},{"label":"Разработчик схалтурил","clarity":-1,"feedback":["Он принял решение, которое не должен был принимать в одиночку. Но принять его кто-то был обязан — вопрос, почему это оказался он."],"goto":"why_4"}]},"why_5":{"type":"choice","text":["<b>«5 почему», шаг 5 из 5</b>","","❓ Почему неопределённое требование дошло до промышленной эксплуатации, да ещё и с необратимой операцией?"],"buttons":[{"label":"Требование не проверили на однозначность и не оценили цену ошибки перед автоматизацией","correct":true,"sets_flags":["k_chain"],"clarity":2,"feedback":["✅ Дно достигнуто.","","Никто не спросил двух вещей: «а как мы поймём, что это дубль» и «что будет, если ошибёмся». Первый вопрос стоил трёх предложений в ТЗ. Второй — тридцати восьми испорченных страховых историй.","","Сеня: «Автоматизировать можно только то решение, которое вы способны сформулировать. Всё остальное автоматика примет за вас — и не спросит»."],"goto":"hub"},{"label":"Заказчик торопил с запуском","clarity":-1,"feedback":["Спешка объясняет, почему не дописали. Не объясняет, почему необратимую операцию отдали роботу без надзора."],"goto":"why_5"},{"label":"Тестирование не поймало дефект","clarity":-1,"feedback":["Дефект не воспроизводится на малой выборке: тёзки-ровесники встречаются на тысячах записей, а не на десятках. Это следствие."],"goto":"why_5"}]},"senya_hint":{"type":"hint","clarity":-1,"rules":[{"if_missing":"f_card","text":"Сеня: «Начните с карточки клиента. Меня смущает, что человек может быть настолько разным»."},{"if_missing":"k_key","text":"Сеня: «Система решила, что совпало всё. Посмотрите конфигурацию сравнения и выясните, что для неё „всё“»."},{"if_missing":"k_empty","text":"Сеня: «Обратите внимание на политику пустых полей. Что происходит, когда паспорта нет у одной из записей?»"},{"if_missing":"k_cost","text":"Сеня: «А что, если проблема не в алгоритме, а в том, что операцию вообще нельзя отменить? Загляните в статистику обращений»."},{"if_missing":"k_undefined","text":"Сеня: «Откройте ТЗ и найдите определение „основных полей“. Спойлер: не найдёте»."},{"if_missing":"k_chain","text":"Сеня: «Механизм ясен, причина — нет. Прогоните „5 почему“»."},{"default":"Сеня: «Материала достаточно. Формулируйте заключение: причина, компонент, рекомендация»."}]},"report_guard":{"type":"gate","condition":{"required_flags":["k_key","k_cost","k_chain"],"on_fail":{"clarity":-3,"text":["⚠️ Вы выходите к дирекции рано.","","Первый вопрос: «Хорошо, а по каким полям система вообще сравнивает людей и почему мы не можем это откатить?» Ответа нет.","","Сеня: «Ясность −3. Возвращайтесь: нужен ключ, нужна цена ошибки, нужна цепочка»."],"goto":"hub"}},"goto":"report_cause"},"report_cause":{"type":"choice","text":["📝 <b>АНАЛИТИЧЕСКОЕ ЗАКЛЮЧЕНИЕ</b> · поле 1 из 3","","<b>Корневая причина:</b>"],"buttons":[{"label":"Правило определения дубля не задано формально: нет перечня полей, порога и разбора спорных пар","correct":true,"score":3,"goto":"report_component"},{"label":"Ошибка в алгоритме сравнения","score":0,"feedback_after":"Алгоритм отработал ровно по конфигурации. Дефекта реализации нет.","goto":"report_component"},{"label":"Неполные данные после импорта","score":1,"feedback_after":"Пустые паспорта — условие, а не причина. При корректном правиле они привели бы к отправке пары человеку, а не к слиянию.","goto":"report_component"},{"label":"Халатность оператора поддержки","score":0,"feedback_after":"Её объединения корректны, а спорное слияние сделал робот.","goto":"report_component"}]},"report_component":{"type":"choice","text":["📝 Поле 2 из 3","","<b>Затронутые компоненты:</b>"],"buttons":[{"label":"Модуль «Единый клиент» и конфигурация правил сравнения","correct":true,"score":3,"goto":"report_reco"},{"label":"Модуль импорта","score":0,"goto":"report_reco"},{"label":"Только конфигурация правил","score":1,"feedback_after":"Не только: модель данных тоже не хранит историю слияний, поэтому откат невозможен.","goto":"report_reco"},{"label":"Модуль урегулирования убытков","score":0,"goto":"report_reco"}]},"report_reco":{"type":"input","kind":"choice_or_text","text":["📝 Поле 3 из 3","","<b>Рекомендация.</b> Выберите вариант или впишите свой."],"buttons":[{"label":"Задать ключ по документу, спорные пары — человеку, хранить историю слияний с откатом","correct":true,"score":3,"goto":"ending_calc"},{"label":"Поднять порог автоматического слияния до 0.95","score":1,"feedback_after":"Не поможет: у ошибочных пар оценка 1.00. Порог не спасает, когда сравнивают не то.","goto":"ending_calc"},{"label":"Добавить паспорт в сравнение","score":2,"feedback_after":"Наполовину: это чинит ключ, но оставляет необратимость слияний и отсутствие ручного разбора.","goto":"ending_calc"},{"label":"Отключить автоматическую дедупликацию совсем","score":1,"feedback_after":"Безопасно, но база снова зарастёт дублями — задачу это не решает.","goto":"ending_calc"}],"text_accept":{"keywords_high":["паспорт","документ","ручн","верификац","откат","истори","порог","ключ"],"score_if_keyword":3,"score_default":1}},"ending_calc":{"type":"router","routes":[{"if":"clarity <= 0","goto":"ending_fail"},{"if":"score >= 8 && clarity >= 9","goto":"ending_perfect"},{"if":"score >= 6","goto":"ending_good"},{"if":"score >= 3","goto":"ending_weak"},{"default":"ending_wrong"}]},"ending_perfect":{"type":"ending","title":"Дело раскрыто. Чисто","text":["🏆 <b>Дело №2 закрыто</b>","","Двойник оказался настоящим: два человека с одинаковыми именем, отчеством, фамилией и датой рождения. Ошиблась не система — ошиблось требование, которое не смогло объяснить системе, что такое «человек».","","Итог: ключ сопоставления переписан на документ, порог поднят, спорные пары уходят оператору, история слияний ведётся отдельной таблицей — 29 неразобранных обращений наконец можно распутать по резервным копиям.","","Клиенту вернули коэффициент и доплатили разницу. Анастасии — премию за майское письмо, которое три месяца никто не читал.","","Сеня: «Запомните формулировку для будущих ТЗ: „считаются дублями при совпадении основных полей“ — это не требование. Это гороскоп»."],"rewards":["Значок «Мастер-данные»","Открыто дело №3"]},"ending_good":{"type":"ending","title":"Дело раскрыто","text":["✅ <b>Дело №2 закрыто</b>","","Причина установлена верно. Часть выводов пришлось дотягивать на защите: дирекция отдельно спрашивала, почему нельзя просто откатить слияния.","","Сеня: «Хорошо. В следующий раз приносите цену ошибки сразу — она убеждает лучше всего»."],"rewards":["Открыто дело №3"]},"ending_weak":{"type":"ending","title":"Ключ починили, дверь осталась открытой","text":["⚠️ <b>Дело закрыто наполовину</b>","","Паспорт добавили в сравнение, однофамильцы больше не склеиваются. Все выдохнули.","","Через месяц модуль сливает два юридических лица с одинаковым названием и адресом — у них ИНН отличается, но поле пустое у одной записи, и его снова исключили из сравнения. Историю слияний по-прежнему никто не ведёт.","","Сеня: «Вы починили случай. Правило осталось прежним: „угадай, что важно“»."]},"ending_wrong":{"type":"ending","title":"Не та причина","text":["❌ <b>Заключение отклонено</b>","","Ваша версия не объясняет, почему ошибочных слияний ровно 38, почему все они приходятся на тёзок-ровесников и почему ни одна пара не ушла на ручную проверку.","","Сеня: «Причина обязана объяснять числа. Если числа остаются необъяснёнными — это не причина, а подозрение»."]},"ending_fail":{"type":"ending","title":"Вас сняли с дела","text":["🚫 <b>Ясность 0</b>","","Три версии подряд рассыпались на первой же проверке. Дело передали внешнему консультанту — он начал с конфигурации правил сравнения и закрыл вопрос за день.","","Сеня: «Версии стоят дорого. Дешевле открыть настройки»."]}}},{"$schema_note":"Дело №3. Формат тот же, что и в case_01: многострочные тексты — массивы строк, схемы — поле ascii для моноширинного блока.","case_id":"case_03_payments","title":"Дело №3. Пропавшие платежи","subtitle":"Цифровой страж · расчётный центр «ЖилРасчёт»","difficulty":"средний+","estimated_minutes":24,"player":{"number":3,"cover":"payments","short":"Пропавшие платежи","teaser":"Расчётный центр ЖКХ. Жители платят, банк переводит, а долг растёт.","evidence":["c_registry","c_bank","c_buh","c_translog","c_nsi","c_mapping","c_seq","c_lineage","c_mail","c_ts"],"status":[["найден код, который объединяет пропажи","k_code"],["платежи ушли в отбраковку","k_reject"],["у шлюза своя копия справочника","k_copy"],["отбраковку никто не читает","k_owner"],["дыра в реестре потребителей","k_lineage"],["цепочка «5 почему» пройдена","k_chain"]]},"meta":{"root_cause":"С 1 июля в справочнике услуг НСИ для Заречного района введён новый код 0701 (новый региональный оператор по вывозу мусора). Трансформатор платёжных реестров сопоставляет коды по собственной таблице, которую подрядчик загрузил при внедрении в марте 2023 года и которая с тех пор не обновлялась. НСИ не знает, что трансформатор — потребитель справочника: в реестре потребителей его нет, и уведомление об изменении ему не пришло. Платежи с неизвестным кодом целиком уходят в отбраковку, а отчёт об отбраковке отправляется на почтовый ящик подрядчика, договор сопровождения с которым закрыт в марте 2026 года.","guilty":"Никто из людей единолично. Процесс ведения справочников не знает всех своих потребителей, а у очереди ошибок нет владельца. Интеграцию ввели без описания зависимостей от справочников и без передачи сопровождения.","component":"Процесс ведения НСИ (реестр потребителей справочника) + трансформатор платёжных реестров (таблица соответствия кодов, обработка отбраковки)","recommendation":"Внести трансформатор в реестр потребителей и перевести его на подписку на изменения справочника; вводить новые коды с периодом параллельного действия; назначить владельца отбраковки и сигнал о её росте","key_insight":"Ошибку не потеряли — её аккуратно записали и отправили туда, где её никто не прочтёт. Очередь ошибок без владельца — это та же потеря, только с логами.","red_herrings":["Банк задерживает или теряет платежи — выписка показывает, что все деньги пришли на счёт вовремя","Жители платят по старым квитанциям с ошибкой — квитанции новые, лицевые счета верные, код 0701 напечатан правильно","Инженер интеграции не обновил справочник — он пришёл в апреле и не знал о существовании таблицы: в передаточной документации её нет"],"season_thread":"ТЗ на трансформатор подготовлено ООО «Квадрат Решений» по шаблону КР-7 — тем же подрядчиком и по тому же шаблону, что ТЗ в делах №1 и №2. Отчёты об ошибках до сих пор уходят на их ящик сопровождения. Это улика для дела №4."},"clarity":{"start":12,"max":12,"fail_at":0,"label":"ясность"},"assistant":{"name":"Сеня, методолог","role":"объясняет, что такое НСИ, потребители справочника и очередь ошибок","hint_cost":1},"flags_reference":{"f_registry":"изучена сверка реестра банка и зачислений","f_bank":"изучена банковская выписка","f_buh":"изучены невыясненные поступления","f_translog":"изучен журнал трансформатора","f_nsi":"изучен журнал изменений НСИ","f_mapping":"изучена таблица соответствия кодов","f_seq":"изучена диаграмма последовательности","f_lineage":"изучен реестр потребителей справочника","f_mail":"изучены настройки уведомлений об отбраковке","f_ts":"изучено ТЗ на трансформатор","f_kira":"опрошена руководитель НСИ","f_pavel":"опрошен инженер интеграции","f_zoya":"опрошена главный бухгалтер","f_ruslan":"опрошен начальник абонентского отдела","k_money":"установлено: деньги дош
